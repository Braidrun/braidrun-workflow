id: computer_operator
display_name: "Computer Operator Agent"
description: "Automation agent preset for browser control, shell commands, file operations, databases, and image processing."
category: automation
icon: "🖥️"
builtin: true
parameters:

  # ============================================================
  # 1. CORE SETTINGS
  # ============================================================
  type: universal_agent
  name: "Computer Operator Agent"
  language: auto
  agent_version: "1.0.0"
  working_dir: "."
  output_dir: "."
  system_prompt: >-
    You are an expert computer operator and automation specialist. Your primary
    job is to perform computer operations, automate repetitive tasks, and manage
    system resources efficiently.

    Key capabilities and guidelines:
    - Use shell tools to execute system commands, manage processes, and perform
      file operations at the OS level.
    - Use browser tools for web-based automation tasks like form filling,
      clicking buttons, navigating websites, and taking screenshots.
    - Use file system tools to read, write, organize, and manage files and
      directories.
    - Use database tools to query and manage SQLite databases.
    - Use image processing tools for screenshot analysis, image conversion,
      and visual verification.
    - Use Git tools for version control operations when needed.
    - Always verify the result of each operation before proceeding to the next.
    - Handle errors gracefully and provide clear feedback on what went wrong.
    - When performing destructive operations (delete, overwrite), confirm the
      action and create backups when appropriate.
    - Organize multi-step automation workflows logically and provide progress
      updates.

  # ============================================================
  # 2. LLM CONFIGURATION
  # ============================================================
  llm_config:
    models:
      - model: minimax-m2.7
        provider: open_router
    fallback:
      model: minimax-m2.7
      provider: open_router
    temperature: 0.7

  retry_max_attempts: 3
  retry_initial_delay: 1000
  retry_max_delay: 10000


  # ============================================================
  # 3. STRATEGY & EXECUTION
  # ============================================================
  strategy: just_work_parallel
  sub_agent_strategy: just_work_parallel
  max_iterations: 8196
  num_choices: 1
  disable_cache_for_streaming: false

  # ============================================================
  # 4. TOOL SETS
  # ============================================================
  tool_set:
    - exit
    - sub_agent
    - shell
    - file_system
    - web
    - browser
    - database
    - image_processing
    - git
    - data_transform
    - knowledge_memory
    - skill_tools

  # ============================================================
  # 5. CACHE POLICY
  # ============================================================
  cache_policy: file
  memory_cache_max_entries: 4096
  file_cache_storage: ".prompt_cache"
  max_files: 1024

  # ============================================================
  # 6. STATE MANAGEMENT
  # ============================================================
  persistence_storage_type: file
  enable_persistence: false
  persistence_storage_root: ".snapshots"
  history_enabled: true
  history_storage_root: ".agent_history"
  history_max_messages: 50

  # ============================================================
  # 7. TRACING
  # ============================================================
  enable_langfuse_tracing: false

  # ============================================================
  # 8. SKILL TOOLS
  # ============================================================
  clawhub_base_url: "https://clawhub.ai"
  clawhub_cache_dir: "./skills"
  skills_config:
    skillWhitelistMode: false
    autoSearchDownload: false

  # ============================================================
  # 9. BROWSER
  # ============================================================
  PLAYWRIGHT_HEADLESS: false

  # ============================================================
  # 10. OPENROUTER
  # ============================================================
  openrouter_http_referer: "https://braidrun.io"
  openrouter_x_title: "Braidrun Agent"
