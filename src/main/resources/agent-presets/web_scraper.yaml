id: web_scraper
display_name: "Web Scraper Agent"
description: "专注于网页爬虫和数据采集的Agent。配备浏览器自动化、Web请求、数据转换、文件系统和OCR工具，擅长从网页中提取结构化数据。"
category: data
icon: "🕷️"
builtin: true
parameters:

  # ============================================================
  # 1. CORE SETTINGS
  # ============================================================
  type: universal_agent
  name: "Web Scraper Agent"
  language: auto
  agent_version: "1.0.0"
  working_dir: "."
  output_dir: "."
  system_prompt: >-
    You are an expert web scraper and data extraction specialist. Your primary
    job is to crawl websites, extract structured data from web pages, and save
    the results in organized formats (JSON, CSV, Excel, etc.).

    Key capabilities and guidelines:
    - Use browser tools for dynamic pages that require JavaScript rendering,
      cookie handling, or login authentication.
    - Use web tools (HTTP requests) for simple static pages and APIs.
    - Use OCR tools when you need to extract text from images on web pages.
    - Use data transform tools to convert between formats (JSON, YAML, CSV, XML).
    - Use file system tools to save extracted data to files.
    - Always respect robots.txt and rate limits. Add appropriate delays between
      requests to avoid overloading servers.
    - Handle pagination, infinite scroll, and lazy-loaded content gracefully.
    - Extract clean, well-structured data and remove unnecessary HTML/noise.
    - When scraping multiple pages, organize results systematically and provide
      progress updates.

  # ============================================================
  # 2. LLM CONFIGURATION
  # ============================================================
  llm_config:
    models:
      - model: minimax-m2.7
        provider: open_router
    fallback:
      model: minimax-m2.7
      provider: open_router
    temperature: 0.7

  retry_max_attempts: 3
  retry_initial_delay: 1000
  retry_max_delay: 10000


  # ============================================================
  # 3. STRATEGY & EXECUTION
  # ============================================================
  strategy: just_work_parallel
  sub_agent_strategy: just_work_parallel
  max_iterations: 8196
  num_choices: 1
  disable_cache_for_streaming: false

  # ============================================================
  # 4. TOOL SETS
  # ============================================================
  tool_set:
    - exit
    - sub_agent
    - shell
    - file_system
    - web
    - browser
    - data_transform
    - ocr
    - knowledge_memory
    - skill_tools

  # ============================================================
  # 5. CACHE POLICY
  # ============================================================
  cache_policy: file
  memory_cache_max_entries: 4096
  file_cache_storage: ".prompt_cache"
  max_files: 1024

  # ============================================================
  # 6. STATE MANAGEMENT
  # ============================================================
  persistence_storage_type: file
  enable_persistence: false
  persistence_storage_root: ".snapshots"
  history_enabled: true
  history_storage_root: ".agent_history"
  history_max_messages: 50

  # ============================================================
  # 7. TRACING
  # ============================================================
  enable_langfuse_tracing: false

  # ============================================================
  # 8. SKILL TOOLS
  # ============================================================
  clawhub_base_url: "https://clawhub.ai"
  clawhub_cache_dir: "./skills"
  skills_config:
    skillWhitelistMode: false
    autoSearchDownload: false

  # ============================================================
  # 9. BROWSER
  # ============================================================
  PLAYWRIGHT_HEADLESS: true

  # ============================================================
  # 10. OPENROUTER
  # ============================================================
  openrouter_http_referer: "https://braidrun.io"
  openrouter_x_title: "Braidrun Agent"
