id: asa
display_name: "Apple Search Ads Agent"
description: "专门用于Apple Search Ads广告管理和优化的Agent。"
category: marketing
icon: "🍎"
builtin: true
parameters:

  # ============================================================
  # 1. CORE SETTINGS
  # ============================================================
  type: asa_agent
  name: "Apple Search Ads Agent"
  language: auto
  agent_version: "1.0.0"
  working_dir: "."
  output_dir: "."
  system_prompt: >-
    You are an Apple Search Ads specialist. You manage and optimize
    ad campaigns, keywords, and bids for iOS apps. Analyze performance
    metrics and provide data-driven recommendations to improve
    ROAS and conversion rates. When real-time Braidrun MCP Search Ads
    tools are available, prefer using them to inspect live campaign,
    ad group, keyword, spend, and search term data before making
    recommendations. First discover which Braidrun MCP interface is
    exposed in the current runtime. If the server exposes
    searchads_list/searchads_call, use those tools directly. If the
    server exposes capability-style tools such as
    braidrun_capability_catalog, braidrun_capability_describe, or
    braidrun_capability_call, use those to find and call the Search Ads
    capabilities. When the user provides an app id, adamId, orgId, or
    campaign context, use it to narrow queries before giving advice.

  # ============================================================
  # 2. LLM CONFIGURATION
  # ============================================================
  llm_config:
    models:
      - model: minimax-m2.7
        provider: open_router
    fallback:
      model: minimax-m2.7
      provider: open_router
    temperature: 0.5

  retry_max_attempts: 3
  retry_initial_delay: 1000
  retry_max_delay: 10000


  # ============================================================
  # 3. STRATEGY & EXECUTION
  # ============================================================
  strategy: just_work
  sub_agent_strategy: just_work
  max_iterations: 4096
  num_choices: 1
  disable_cache_for_streaming: false

  # ============================================================
  # 4. TOOL SETS
  # ============================================================
  tool_set:
    - exit
    - shell
    - file_system
    - web
    - browser
    - skill_tools
  # ============================================================
  # 5. CACHE POLICY
  # ============================================================
  cache_policy: file
  memory_cache_max_entries: 4096
  file_cache_storage: ".prompt_cache"
  max_files: 1024

  # ============================================================
  # 6. STATE MANAGEMENT
  # ============================================================
  persistence_storage_type: file
  enable_persistence: false
  persistence_storage_root: ".snapshots"
  history_enabled: true
  history_storage_root: ".agent_history"
  history_max_messages: 50

  # ============================================================
  # 7. TRACING
  # ============================================================
  enable_langfuse_tracing: false

  # ============================================================
  # 8. BROWSER
  # ============================================================
  PLAYWRIGHT_HEADLESS: true

  # ============================================================
  # 9. SKILL TOOLS
  # ============================================================
  clawhub_base_url: "https://clawhub.ai"
  clawhub_cache_dir: "./skills"
  skills_config:
    skillWhitelistMode: false
    autoSearchDownload: false
  # ============================================================
  # 10. OPENROUTER
  # ============================================================
  openrouter_http_referer: "https://braidrun.io"
  openrouter_x_title: "Braidrun Agent"
