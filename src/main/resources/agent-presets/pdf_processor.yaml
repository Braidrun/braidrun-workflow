id: pdf_processor
display_name: "PDF Processor Agent"
description: "PDF processing agent preset for parsing, extraction, conversion, OCR, and image-related document work."
category: document
icon: "📄"
builtin: true
parameters:

  # ============================================================
  # 1. CORE SETTINGS
  # ============================================================
  type: universal_agent
  name: "PDF Processor Agent"
  language: auto
  agent_version: "1.0.0"
  working_dir: "."
  output_dir: "."
  system_prompt: >-
    You are a PDF document processing specialist. You excel at extracting,
    analyzing, and transforming content from PDF files. Use PDF tools
    to parse documents, OCR tools to extract text from scanned pages or
    images, image processing tools to handle embedded images, and file
    system tools to save results. Organize extracted information into
    structured formats.

  # ============================================================
  # 2. LLM CONFIGURATION
  # ============================================================
  llm_config:
    models:
      - model: minimax-m2.7
        provider: open_router
    fallback:
      model: minimax-m2.7
      provider: open_router
    temperature: 0.5

  retry_max_attempts: 3
  retry_initial_delay: 1000
  retry_max_delay: 10000


  # ============================================================
  # 3. STRATEGY & EXECUTION
  # ============================================================
  strategy: single_run_parallel
  sub_agent_strategy: just_work_parallel
  max_iterations: 4096
  num_choices: 1
  disable_cache_for_streaming: false

  # ============================================================
  # 4. TOOL SETS
  # ============================================================
  tool_set:
    - exit
    - file_system
    - pdf
    - shell
    - ocr
    - image_processing
    - data_transform
    - skill_tools
  # ============================================================
  # 5. CACHE POLICY
  # ============================================================
  cache_policy: file
  memory_cache_max_entries: 4096
  file_cache_storage: ".prompt_cache"
  max_files: 1024

  # ============================================================
  # 6. STATE MANAGEMENT
  # ============================================================
  persistence_storage_type: file
  enable_persistence: false
  persistence_storage_root: ".snapshots"
  history_enabled: true
  history_storage_root: ".agent_history"
  history_max_messages: 50

  # ============================================================
  # 7. TRACING
  # ============================================================
  enable_langfuse_tracing: false

  # ============================================================
  # 8. SKILL TOOLS
  # ============================================================
  clawhub_base_url: "https://clawhub.ai"
  clawhub_cache_dir: "./skills"
  skills_config:
    skillWhitelistMode: false
    autoSearchDownload: false
  # ============================================================
  # 9. OPENROUTER
  # ============================================================
  openrouter_http_referer: "https://braidrun.io"
  openrouter_x_title: "Braidrun Agent"
