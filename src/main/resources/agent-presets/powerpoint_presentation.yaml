id: powerpoint_presentation
display_name: "PowerPoint Presentation Agent"
description: "Presentation agent preset for PowerPoint decks, training material, and visual briefing documents."
category: document
icon: "📽️"
builtin: true
parameters:

  # ============================================================
  # 1. CORE SETTINGS
  # ============================================================
  type: universal_agent
  name: "PowerPoint Presentation Agent"
  language: auto
  agent_version: "1.0.0"
  working_dir: "."
  output_dir: "."
  system_prompt: >-
    You are a professional PowerPoint presentation specialist. You excel at
    creating rich .pptx slide decks, training materials, pitch decks, and
    executive presentations. Use PowerPoint tools to compose slides with
    strong hierarchy, layouts, tables, images, notes, and backgrounds. Use
    multimedia and image processing tools to generate or prepare visuals
    before placing them on slides. Prioritize clarity, pacing, and visual
    polish for the intended audience.

  # ============================================================
  # 2. LLM CONFIGURATION
  # ============================================================
  llm_config:
    models:
      - model: minimax-m2.7
        provider: open_router
    fallback:
      model: minimax-m2.7
      provider: open_router
    temperature: 0.9

  retry_max_attempts: 3
  retry_initial_delay: 1000
  retry_max_delay: 10000

  # ============================================================
  # 3. STRATEGY & EXECUTION
  # ============================================================
  strategy: just_work_parallel
  sub_agent_strategy: just_work_parallel
  max_iterations: 4096
  num_choices: 1
  disable_cache_for_streaming: false

  # ============================================================
  # 4. TOOL SETS
  # ============================================================
  tool_set:
    - exit
    - sub_agent
    - shell
    - file_system
    - powerpoint
    - multimedia
    - image_processing
    - web
    - skill_tools

  # ============================================================
  # 5. CACHE POLICY
  # ============================================================
  cache_policy: file
  memory_cache_max_entries: 4096
  file_cache_storage: ".prompt_cache"
  max_files: 1024

  # ============================================================
  # 6. STATE MANAGEMENT
  # ============================================================
  persistence_storage_type: file
  enable_persistence: false
  persistence_storage_root: ".snapshots"
  history_enabled: true
  history_storage_root: ".agent_history"
  history_max_messages: 50

  # ============================================================
  # 7. TRACING
  # ============================================================
  enable_langfuse_tracing: false

  # ============================================================
  # 8. SKILL TOOLS
  # ============================================================
  clawhub_base_url: "https://clawhub.ai"
  clawhub_cache_dir: "./skills"
  skills_config:
    skillWhitelistMode: false
    autoSearchDownload: false

  # ============================================================
  # 9. BROWSER
  # ============================================================
  PLAYWRIGHT_HEADLESS: true

  # ============================================================
  # 10. OPENROUTER
  # ============================================================
  openrouter_http_referer: "https://braidrun.io"
  openrouter_x_title: "Braidrun Agent"
