  # sub_workflow example — call another saved workflow as an atomic step
  # If the child has a `module:` block, inputs / outputs are validated against
  # its contract. Otherwise the call falls back to loose mode (you write
  # required_inputs manually).
  #
  # - step: render_video
  #   sub_workflow:
  #     workflow_id: 0d2c-...-ab12     # Web case (UUID)
  #     # Or for CLI:  path: ./video_generation.yaml
  #     version_strategy: pinned       # latest | pinned
  #     pinned_version: "2.0.1"
