#   max_total_chunks: 0
#   auto_inject_rag_tools: true
#   source_files:
#     - path: "./docs/spec.md"
#       tags: "spec,reference"

# Optional shared code preamble (keyed by language).
# Each language entry is either `inline` OR `ref`, never both.
# code_preamble:
#   python:
#     ref: "./skills/braidrun_workflow_utils.py"
#     description: "Shared Python helpers"
#   bash:
#     inline: |
#       set -euo pipefail
#       export LANG=en_US.UTF-8
#     description: "Bash safety defaults"

# Optional workflow-level editing assistant
# global_agent:
#   enabled: true
#   agent:
#     preset: universal
#     session_id_strategy: per_execution
#     overrides:
#       tool_set:
#         - workflow
#         - skill_tools
#   tool_parameters: {}
#   multimedia:
#     api_key: "sk-..."
#     base_url: "https://openrouter.ai/api/v1"
#     image_model: "gpt-image-1"
#     audio_model: "gpt-4o-audio-preview"

workflow:
  - step: classify_request
    classifier:
      agent: classifier_agent
      input: |
        Classify the request below:
        {{var:user_input}}
      categories:
        - name: technical
          description: "Technical issue"
        - name: content
          description: "Content generation or editing request"
      output_variable: request_type
      default_category: content

  - step: handle_content_request
    agent: worker
    condition: "request_type == content"
    input: |
      Create a first draft about {{var:topic}}.
      Original request: {{var:user_input}}
    depends_on:
      - classify_request
    extract:
      - pattern: "quality_score=(\\d+)"
        variable: draft_quality

  - step: refine_content
    agent: worker
    input: |
      Improve the content about {{var:topic}}.
      Previous result:
      {{steps.handle_content_request.output}}
      Current quality score: {{var:quality_score}}
    repeat_until:
      condition: "quality_score >= 8"
      max_iterations: 3
      evaluate_agent: reviewer
      evaluate_prompt: |
        Review the following content and output quality_score=N:
        {{steps.refine_content.output}}
      extract_pattern: "quality_score=(\\d+)"
      extract_variable: quality_score
    depends_on:
      - handle_content_request

  - step: generate_tasks
    code:
      language: python
      script: |
        import os
        request_type = os.environ.get("WF_VAR_REQUEST_TYPE", "content")
        if request_type == "content":
            print("outline\nfirst draft\nfinal polish")
        else:
            print("triage\ninvestigate\nrespond")
      timeout: 30
    depends_on:
      - classify_request

  - step: execute_tasks
    agent: worker
    input: |
      Execute task #{{var:task_index}}:
      {{var:task_item}}
    iterate_over:
      source: "{{steps.generate_tasks.output}}"
      delimiter: "\n"
      item_variable: task_item
      index_variable: task_index
      max_items: 10
      parallel: false
      results_variable: task_results
    depends_on:
      - generate_tasks

  - step: summarize_results
    agent: reviewer
    input: |
      Summarize the final workflow output.
      Aggregated tasks:
      {{var:all_results}}
    aggregate:
      sources:
        - "{{steps.refine_content.output}}"
        - "{{var:task_results}}"
      strategy: numbered_list
      output_variable: all_results
    depends_on:
      - refine_content
      - execute_tasks

  # group_chat example
  # - step: team_discussion
