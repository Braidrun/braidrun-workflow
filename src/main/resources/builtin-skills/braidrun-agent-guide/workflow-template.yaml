# Braidrun workflow template
#
# Source of truth:
# - braidrun-agent WorkflowDefinition / WorkflowParser / WorkflowExecutor
#
# Rules:
# 1. YAML keys use snake_case
# 2. Each step must use exactly one main mode:
#    - agent + input
#    - group_chat
#    - agent_based
#    - code
#    - classifier
#    - state_machine
# 3. Branching should be done with depends_on + condition
# 4. condition only supports simple expressions:
#    route == coding
#    score >= 8
#    summary contains urgent
# 5. Do not put {{var:...}} inside condition strings
# 6. repeat_until is mainly for single-agent/group_chat steps; code and agent_based do not support it
# 7. iterate_over is only for single-agent/code steps, and cannot be combined with
#    step-level parallel / retry / repeat_until / manual_approval / timeout_seconds
# 8. step-level parallel is only for single-agent steps
# 9. Generated workflows should explicitly set session_id_strategy on every top-level agent,
#    every agent_based.orchestrator, and global_agent.agent
# 10. Prefer per_execution for sequentially reused roles; prefer auto for iterate_over / parallel / fan-out workers
# 11. code_preamble is keyed by language (python / javascript / typescript / bash / ruby / lua / cli)
# 12. Each preamble entry must be either inline OR ref (mutually exclusive)

name: example-workflow
version: "1.0.0"
description: |
  Replace this with your workflow description.

tags:
  - example
  - workflow

category: automation

variables:
  topic: "AI workflow"
  user_input: "Please process this request"
  quality_score: "0"

agents:
  classifier_agent:
    preset: universal
    session_id_strategy: auto
    overrides:
      system_prompt: "You are a classification expert."
      tool_set:
        - exit
        - skill_tools

  worker:
    preset: coder
    session_id_strategy: per_execution
    overrides:
      system_prompt: "You are a worker agent."
      tool_set:
        - exit
        - file_system
        - shell

  reviewer:
    preset: universal
    session_id_strategy: per_execution
    overrides:
      system_prompt: "You are a reviewer. Output quality_score=N when evaluating."
      tool_set:
        - exit
        - file_system

  # Optional document specialists (built-in presets):
  # word_writer:
  #   preset: word_document
  #   session_id_strategy: auto
  #
  # excel_builder:
  #   preset: excel_workbook
  #   session_id_strategy: auto
  #
  # slide_designer:
  #   preset: powerpoint_presentation
  #   session_id_strategy: auto

error_handling:
  max_retries: 3
  retry_delay: 5s
  continue_on_error: false

timeout:
  total: 1200s
  per_step: 180s

directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72

concurrency:
  enabled: false
  max_concurrency: 0

# Optional shared knowledge base
# knowledge_base:
#   enabled: true
#   storage_dir: "./workflow-kb"
#   embedding_model: "text-embedding-3-small"
#   embedding_provider: "openai"
#   auto_index_outputs: true
#   chunk_size: 1000
