  #     kb_scope: isolated             # isolated (default) / inherit / extend
  #     missing_reference_policy: error  # error / warn / skip_step
  #     max_depth: 4
  #   depends_on:
  #     - prepare
  #   extract:
  #     - json_path: "$.video_path"
  #       variable: captured_path

# Optional: declare this workflow as a reusable module by adding a top-level
# `module:` block. Once declared, parent workflows can call this workflow with
