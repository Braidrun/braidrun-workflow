# braidrun-agent configuration template
#
# Current launch examples:
#   braidrun-agent --help
#   braidrun-agent --list-presets
#   braidrun-agent --list-strategies
#   braidrun-agent --list-tools
#   braidrun-agent -c this-file.yaml
#   braidrun-agent -a universal -c this-file.yaml
#   braidrun-agent -a coder -c this-file.yaml
#
# Important:
# - `braidrun-agent -c this-file.yaml` means "use this file as the complete agent config"
# - `braidrun-agent -a universal -c this-file.yaml` means "merge universal preset defaults, then override with this file"
# - If you want config-only behavior, omit `-a`
# - CLI flag -a / --agent uses preset IDs such as universal, universal_reasoning, coder, researcher,
#   writer, data_analyst, asa, pdf_processor, lightweight, chat, office_document, word_document,
#   excel_workbook, powerpoint_presentation, multimedia_creator, devops, communication, web_scraper,
#   computer_operator
# - Do NOT use old CLI names like universal_agent or pdf_agent
# - This file stores agent parameters, not CLI commands
# - Skill whitelist / blacklist can also be controlled at runtime via:
#     --skill-whitelist-mode  --enabled-skill foo  --disabled-skill bar

parameters:

  # ============================================================
  # 1. Core settings
  # ============================================================

  - language: auto
  - prompt: "请在这里填写你的任务描述"
  - name: "Universal AI Agent"
  - agent_version: "1.0.0"
  - working_dir: "."
  - output_dir: "."

  # Optional
  # - system_prompt: "You are a helpful assistant."
  # - session_id: "my-session-001"
  # - user_agent: "BraidrunAgent/1.0.0"

  # compact_env: when true (default), sends minimal environment info to LLM (~5 lines),
  # reducing token consumption by ~70%. Set to false for full verbose env info.
  # - compact_env: true

  # ============================================================
  # 2. LLM configuration
  # ============================================================

  - llm_config:
      models:
        - model: your-model-id
          provider: open_router
          # baseUrl: "https://openrouter.ai/api/v1"
          # maxToken: 4096
          # isVision: true
      fallback:
        model: your-model-id
        provider: open_router
      temperature: 0.7

  - retry_max_attempts: 3
  - retry_initial_delay: 1000
  - retry_max_delay: 10000

  # ============================================================
  # 3. Provider keys
  # ============================================================

  - llm_provider_keys:
      openrouter: "${OPENROUTER_API_KEY}"
      # openai: "${OPENAI_API_KEY}"
      # anthropic: "${ANTHROPIC_API_KEY}"
      # deepseek: "${DEEPSEEK_API_KEY}"
      # google: "AIza-your-google-key"
      # ollama: ""

  - openrouter_http_referer: "https://braidrun.io"
  - openrouter_x_title: "Braidrun Agent"

  # ============================================================
  # 4. Strategy & execution
  # ============================================================

  - strategy: just_work_parallel
  - sub_agent_strategy: just_work_parallel
  - strategy_name: "default"
  - max_iterations: 8196
  - reasoning_interval: 1
  - show_reasoning: true
  - num_choices: 1
  - disable_cache_for_streaming: false

  # Common strategy names:
  # chat
  # chat_with_summary
  # continue_chat
  # just_work
  # just_work_parallel
  # just_work_parallel_reasoning
  # react
  # react_original
  # plan_solve
  # plan_solve_reasoning
  # tone
  # tone_reasoning
  # single_run              (default)
  # single_run_parallel
  # single_run_reasoning
  # single_run_parallel_reasoning

  # ============================================================
  # 5. Tool sets
  # ============================================================

  - tool_set:
      - exit
      - file_system
      - shell
      - sub_agent
      - workflow
      # - web
      # - browser
      # - office
      # - word
      # - excel
      # - powerpoint
      # - pdf
      # - csv
      # - code_execution
      # - git
      # - database
      # - ocr
      # - data_transform
      # - knowledge_memory
      # - skill_tools
      # - interactive
      # - image_processing
      # - multimedia
      # - email
      # - im
      # - calendar
      # - iwork
      # - apple_app_info
      # - rag_tools

  # ============================================================
  # 6. Skills, history, MCP (optional)
  # ============================================================

  # - skills_config:
  #     skillsPath: "./skills"
  #     scanStandardPaths: true
  #     enabled: true
  #     skillWhitelistMode: false
  #     enabledSkills: ["braidrun-agent-guide"]  # 仅在 skillWhitelistMode=true 时生效
  #     disabledSkills: []                       # 强制屏蔽指定 skill（无论模式）
  #     builtinSkillsEnabled: true
  #     hooksEnabled: true
  #
  # CLI 等价覆盖（不修改 YAML 文件）：
  #   --skill-whitelist-mode --enabled-skill braidrun-agent-guide --enabled-skill workflow-builder
  #   --disabled-skill heavy-skill,another-skill

  # - history_enabled: true
  # - history_storage_root: ".agent_history"

  # - mcp_servers:
  #     example_server:
  #       command: "npx"
  #       args: ["-y", "@modelcontextprotocol/server-everything"]

  # ============================================================
  # 7. Cache / persistence (optional)
  # ============================================================

  - cache_policy: file
  - memory_cache_max_entries: 4096

  # - redis_client_url: "redis://localhost:6379"
  # - file_cache_storage: ".prompt_cache"

  # - persistence_storage_type: file
  # - persistence_namespace: "braidrun-agent"
  # - persistence_storage_root: ".agent_state"
