# Minimal runtime parameter template.
# Pass these values through CLI --param key=value or construct ConfigurationParameter values in Kotlin.

subprocess_mode: native
working_dir: "."
output_dir: "./output"

# Use docker for production or untrusted subprocess work.
# subprocess_mode: docker
# docker_exec_image_tag: "1.0"
# docker_egress_network: workflow-egress-only

# LLM credentials should normally come from environment variables.
# OPENROUTER_API_KEY=...
# ANTHROPIC_API_KEY=...
# OPENAI_API_KEY=...

# TypeSafe Jev (decision model) for classifier.jev / repeat_until.jev only; not an agent provider.
# TYPESAFE_API_KEY=...
# TYPESAFE_DEFAULT_MODEL=jev-latest        # optional
# TYPESAFE_BASE_URL=https://api.typesafe.ai # optional, operator setting
# Or as runtime parameters:
# typesafe_api_key: "..."
# typesafe_model: jev-latest

# External Claude Code / Codex agent options.
# external_agent_claude_command: claude
# external_agent_claude_model: sonnet
# external_agent_codex_command: codex
# external_agent_codex_model: gpt-5.5

# Images returned by browser_screenshot / MCP tools (vision models only).
# tool_result_images_enabled: true
# tool_result_images_max_per_request: 4   # 0-12, re-sent every round
# tool_result_images_max_per_run: 24      # 0-200, 0 = off
