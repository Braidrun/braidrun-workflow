provider: lmstudio
aliases:
- lm-studio
- lm_studio
models:
  # LM Studio exposes local models through an OpenAI-compatible API.
  # After downloading a model in the LM Studio UI, register it here by its model ID.
  # The model ID is the identifier shown in LM Studio.
  #
  # The entries below predefine common LM Studio local models.
  # You can also override or add your own downloaded models in ./models/lmstudio.yaml.

  # ===== Meta Llama =====
  "llama-3.3-70b":
    id: "llama-3.3-70b-instruct"
    capabilities: standard
    context_length: 131072
  "llama-3.1-8b":
    id: "llama-3.1-8b-instruct"
    capabilities: standard
    context_length: 131072
  "llama-3.2-3b":
    id: "llama-3.2-3b-instruct"
    capabilities: standard
    context_length: 131072
  "llama-3.2-1b":
    id: "llama-3.2-1b-instruct"
    capabilities: standard
    context_length: 131072

  # ===== Qwen =====
  "qwen3-8b":
    id: "qwen3-8b"
    capabilities: standard
    context_length: 131072
  "qwen3-4b":
    id: "qwen3-4b"
    capabilities: standard
    context_length: 131072
  "qwen3-1.7b":
    id: "qwen3-1.7b"
    capabilities: standard
    context_length: 32768
  "qwen2.5-7b-instruct":
    id: "qwen2.5-7b-instruct"
    capabilities: standard
    context_length: 131072
  "qwen2.5-coder-7b-instruct":
    id: "qwen2.5-coder-7b-instruct"
    capabilities: standard
    context_length: 131072

  # ===== Google Gemma =====
  "gemma-3-12b":
    id: "gemma-3-12b-it"
    capabilities: multimodal
    context_length: 131072
  "gemma-3-4b":
    id: "gemma-3-4b-it"
    capabilities: multimodal
    context_length: 131072
  "gemma-2-9b":
    id: "gemma-2-9b-it"
    capabilities: standard
    context_length: 8192
  "gemma-2-2b":
    id: "gemma-2-2b-it"
    capabilities: standard
    context_length: 8192

  # ===== Microsoft Phi =====
  "phi-4":
    id: "phi-4"
    capabilities: standard
    context_length: 16384
  "phi-3.5-mini":
    id: "phi-3.5-mini-instruct"
    capabilities: standard
    context_length: 131072
  "phi-3-mini":
    id: "phi-3-mini-4k-instruct"
    capabilities: standard
    context_length: 4096

  # ===== Mistral =====
  "mistral-7b":
