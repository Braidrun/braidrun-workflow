provider: deepseek
models:
  # ===== DeepSeek V4 =====
  # api-docs.deepseek.com (2026-09-26) lists exactly two API model names:
  # `deepseek-flash` (DeepSeek-V4.1-Flash, vision) and `deepseek-v4-pro`.
  # Both think by default and serve a 1M context with up to 384K output.
  # The legacy `deepseek-chat` / `deepseek-reasoner` names were discontinued
  # on 2026-07-24; `deepseek-v4-flash` is still accepted but only routed to
  # V4.1 Flash, so that key now sends the canonical id.
  "deepseek-flash":
    id: "deepseek-flash"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, multiple_choices, vision, thinking
    context_length: 1048576
    max_output_tokens: 393216
  "deepseek-v4-pro":
    id: "deepseek-v4-pro"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, multiple_choices, thinking
    context_length: 1048576
    max_output_tokens: 393216
  "deepseek-v4-flash":
    id: "deepseek-flash"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, multiple_choices, vision, thinking
    context_length: 1048576
    max_output_tokens: 393216
