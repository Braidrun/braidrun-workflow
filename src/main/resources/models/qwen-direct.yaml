provider: qwen_direct
aliases:
- dashscope
- qwen-direct
models:
  # Served by Koog's OpenAILLMClient against DashScope's OpenAI-compatible
  # endpoint (Beijing), which needs `openai.completions` on every entry.
  # Qwen3.x ids and limits verified against Alibaba Cloud Model Studio model
  # pages (2026-09-26). The OpenRouter spellings of the same models live in
  # qwen.yaml / openrouter.yaml.
  # ===== Qwen 3.8 / 3.7 / 3.6 / 3.5 =====
  "qwen3.8-max":
    id: "qwen3.8-max"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, vision, vision.video, openai.completions
    context_length: 1000000
    max_output_tokens: 131072
  "qwen3.8-flash":
    id: "qwen3.8-flash"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, vision, vision.video, openai.completions
    context_length: 1000000
    max_output_tokens: 131072
  "qwen3.7-max":
    id: "qwen3.7-max"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, openai.completions
    context_length: 1000000
    max_output_tokens: 131072
  "qwen3.7-plus":
    id: "qwen3.7-plus"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, vision, vision.video, openai.completions
    context_length: 1000000
    max_output_tokens: 131072
  "qwen3.6-plus":
    id: "qwen3.6-plus"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, vision, vision.video, openai.completions
    context_length: 1000000
    max_output_tokens: 65536
  "qwen3.5-plus":
    id: "qwen3.5-plus"
    capabilities: completion, temperature, tools, tool_choice, json.basic, json, thinking, vision, vision.video, openai.completions
    context_length: 1000000
    max_output_tokens: 65536
  # ===== Qwen Max =====
  "qwen-max":
    id: "qwen-max"
    capabilities: standard, openai.completions
    context_length: 32768
  "qwen-max-latest":
