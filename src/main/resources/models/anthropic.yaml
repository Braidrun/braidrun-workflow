  "claude-sonnet-4":
    id: "claude-sonnet-4-0"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 200000
    max_output_tokens: 64000
  "claude-opus-4":
    id: "claude-opus-4-0"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 200000
    max_output_tokens: 32000
  # ===== Convenience aliases → the current model of each tier =====
  # `claude-opus` / `claude-sonnet` stay on the newest models that still accept
  # sampling params and forced tool choice (Opus 4.8 / Sonnet 4.6): the engine
  # sends temperature and forces tool choice until the runtime guards land, and
  # Opus 5 / Sonnet 5 would 400 on both. Retarget to 5.x once the guards ship.
  "claude-fable":
    id: "claude-fable-5-1"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
