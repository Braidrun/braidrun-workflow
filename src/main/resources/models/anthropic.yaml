provider: anthropic
models:
  # Anthropic's first-party API takes dashed ids (`claude-opus-4-7`); dotted
  # spellings are OpenRouter's and 400 here. Limits and lifecycle verified
  # against platform.claude.com models overview + model-deprecations
  # (2026-09-26).
  #
  # Capability rules the YAML must honour on its own:
  # - Claude Opus 4.7 and later (Fable 5.x, Opus 5.x, Sonnet 5) reject
  #   sampling parameters, so they never declare `temperature`.
  # - Thinking is on by default for Fable 5.x, Opus 5, Opus 5.5 and Sonnet 5;
  #   forced tool choice (`any` / `tool`) 400s there, so they omit `tool_choice`.
  # - Every entry declares `thinking`: replaying a thinking block requires it.

  # ===== Claude 5 =====
  "claude-fable-5-1":
    id: "claude-fable-5-1"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-fable-5":
    id: "claude-fable-5"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-5-5":
    id: "claude-opus-5-5"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-5":
    id: "claude-opus-5"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-sonnet-5":
    id: "claude-sonnet-5"
    capabilities: tools, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  # ===== Claude 4.x =====
  # Opus 4.7 / 4.8 run without thinking unless asked, so forced tool choice works.
  "claude-opus-4-8":
    id: "claude-opus-4-8"
    capabilities: tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-4-7":
    id: "claude-opus-4-7"
    capabilities: tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-4-6":
    id: "claude-opus-4-6"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-sonnet-4-6":
    id: "claude-sonnet-4-6"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-4-5":
    id: "claude-opus-4-5"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 200000
    max_output_tokens: 64000
  "claude-sonnet-4-5":
    id: "claude-sonnet-4-5"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 200000
    max_output_tokens: 64000
  "claude-haiku-4-5":
    id: "claude-haiku-4-5"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 200000
    max_output_tokens: 64000
  # ===== Dotted spellings kept for saved configs =====
  # Earlier releases keyed these models by their OpenRouter spelling and sent
  # it verbatim, which the first-party API rejects. The keys stay resolvable
  # (the registry has no hidden-alias concept) but now send the dashed id.
  "claude-opus-4.7":
    id: "claude-opus-4-7"
    capabilities: tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-4.6":
    id: "claude-opus-4-6"
    capabilities: temperature, tools, tool_choice, vision, document, completion, json.basic, json, thinking
    context_length: 1000000
    max_output_tokens: 128000
  "claude-sonnet-4.6":
