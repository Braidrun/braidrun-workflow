provider: mistral
aliases:
- mistralai
models:
  # The `mistral` provider is routed through OpenRouter, so every id must be an
  # OpenRouter slug (`mistralai/...`); bare La Plateforme ids such as
  # `mistral-large-latest` are rejected there. Ids checked against
  # openrouter.ai/api/v1/models, and the `-latest` targets against
  # docs.mistral.ai models overview (2026-09-26). Retired models (Pixtral,
  # Codestral Mamba, Devstral Small, Mixtral 8x7B, Mistral 7B, Large 2411)
  # are gone.
  # ===== Mistral Large =====
  "mistral-large-2512":
    id: "mistralai/mistral-large-2512"
    capabilities: multimodal
    context_length: 262144
  # Mistral's `-latest` aliases: keys kept for saved configs, now sent as the
  # dated OpenRouter slug the alias currently points to.
  "mistral-large-latest":
    id: "mistralai/mistral-large-2512"
    capabilities: multimodal
    context_length: 262144
  "mistral-large":
    id: "mistralai/mistral-large"
    capabilities: standard
    context_length: 128000
  # ===== Mistral Medium =====
  "mistral-medium-3-5":
    id: "mistralai/mistral-medium-3-5"
    capabilities: multimodal
    context_length: 262144
