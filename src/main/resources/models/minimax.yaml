provider: minimax
models:
  # Served by Koog's OpenAILLMClient, which needs `openai.completions` on every
  # entry. MiniMax-M3 / M2.x ids and context windows verified against the
  # MiniMax OpenAI-compatible API reference (2026-09-26).
  "minimax-m3":
    id: "MiniMax-M3"
    capabilities: multimodal, openai.completions
    context_length: 1000000
