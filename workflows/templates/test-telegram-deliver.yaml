---
name: test-telegram-deliver
version: 1.0.0
description: |
  Negative-path test for braidrun-module-telegram-deliver.

  Without a real Telegram bot token, we verify the module's pre-flight
  validation: empty telegram_bot_token should raise in prepare_payload
  before any LLM or network activity. Uses on_failure recovery so the
  test workflow can still assert on the outcome.

tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: missing_token
    sub_workflow:
      name: braidrun-module-telegram-deliver
      inputs:
        telegram_bot_token: ""
        telegram_chat_id: ""
        message_text: "this should never be sent"
      outputs:
        td_status: delivery_status
        td_message: delivery_message
        td_target: delivery_target
    on_failure:
      - next: assert
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        status = os.environ.get("WF_VAR_TD_STATUS", "").strip()
        message = os.environ.get("WF_VAR_TD_MESSAGE", "").strip()
        target = os.environ.get("WF_VAR_TD_TARGET", "").strip()

        problems = []
        # Module raises on empty token/chat_id → outputs stay empty (the module
        # didn't get far enough to write them).
        if status != "":
            problems.append(f"delivery_status should be empty (pre-flight raised), got '{status}'")
        if message != "":
            problems.append(f"delivery_message should be empty (pre-flight raised), got '{message}'")
        if target != "":
            problems.append(f"delivery_target should be empty (pre-flight raised), got '{target}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass (module correctly rejected empty token/chat)")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    priority: 5
