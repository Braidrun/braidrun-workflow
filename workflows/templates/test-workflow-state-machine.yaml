---
name: test-workflow-state-machine
version: 1.0.0
tags:
  - 测试
  - 状态机节点
  - state_machine
  - code
  - classifier
  - condition
  - extract
description: |
  状态机节点功能测试模板。
  演示 state_machine 作为 DAG 节点的基本用法：
  - 在节点内部执行 code / agent 状态
  - 使用 extract 提取变量驱动状态迁移
  - 通过 review_flow_final_state / review_flow_last_output 等变量向下游步骤暴露结果
variables:
  draft_text: 请审阅这段产品文案并给出结论
  desired_decision: approved
  output_dir: "./output"
  demo_mode: 'true'
agents:
  helper:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow helper. Complete the requested step precisely and keep outputs concise.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 4096
      session_id_strategy: auto
workflow:
- step: review_flow
  state_machine:
    initial_state: classify
    final_states:
    - approved
    - revise_done
    max_transitions: 8
    states:
      classify:
        name: classify
        step:
          code:
            language: bash
            script: |
              echo "decision=${WF_VAR_DESIRED_DECISION}"
              echo "score=8"
          extract:
          - pattern: decision=(\w+)
            variable: review_decision
          - pattern: score=(\d+)
            variable: review_score
        transitions:
        - event: complete
          target: approved
          condition: review_decision == approved
        - event: complete
          target: revise
          condition: review_decision == revise
      revise:
        name: revise
        step:
          agent: helper
          input: |
            请根据以下草稿生成一版修订说明，并将结果保存到 {{var:output_dir}}/state_machine_revise.md：
            {{var:draft_text}}
        transitions:
        - event: complete
          target: revise_done
      approved:
        name: approved
      revise_done:
        name: revise_done
- step: final_report
  agent: helper
  input: |
    生成状态机节点总结，并保存到 {{var:output_dir}}/state_machine_report.md：
    最终状态：{{var:review_flow_final_state}}
    分类输出：{{var:review_flow_classify_output}}
    最后输出：{{var:review_flow_last_output}}
    历史：{{var:review_flow_history}}
  depends_on:
  - review_flow
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: false
  max_concurrency: 0
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
