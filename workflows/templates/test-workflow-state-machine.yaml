description: |
  State-machine node feature test template.
  Demonstrates the basic use of state_machine as a DAG node:
  - run code / agent states inside a node
  - use extract to drive state transitions from variables
  - expose results to downstream steps via variables such as review_flow_final_state / review_flow_last_output
