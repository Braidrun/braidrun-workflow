variables:
  draft_text: Please review this product copy and give a conclusion
  desired_decision: approved
  output_dir: "./output"
  demo_mode: 'true'
agents:
  helper:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow helper. Complete the requested step precisely and keep outputs concise.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 4096
      session_id_strategy: auto
workflow:
- step: review_flow
  state_machine:
    initial_state: classify
    final_states:
    - approved
    - revise_done
    max_transitions: 8
    states:
      classify:
        name: classify
        step:
          code:
            language: bash
            script: |
              echo "decision=${WF_VAR_DESIRED_DECISION}"
              echo "score=8"
          extract:
          - pattern: decision=(\w+)
            variable: review_decision
          - pattern: score=(\d+)
            variable: review_score
        transitions:
        - event: complete
          target: approved
          condition: review_decision == approved
        - event: complete
          target: revise
          condition: review_decision == revise
      revise:
        name: revise
        step:
          agent: helper
          input: |
            Based on the following draft, produce a revision note and save the result to {{var:output_dir}}/state_machine_revise.md:
            {{var:draft_text}}
        transitions:
        - event: complete
          target: revise_done
      approved:
        name: approved
      revise_done:
        name: revise_done
- step: final_report
  agent: helper
  input: |
    Generate a summary of the state-machine node and save it to {{var:output_dir}}/state_machine_report.md:
    Final state: {{var:review_flow_final_state}}
    Classification output: {{var:review_flow_classify_output}}
    Last output: {{var:review_flow_last_output}}
    History: {{var:review_flow_history}}
  depends_on:
  - review_flow
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: false
  max_concurrency: 0
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
