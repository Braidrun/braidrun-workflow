---
name: test-wikipedia-lookup
version: 1.0.0
description: Test wikipedia-lookup on a stable topic.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-wikipedia-lookup
      inputs: {query: "Python (programming language)", language: "en"}
      outputs:
        t: title
        ex: extract
        url: page_url
        status: wiki_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        ex = os.environ.get("WF_VAR_EX", "")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if len(ex) < 50: print(f"TEST_STATUS=fail\n  - extract too short: {ex}"); sys.exit(1)
        if "python" not in ex.lower(): print(f"TEST_STATUS=fail\n  - extract doesn't mention python"); sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
