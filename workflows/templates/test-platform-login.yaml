---
name: test-platform-login
version: 1.0.0
description: |
  Test harness for braidrun-module-platform-login — both positive path (real creds,
  expect auth_status=ok) and negative path (bad creds → auth_status=failed).

  Requires real configured test credentials via CLI variables, e.g.
  `-v test_username="$BRAIDRUN_TEST_USERNAME" -v test_password="$BRAIDRUN_TEST_PASSWORD"`.

tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""
  test_braidrun_platform: "braidrun"

agents: {}

workflow:
  - step: real_login
    sub_workflow:
      name: braidrun-module-platform-login
      inputs:
        platform: web
        username: "{{var:test_username}}"
        password: "{{var:test_password}}"
        braidrun_platform: "{{var:test_braidrun_platform}}"
      outputs:
        real_status: auth_status
        real_message: auth_message
        real_platform: auth_platform
    priority: 20

  - step: bad_login
    sub_workflow:
      name: braidrun-module-platform-login
      inputs:
        platform: web
        username: "{{var:test_username}}"
        password: "__wrong_password_12345__"
        braidrun_platform: "{{var:test_braidrun_platform}}"
      outputs:
        bad_status: auth_status
        bad_message: auth_message
    priority: 15

  - step: missing_creds
    sub_workflow:
      name: braidrun-module-platform-login
      inputs:
        platform: web
        username: ""
        password: ""
      outputs:
        mc_status: auth_status
        mc_message: auth_message
    priority: 14

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []

        rs = os.environ.get("WF_VAR_REAL_STATUS", "").strip()
        rp = os.environ.get("WF_VAR_REAL_PLATFORM", "").strip()
        if rs != "ok":
            problems.append(f"real_login auth_status expected 'ok', got '{rs}' (message={os.environ.get('WF_VAR_REAL_MESSAGE','')[:200]})")
        if rp != "web":
            problems.append(f"real_login platform should echo 'web', got '{rp}'")

        bs = os.environ.get("WF_VAR_BAD_STATUS", "").strip()
        bm = os.environ.get("WF_VAR_BAD_MESSAGE", "").strip()
        if bs != "failed":
            problems.append(f"bad_login auth_status expected 'failed', got '{bs}'")
        if not bm:
            problems.append(f"bad_login should have message")

        mc = os.environ.get("WF_VAR_MC_STATUS", "").strip()
        if mc != "failed":
            problems.append(f"missing_creds auth_status expected 'failed', got '{mc}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems: print(f"  - {p}")
            sys.exit(1)
        print("TEST_STATUS=pass (real login ok, wrong password rejected, missing creds rejected)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [real_login, bad_login, missing_creds]
    priority: 5
