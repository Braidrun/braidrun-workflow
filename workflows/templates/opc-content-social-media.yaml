---
name: opc-content-social-media
version: 3.0.0
tags:
- 社交媒体
- 一人公司
- 内容运营
- 多角色协作
- 迭代优化
- group_chat
- repeat_until
- extract
- condition
category: marketing
description: |
  "一人公司" (OPC) 社交媒体内容运营工作流。
  独立创业者的多平台社交媒体系统化运营：内容策略制定 → 选题讨论与优先级排序 → 多平台适配内容创作 → 迭代优化 → 分发排期与增长追踪。
  适用场景：个人品牌在 Twitter/X、小红书、LinkedIn、Newsletter 等平台的内容运营、粉丝增长和变现。
  特性：extract 结构化指标提取、group_chat 选题讨论、repeat_until 内容质量迭代
variables:
  brand_name: 效率黑客
  niche: AI 效率工具推荐 + 远程办公技巧
  platforms: Twitter/X、小红书、LinkedIn、Newsletter
  target_audience: 独立开发者、远程办公者、效率工具爱好者
  content_frequency: 每周 5 篇（各平台适配）
  quality_threshold: '8'
  output_dir: "./output/opc-content-social-media"
  demo_mode: 'true'
variable_tags:
  brand_name: '平台账号'
  content_frequency: '业务参数'
  demo_mode: '运行模式'
  niche: '业务参数'
  output_dir: '输出'
  platforms: '平台账号'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
agents:
  content_strategist:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位个人品牌内容策略师，精通社交媒体算法和内容运营。
        你擅长为一人公司设计低成本高回报的内容策略。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  content_creator:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位全平台内容创作者，擅长将一个选题适配到多个社交平台。
        你的内容有洞察、有实操、有个人风格，能持续吸引精准粉丝。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  growth_advisor:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位社交媒体增长顾问，精通各平台的涨粉策略和变现路径。
        你擅长数据驱动的内容优化和粉丝互动策略。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位社交媒体内容质量评审专家。评分维度：内容价值(25%)、平台适配(25%)、品牌一致性(25%)、增长潜力(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: content-strategy
  agent: content_strategist
  input: |
    为「{{var:brand_name}}」制定社交媒体内容策略：
    领域：{{var:niche}}，平台：{{var:platforms}}
    目标受众：{{var:target_audience}}，频率：{{var:content_frequency}}
    1. 各平台定位差异化（Twitter 短观点 / 小红书图文教程 / LinkedIn 深度分享）。
    2. 内容支柱（3-5 个核心内容类别）。
    3. 本周热门选题推荐（10 个）。
    4. 竞品账号分析（3 个同领域成功账号）。
    输出必须包含以下格式化指标：
    - content_pillars=N（内容支柱数）
    - target_followers=N（目标粉丝数）
    输出到：content-strategy.md
  extract:
  - pattern: content_pillars=(\d+)
    variable: content_pillars
  - pattern: target_followers=(\d+)
    variable: target_followers
  priority: 10
- step: topic-discussion
  group_chat:
    participants:
    - content_strategist
    - content_creator
    - growth_advisor
    initial_message: |-
      选题讨论会。请审查内容策略：{{steps.content-strategy.output}}
      讨论重点：
      1. 本周 10 个选题中，哪 5 个最有爆款潜力？
      2. 各选题最适合哪个平台首发？
      3. 有没有可以蹭热点的时效性话题？
      4. 如何设计内容间的关联和系列感？
      讨论完毕后请说 TOPICS_SET

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: TOPICS_SET
  depends_on:
  - content-strategy
  priority: 8
- step: content-creation
  agent: content_creator
  input: |
    基于选题共识创作本周内容：{{steps.topic-discussion.output}}
    上次评估反馈（如有）：{{steps.content-creation:evaluate.output}}
    为每个选题创作多平台版本：
    1. Twitter/X：观点+线程版本。
    2. 小红书：图文教程版本（含标题/正文/标签）。
    3. LinkedIn：专业深度版本。
    4. Newsletter：深度长文版本。
    输出到：weekly-content.md
  depends_on:
  - topic-discussion
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下社交媒体内容。评分维度：内容价值(25%)、平台适配(25%)、品牌一致性(25%)、增长潜力(25%)。
      输出格式：quality_score=N（1-10 分）
      内容：{{steps.content-creation.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: distribution-schedule
  agent: growth_advisor
  input: |
    制定分发排期（质量评分 {{var:quality_score}}）：
    内容：{{steps.content-creation.output}}

    1. 各平台最佳发布时间和顺序（按时区和受众活跃时段排列每日发布计划）。
    2. 跨平台内容联动策略（首发平台选择、二次传播路径、互相引流方式）。
    3. 互动和评论回复策略（回复时效要求、互动话术模板、负面评论应对方案）。
    4. 本周增长目标和追踪指标（每平台的曝光量/互动率/涨粉数目标值）。
    5. 内容效果评估标准（什么数据表现算"爆款"，什么时候调整/放弃一个选题）。

    输出到：distribution-schedule.md
  depends_on:
  - content-creation
  priority: 4
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
