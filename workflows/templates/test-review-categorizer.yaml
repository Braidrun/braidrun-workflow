---
name: test-review-categorizer
version: 1.0.0
description: Test utility-module-review-categorizer (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-review-categorizer
      inputs:
        "review_text": "The phone arrived quickly and works great, but the battery only lasts half a day. Customer service was responsive though."
      outputs:
        sent: sentiment
        rating: rating_estimate
        status: review_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
