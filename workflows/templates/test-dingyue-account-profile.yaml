---
name: test-dingyue-account-profile
version: 1.0.0
description: Test dingyue-module-account-profile with configured test credentials.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: fetch
    sub_workflow:
      name: dingyue-module-account-profile
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps"}
      outputs:
        status: fetch_status
        acct_json: account_json
        email: owner_email
        name: display_name
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        raw = os.environ.get("WF_VAR_ACCT_JSON", "")
        try:
          data = json.loads(raw) if raw else {}
          if not isinstance(data, dict) or not data: problems.append("acct_json empty or not dict")
        except json.JSONDecodeError as e:
          problems.append(f"acct_json not JSON: {e}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (name={os.environ.get('WF_VAR_NAME','')[:50]})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch]
    priority: 5
