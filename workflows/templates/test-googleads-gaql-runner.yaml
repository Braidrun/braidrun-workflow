---
name: test-googleads-gaql-runner
version: 1.0.0
description: |
  Test harness for braidrun-module-googleads-gaql-runner.

  Positive path: attempt a tiny GAQL query (safe, read-only). If the
  configured test account has Google Ads access the query returns; if not
  the module surfaces the error.

  Negative path: empty gaql → module raises.

tags:
  - code
  - error_handling
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: try_real
    sub_workflow:
      name: braidrun-module-googleads-gaql-runner
      inputs:
        username: "{{var:test_username}}"
        password: "{{var:test_password}}"
        braidrun_platform: "braidrun"
        gaql: "SELECT customer.id, customer.descriptive_name FROM customer LIMIT 1"
      outputs:
        real_status: query_status
        real_count: result_count
        real_error: query_error
    on_failure:
      - next: assert
    priority: 20

  - step: empty_gaql
    sub_workflow:
      name: braidrun-module-googleads-gaql-runner
      inputs:
        username: "{{var:test_username}}"
        password: "{{var:test_password}}"
        gaql: ""
      outputs:
        eg_status: query_status
    on_failure:
      - next: assert
    priority: 15

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []

        # try_real: status "ok" = query returned; "failed" = API rejected but module
        # surfaced it cleanly via query_error (documented behavior); "" = pre-flight raise.
        # All three are valid outcomes for the test-account scenario.
        rs = os.environ.get("WF_VAR_REAL_STATUS", "").strip()
        err = os.environ.get("WF_VAR_REAL_ERROR", "").strip()
        if rs not in ("", "ok", "failed"):
            problems.append(f"real status should be ''/ok/failed, got '{rs}'")
        # When failed, query_error must be non-empty (module contract)
        if rs == "failed" and not err:
            problems.append("real_status=failed but query_error empty")

        # empty_gaql must raise pre-flight (outputs empty)
        eg = os.environ.get("WF_VAR_EG_STATUS", "").strip()
        if eg != "":
            problems.append(f"empty_gaql should raise, got status='{eg}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems: print(f"  - {p}")
            sys.exit(1)
        outcome_map = {"ok": "GAQL returned", "failed": "GAQL surfaced API error via query_error",
                       "": "GAQL pre-flight raised"}
        print(f"TEST_STATUS=pass (outcome: {outcome_map.get(rs, rs)})")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    priority: 5
