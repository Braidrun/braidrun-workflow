---
name: test-sitemap-reader
version: 1.0.0
description: Test sitemap-reader on a tiny public sitemap.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-sitemap-reader
      inputs: {sitemap_url: "https://www.google.com/sitemap.xml", max_urls: "50", recursive: "false"}
      outputs:
        urls: urls_json
        cnt: url_count
        status: sitemap_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        cnt = int(os.environ.get("WF_VAR_CNT", "0") or "0")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if cnt < 1: print(f"TEST_STATUS=fail\n  - cnt={cnt}"); sys.exit(1)
        print(f"TEST_STATUS=pass ({cnt} URLs)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
