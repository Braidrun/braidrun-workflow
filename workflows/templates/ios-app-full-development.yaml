---
name: ios-app-full-development
version: 3.0.0
tags:
- 移动开发
- iOS
- 应用开发
- 多角色协作
- 迭代优化
- 并行处理
- group_chat
- repeat_until
- extract
- parallel
- condition
- manual_approval
category: software
description: |
  iOS App 完整开发工作流 - 从品类选型到 App Store 上架

  适用场景：独立开发者或小团队从零开始开发 iOS 应用，需要端到端交付指导（市场调研 -> 需求 -> 开发 -> 测试 -> 上架）。
  说明：多角色协作（市场分析师、产品经理、iOS 架构师、开发工程师、UI 设计师、QA、ASO 专家），通过 group_chat 跨职能评审确保方案一致性，
  repeat_until 迭代优化 App Store 上架素材直到评分达标，extract 提取结构化指标用于下游步骤引用。
variables:
  app_category: 工具类
  target_audience: 18-35岁年轻人
  budget: '10000'
  timeline: 3个月
  quality_threshold: '8'
  output_dir: "./output/ios-app-full-development"
  demo_mode: 'true'
variable_tags:
  app_category: '业务参数'
  budget: '业务参数'
  demo_mode: '运行模式'
  output_dir: '输出'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
  timeline: '业务参数'
agents:
  market_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位资深的移动应用市场分析师，擅长：
        - App Store 市场趋势分析
        - 竞品分析和差异化定位
        - 用户需求洞察
        - 商业模式设计
        请提供数据驱动的分析结果。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  product_manager:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位经验丰富的移动应用产品经理，负责：
        - 需求分析和功能规划
        - 用户体验设计
        - MVP 范围定义
        - 产品路线图制定
        输出清晰的产品需求文档（PRD）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  ios_architect:
    preset: universal
    overrides:
      system_prompt: |-
        你是 iOS 技术架构专家，精通：
        - Swift/SwiftUI 技术栈
        - iOS 架构模式（MVVM、Clean Architecture）
        - 第三方框架选型
        - 性能优化
        提供可落地的技术方案。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  ios_developer:
    preset: coder
    overrides:
      system_prompt: |-
        你是资深 iOS 开发工程师，负责：
        - Swift 代码编写
        - SwiftUI 界面开发
        - API 集成
        - 单元测试
        代码要求：整洁、可维护、符合 Apple 开发规范。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  ui_designer:
    preset: researcher
    overrides:
      system_prompt: |-
        你是专业的 iOS UI/UX 设计师，擅长：
        - Apple Human Interface Guidelines
        - 符合 iOS 设计规范的界面设计
        - 用户体验优化
        - 交互动效设计
        提供详细的设计规范和原型描述。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  qa_engineer:
    preset: coder
    overrides:
      system_prompt: |-
        你是 iOS 质量保证工程师，负责：
        - 功能测试用例设计
        - UI/UX 测试
        - 性能测试
        - App Store 提审前检查
        提供完整的测试报告。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  appstore_specialist:
    preset: researcher
    overrides:
      system_prompt: |-
        你是 App Store 上架和 ASO 专家，精通：
        - App Store Connect 操作流程
        - App Store 审核规则
        - ASO（应用商店优化）
        - 元数据优化（标题、描述、关键词、截图）
        帮助应用快速通过审核并获得良好曝光。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位 App 上架素材质量评审专家。对 ASO 素材进行综合评分。
        评分维度：关键词覆盖(25%)、文案吸引力(25%)、截图规范(25%)、合规性(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: market-research
  agent: market_analyst
  input: |
    请进行 {{app_category}} App 市场调研，分析：
    1. 当前市场规模和增长趋势
    2. Top 10 竞品分析（功能、用户评价、下载量）
    3. 用户痛点和未满足需求
    4. 市场机会和差异化方向

    目标受众：{{target_audience}}
    预算：{{budget}} USD
    时间线：{{timeline}}

    请提供详细的市场调研报告（保存到 market-research-report.md）
  extract:
  - pattern: market_segments=(\d+)
    variable: market_segments
  - pattern: competitor_apps=(\d+)
    variable: competitor_apps
  priority: 10
  timeout_seconds: 300
- step: business-model-design
  agent: market_analyst
  input: |
    基于市场调研结果，设计商业模式：
    {{steps.market-research.output}}

    请分析：
    1. 变现模式（内购、订阅、广告、付费下载）
    2. 定价策略
    3. 预期收入模型
    4. 成本结构

    输出必须包含以下格式化指标：
    - market_segments=N（市场细分数）
    - competitor_apps=N（竞品 App 数）
    输出到：business-model.md
  depends_on:
  - market-research
  priority: 9
- step: product-requirements
  agent: product_manager
  input: |
    基于市场调研创建产品需求文档（PRD）：

    市场调研：{{steps.market-research.output}}
    商业模式：{{steps.business-model-design.output}}

    PRD 应包含：
    1. 产品定位和核心价值主张
    2. 目标用户画像
    3. 核心功能清单（MVP）
    4. 功能优先级
    5. 用户故事和用例
    6. 非功能性需求（性能、安全等）

    输出到：PRD.md
  depends_on:
  - market-research
  - business-model-design
  priority: 8
  timeout_seconds: 300
- step: ui-ux-design
  agent: ui_designer
  input: |
    基于 PRD 设计 iOS App UI/UX：
    {{steps.product-requirements.output}}

    请提供：
    1. 信息架构
    2. 页面流程图
    3. 关键页面线框图描述
    4. UI 组件规范（颜色、字体、间距）
    5. 交互设计说明
    6. 符合 iOS Human Interface Guidelines 的设计建议

    输出到：UI-UX-Design-Spec.md
  depends_on:
  - product-requirements
  priority: 8
  timeout_seconds: 300
- step: technical-architecture
  agent: ios_architect
  input: |
    设计 iOS App 技术架构：

    产品需求：{{steps.product-requirements.output}}

    请提供：
    1. 技术栈选择（Swift 版本、最低 iOS 版本）
    2. 架构模式（推荐 MVVM + Clean Architecture）
    3. 项目结构
    4. 第三方库选型（网络、存储、UI 等）
    5. 数据持久化方案
    6. 网络架构设计
    7. 安全策略

    输出到：Technical-Architecture.md
  depends_on:
  - product-requirements
  priority: 7
  timeout_seconds: 300
- step: technical-review-meeting
  group_chat:
    participants:
    - product_manager
    - ui_designer
    - ios_architect
    - qa_engineer
    initial_message: |-
      iOS App 技术评审会。请审查以下方案：

      产品需求：{{steps.product-requirements.output}}
      UI/UX 设计：{{steps.ui-ux-design.output}}
      技术架构：{{steps.technical-architecture.output}}

      讨论重点：
      1. 技术方案是否满足产品需求？有无遗漏功能？
      2. UI 设计是否符合 Apple HIG？技术上是否可实现？
      3. 架构方案是否过度设计或不足？
      4. 性能和安全性是否有潜在风险？
      5. 测试策略如何覆盖关键路径？
      讨论完毕后请说 TECH_APPROVED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: TECH_APPROVED
  depends_on:
  - technical-architecture
  - ui-ux-design
  priority: 6
- step: project-setup
  agent: ios_developer
  input: |-
    创建 iOS 项目基础架构：

    技术方案：{{steps.technical-architecture.output}}

    任务：
    1. 创建 Xcode 项目
    2. 配置项目结构（按照 Clean Architecture）
    3. 集成 CocoaPods/SPM 依赖管理
    4. 配置构建脚本
    5. 设置代码规范（SwiftLint）

    输出项目初始化脚本到：setup-project.sh

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/project-setup.md。
  depends_on:
  - technical-architecture
  priority: 6
- step: core-features-development
  agent: ios_developer
  input: |
    开发核心功能模块：

    PRD：{{steps.product-requirements.output}}
    UI 设计：{{steps.ui-ux-design.output}}
    技术架构：{{steps.technical-architecture.output}}

    优先开发 MVP 功能：
    1. 实现核心业务逻辑
    2. 开发 SwiftUI 界面
    3. API 集成
    4. 数据持久化
    5. 编写单元测试

    输出到：Core-Features-Code/
  depends_on:
  - project-setup
  - ui-ux-design
  priority: 6
  timeout_seconds: 600
  parallel:
    tasks:
    - 开发用户认证模块
    - 开发主要功能模块1
    - 开发主要功能模块2
    - 开发数据存储模块
    - 开发网络请求模块
    max_parallel: 3
    aggregate_results: true
- step: create-test-plan
  agent: qa_engineer
  input: |
    创建测试计划：

    PRD：{{steps.product-requirements.output}}
    已开发功能：{{steps.core-features-development.output}}

    包含：
    1. 功能测试用例
    2. UI/UX 测试检查点
    3. 性能测试方案
    4. 兼容性测试（iOS 版本、设备）
    5. 边界条件和错误处理测试

    输出到：Test-Plan.md
  depends_on:
  - core-features-development
  priority: 5
- step: execute-testing
  agent: qa_engineer
  input: |
    执行测试并生成报告：

    测试计划：{{steps.create-test-plan.output}}

    执行：
    1. 功能测试
    2. UI 测试
    3. 性能测试
    4. 记录 Bug 和改进建议

    输出到：Test-Report.md
  depends_on:
  - create-test-plan
  priority: 5
  timeout_seconds: 300
- step: app-metadata-optimization
  agent: appstore_specialist
  input: |
    优化 App Store 元数据：

    产品信息：{{steps.product-requirements.output}}

    创建：
    1. App 名称（最大 30 字符，包含关键词）
    2. 副标题（最大 30 字符）
    3. 关键词（100 字符，用逗号分隔）
    4. 描述（简短描述 + 详细描述）
    5. 宣传文本
    6. 截图和预览视频规划
    7. 隐私政策要点

    上次评估反馈（如有）：{{steps.app-metadata-optimization:evaluate.output}}

    输出到：App-Store-Metadata.md
  depends_on:
  - execute-testing
  priority: 4
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下 App Store 上架素材。评分维度：关键词覆盖(25%)、文案吸引力(25%)、截图规范(25%)、合规性(25%)。
      输出格式：quality_score=N（1-10 分）
      素材：{{steps.app-metadata-optimization.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: app-store-submission-checklist
  agent: appstore_specialist
  input: |
    创建 App Store 提审检查清单：

    测试报告：{{steps.execute-testing.output}}

    检查：
    1. App Review Guidelines 合规性
    2. 必需的隐私权限说明
    3. 测试账号准备
    4. 演示视频（如需要）
    5. App 分级信息
    6. 应用内购买配置
    7. 上架时间规划

    输出到：Submission-Checklist.md
  depends_on:
  - app-metadata-optimization
  priority: 4
- step: launch-strategy
  agent: appstore_specialist
  input: |
    制定上架和增长策略：

    App 信息：{{steps.app-metadata-optimization.output}}
    商业模式：{{steps.business-model-design.output}}

    策略包含：
    1. 分阶段发布计划（软启动 -> 正式发布）
    2. ASO 优化策略
    3. 用户获取渠道
    4. 付费推广计划（ASA、社交媒体）
    5. KPI 设定和监控
    6. 迭代更新计划

    输出到：Launch-Strategy.md
  depends_on:
  - app-store-submission-checklist
  priority: 3
- step: project-summary
  agent: product_manager
  input: |
    汇总项目文档和交付物：

    所有产出：
    - 市场调研：{{steps.market-research.output}}
    - 商业模式：{{steps.business-model-design.output}}
    - PRD：{{steps.product-requirements.output}}
    - UI/UX 设计：{{steps.ui-ux-design.output}}
    - 技术架构：{{steps.technical-architecture.output}}
    - 测试报告：{{steps.execute-testing.output}}
    - App Store 元数据：{{steps.app-metadata-optimization.output}}
    - 上架策略：{{steps.launch-strategy.output}}

    创建项目交付总结，包括：
    1. 执行摘要
    2. 关键决策记录
    3. 项目时间线
    4. 下一步行动计划
    5. 风险和注意事项

    输出到：Project-Summary.md
  depends_on:
  - launch-strategy
  manual_approval:
    enabled: false
    approvers:
    - admin@example.com
    timeout: 3600
    approval_message: "确认将应用提交到 Apple App Store？（演示模板默认关闭人工审批，复制模板后可按需重新开启。）"
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 10s
  on_error:
  - notify: 项目管理员
  continue_on_error: false
timeout:
  total: 7200s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
