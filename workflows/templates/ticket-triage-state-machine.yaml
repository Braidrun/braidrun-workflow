name: ticket-triage-state-machine
version: 1.0.0
description: Generic support ticket triage workflow.
tags:
  - support
  - triage
variables:
  ticket_text: "Customer reports that the service is unavailable."
agents:
  triager:
    preset: communication
  analyst:
    preset: universal_reasoning
workflow:
  - step: classify_ticket
    agent: triager
    input: |
      Classify this ticket by urgency, affected area, and owner.
      Ticket:
      {{var:ticket_text}}
  - step: analyze_resolution
    agent: analyst
    depends_on: [classify_ticket]
    input: |
      Propose the next action, required context, and escalation path.
      Classification:
      {{steps.classify_ticket.output}}
  - step: response_draft
    agent: triager
    depends_on: [analyze_resolution]
    input: |
      Draft a clear customer-facing response.
      Internal analysis:
      {{steps.analyze_resolution.output}}
