---
name: test-dingyue-push-task-list-fetcher
version: 1.0.0
description: Test dingyue-module-push-task-list-fetcher with real app_id.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: list_apps
    sub_workflow:
      name: dingyue-module-app-list-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", max_apps: "1"}
      outputs: {ids: app_ids_csv}
    priority: 20
  - step: pick
    code:
      language: python
      timeout: 5
      script: |
        import os
        ids = os.environ.get("WF_VAR_IDS", "").split(",")
        print(f"first_id={ids[0] if ids else ''}")
    extract: [{pattern: 'first_id=(.+)', variable: first_app_id}]
    depends_on: [list_apps]
    priority: 15
  - step: fetch_pushes
    sub_workflow:
      name: dingyue-module-push-task-list-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", app_id: "{{var:first_app_id}}", mobile_platform: "ios", max_items: "50"}
      outputs:
        status: fetch_status
        cnt: push_count
        rate: success_rate
    depends_on: [pick]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        cnt = os.environ.get("WF_VAR_CNT", "")
        if not cnt.isdigit(): problems.append(f"cnt not numeric: {cnt}")
        rate = float(os.environ.get("WF_VAR_RATE", "0") or "0")
        if rate < 0 or rate > 100: problems.append(f"rate out of range: {rate}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (pushes={cnt}, success_rate={rate}%)")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch_pushes]
    priority: 5
