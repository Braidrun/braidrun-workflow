---
name: test-workflow-variables
version: 1.0.0
tags:
- test
- variable-system
description: Variable and template-substitution test - pass variables via CLI -v and reference step outputs through templates
translations:
  en:
    name: "Variables and Template Substitution Test"
    description: "Variable and template-substitution test - pass variables via CLI -v and reference step outputs through templates"
  zh:
    name: "变量和模板替换测试"
    description: "变量和模板替换测试 - 通过 CLI -v 传递变量，并通过模板引用步骤输出"
  zhHant:
    name: "變數和範本替換測試"
    description: "變數和範本替換測試 - 透過 CLI -v 傳遞變數，並透過範本參照步驟輸出"
  ja:
    name: "変数とテンプレート置換テスト"
    description: "変数とテンプレート置換のテスト - CLI -v で変数を渡し、テンプレート経由でステップ出力を参照"
  ko:
    name: "변수 및 템플릿 치환 테스트"
    description: "변수 및 템플릿 치환 테스트 - CLI -v로 변수를 전달하고 템플릿을 통해 단계 출력을 참조"
  es:
    name: "Prueba de variables y sustitución de plantillas"
    description: "Prueba de variables y sustitución de plantillas: pasa variables mediante CLI -v y referencia las salidas de los pasos mediante plantillas"
  fr:
    name: "Test des variables et de la substitution de modèles"
    description: "Test des variables et de la substitution de modèles - transmet des variables via CLI -v et référence les sorties des étapes via des modèles"
  de:
    name: "Variablen- und Vorlagenersetzungs-Test"
    description: "Test für Variablen und Vorlagenersetzung - Variablen über CLI -v übergeben und Schritt-Ausgaben über Vorlagen referenzieren"
  ar:
    name: "اختبار المتغيرات واستبدال القوالب"
    description: "اختبار المتغيرات واستبدال القوالب - مرِّر المتغيرات عبر CLI -v وارجع إلى مخرجات الخطوات عبر القوالب"
  pt:
    name: "Teste de variáveis e substituição de modelos"
    description: "Teste de variáveis e substituição de modelos - passe variáveis via CLI -v e referencie as saídas das etapas por meio de modelos"
  vi:
    name: "Kiểm thử biến và thay thế mẫu"
    description: "Kiểm thử biến và thay thế mẫu - truyền biến qua CLI -v và tham chiếu đầu ra bước thông qua mẫu"
variables:
  greeting: Hello
  target: World
  output_dir: "./output/test-workflow-variables"
  demo_mode: 'true'
agents:
  helper:
    preset: universal
    description: "Handles task assistance responsibilities in this test workflow."
    translations:
      en:
        description: "Handles task assistance responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的任务协助职责。"
      zhHant:
        description: "負責此測試工作流程中的任務協助職責。"
      ja:
        description: "このテストワークフローでタスク支援を担当します。"
      ko:
        description: "이 테스트 워크플로에서 작업 지원 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de asistencia de tareas en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de assistance aux tâches dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Aufgabenunterstützung."
      ar:
        description: "يتولى مسؤوليات المساعدة في المهام في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de assistência a tarefas neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò hỗ trợ tác vụ trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a helpful assistant. Complete the task precisely and call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - shell
      - file_system
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: write_greeting
  agent: helper
  input: |-
    Create a file called ./output/greeting.txt with exactly this content: "{{var:greeting}}, {{var:target}}!"
    Do not add any extra text. Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/write_greeting.md.
- step: transform
  agent: helper
  depends_on:
  - write_greeting
  input: |-
    Read the file ./output/greeting.txt and create a new file ./output/transformed.txt
    that contains the original content converted to UPPERCASE.
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/transform.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 300s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
