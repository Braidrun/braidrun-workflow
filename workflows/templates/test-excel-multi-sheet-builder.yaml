---
name: test-excel-multi-sheet-builder
version: 1.0.0
description: |
  Test harness for braidrun-module-excel-multi-sheet-builder (LLM-driven, needs OpenRouter key).

  Writes a 2-sheet fixture JSON to disk, invokes the module, then verifies:
  - build_status is ok
  - report_file exists and is a real .xlsx (ZIP-magic header)
  - sheet_count >= 2

  Requires: OPENROUTER_API_KEY env var set.

tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: setup_fixture
    code:
      language: python
      timeout: 10
      script: |
        import json
        import tempfile
        from pathlib import Path

        base = Path(tempfile.mkdtemp(prefix="excel_test_"))
        fixture = base / "sheets.json"
        fixture.write_text(json.dumps([
            {
                "name": "Revenue",
                "headers": ["app_id", "revenue"],
                "rows": [["1001", "123.45"], ["1002", "678.90"]],
            },
            {
                "name": "Users",
                "headers": ["month", "active_users"],
                "rows": [["2026-01", "1200"], ["2026-02", "1320"]],
            },
        ], ensure_ascii=False, indent=2), encoding="utf-8")

        out_dir = base / "output"
        out_dir.mkdir()

        print(f"fixture_path={fixture}")
        print(f"out_dir={out_dir}")
    extract:
      - pattern: 'fixture_path=(.+)'
        variable: fixture_path
      - pattern: 'out_dir=(.+)'
        variable: out_dir
    priority: 20

  - step: build
    sub_workflow:
      name: braidrun-module-excel-multi-sheet-builder
      inputs:
        sheet_definitions_path: "{{var:fixture_path}}"
        title: "Test Revenue Report"
        output_dir: "{{var:out_dir}}"
        output_filename: "test_revenue"
        include_summary: "false"
      outputs:
        ex_status: build_status
        ex_report_file: report_file
        ex_sheet_count: sheet_count
    depends_on:
      - setup_fixture
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys
        from pathlib import Path

        status = os.environ.get("WF_VAR_EX_STATUS", "").strip()
        report_file = os.environ.get("WF_VAR_EX_REPORT_FILE", "").strip()
        sheet_count_raw = os.environ.get("WF_VAR_EX_SHEET_COUNT", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"build_status != 'ok', got '{status}'")

        if not report_file:
            problems.append("report_file is empty")
        elif not Path(report_file).exists():
            problems.append(f"report_file does not exist: {report_file}")
        else:
            # .xlsx is a ZIP archive — magic bytes PK\x03\x04
            with open(report_file, "rb") as f:
                magic = f.read(4)
            if magic != b"PK\x03\x04":
                problems.append(f"report_file is not a valid ZIP/xlsx (magic={magic!r})")

        try:
            sheet_count = int(sheet_count_raw)
            if sheet_count < 2:
                problems.append(f"sheet_count expected >= 2, got {sheet_count}")
        except ValueError:
            problems.append(f"sheet_count not int: '{sheet_count_raw}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print(f"TEST_STATUS=pass (sheet_count={sheet_count_raw})")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - build
    priority: 5
