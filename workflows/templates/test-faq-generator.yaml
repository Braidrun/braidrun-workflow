---
name: test-faq-generator
version: 1.0.0
description: Test utility-module-faq-generator (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-faq-generator
      inputs:
        "source_text": "Braidrun is a multi-tier AI agent platform. It supports subscription management for iOS apps. It integrates with Apple Search Ads, Google Ads, and workflow automation. The free tier allows up to 10 workflows per month."
        faq_count: "5"
      outputs:
        cnt: faq_count_generated
        status: faq_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
