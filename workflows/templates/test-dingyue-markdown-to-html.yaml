---
name: test-dingyue-markdown-to-html
version: 1.0.0
tags:
  - code
  - extract
  - sub_workflow
description: |
  Test harness for dingyue-module-markdown-to-html.

  Three phases:
  1. `prepare_markdown` — write a rich markdown sample to a temp file covering
     headings, inline emphasis, fenced code, lists, tables, blockquotes, HR,
     explicit links, autolinks.
  2. `convert` — invoke the module to produce an HTML file.
  3. `assert` — load the produced HTML and verify every markdown feature
     rendered to the expected tag. Fails if any feature is missing or if the
     module's reported metadata (heading_count, size, status) doesn't match.

  This test runs with no external deps — native Python stdlib only, so it
  exercises exactly the code path the module ships with.

agents: {}

error_handling:
  continue_on_error: true

workflow:
  - step: prepare_markdown
    code:
      language: python
      timeout: 30
      script: |
        import os, tempfile
        from pathlib import Path

        sample = '''# Project Status Report

        > Generated automatically by braidrun-web.

        ## Overview

        This is a **status report** with *highlighted* findings and a bit
        of `inline code`. Strikethrough ~~like this~~ is supported too.

        ## Key Metrics

        | Metric | Current | Target |
        |-------:|:-------:|:-------|
        |   DAU  | 125,432 | 150,000 |
        |  MRR   | $42,100 | $50,000 |

        ## Action Items

        1. Fix the login bug
        2. Ship onboarding v2
           - Step 2a: draft copy
           - Step 2b: review with PM
        3. Deploy to production

        ## Code Sample

        ```python
        def hello(name: str) -> str:
            return f"Hello, {name}!"
        ```

        ## Links

        See [the dashboard](https://example.com/dash) or visit
        https://docs.example.com for details.

        ---

        *End of report.*
        '''
        # Strip leading spaces from each line for valid markdown
        sample = "\n".join(line[8:] if line.startswith("        ") else line for line in sample.split("\n"))

        out_dir = Path(os.environ.get("WF_RUN_DIR") or tempfile.mkdtemp(prefix="md2html_test_"))
        out_dir.mkdir(parents=True, exist_ok=True)
        md_file = out_dir / "test_input.md"
        md_file.write_text(sample, encoding="utf-8")

        print(f"md_file={md_file}")
        print(f"md_size={md_file.stat().st_size}")
        print(f"output_dir={out_dir}")
    extract:
      - pattern: 'md_file=(.+)'
        variable: md_file
      - pattern: 'md_size=(\d+)'
        variable: md_size
      - pattern: 'output_dir=(.+)'
        variable: test_output_dir
    priority: 20

  - step: convert
    sub_workflow:
      name: dingyue-module-markdown-to-html
      inputs:
        markdown_path: "{{var:md_file}}"
        output_dir: "{{var:test_output_dir}}"
        title: "Test Project Status Report"
        include_default_css: "true"
        standalone: "true"
      outputs:
        convert_status: conversion_status
        produced_html: html_path
        produced_size: html_size_bytes
        produced_title: title_used
        produced_headings: heading_count
    depends_on:
      - prepare_markdown
    priority: 15

  - step: assert
    code:
      language: python
      timeout: 30
      script: |
        import os, sys
        from pathlib import Path

        problems = []

        status = os.environ.get("WF_VAR_CONVERT_STATUS", "").strip()
        html_path = os.environ.get("WF_VAR_PRODUCED_HTML", "").strip()
        html_size = os.environ.get("WF_VAR_PRODUCED_SIZE", "0").strip()
        title_used = os.environ.get("WF_VAR_PRODUCED_TITLE", "").strip()
        headings = os.environ.get("WF_VAR_PRODUCED_HEADINGS", "0").strip()

        if status != "ok":
            problems.append(f"conversion_status expected 'ok', got '{status}'")

        if not html_path:
            problems.append("html_path is empty")
        else:
            p = Path(html_path)
            if not p.is_file():
                problems.append(f"produced HTML does not exist: {html_path}")
            else:
                content = p.read_text(encoding="utf-8")
                try:
                    actual_size = int(html_size)
                except ValueError:
                    actual_size = -1
                    problems.append(f"html_size_bytes not int: {html_size}")
                if actual_size > 0 and actual_size != p.stat().st_size:
                    problems.append(
                        f"reported size {actual_size} != actual size {p.stat().st_size}"
                    )

                # Feature checks — each markdown element should render to the
                # expected HTML tag. Comments list the markdown source that
                # should produce the check.
                checks = [
                    ("<!DOCTYPE html>",   "standalone document wrapper"),
                    ("<title>",           "<title> element present"),
                    ("<style>",           "default CSS embedded"),
                    ("<h1>",              "H1 from `# Project Status Report`"),
                    ("<h2>",              "H2 from `## Overview`"),
                    ("<strong>status report</strong>",  "bold **status report**"),
                    ("<em>highlighted</em>",             "italic *highlighted*"),
                    ("<code>inline code</code>",         "inline `code`"),
                    ("<del>like this</del>",             "strikethrough ~~like this~~"),
                    ("<table>",           "GFM table"),
                    ("<thead>",           "table header"),
                    ("<tbody>",           "table body"),
                    ("<th",               "table heading cells"),
                    ("text-align:right",  "right-aligned DAU column"),
                    ("text-align:center", "center-aligned target column"),
                    ("<ol>",              "ordered list for action items"),
                    ("<ul>",              "nested unordered list"),
                    ("<pre><code",        "fenced code block wrapped in pre+code"),
                    ('class="language-python"', "fenced block's language class"),
                    ('<a href="https://example.com/dash">the dashboard</a>',
                                          "explicit [label](url) link"),
                    ('<a href="https://docs.example.com">https://docs.example.com</a>',
                                          "autolinked bare URL"),
                    ("<hr/>",             "horizontal rule"),
                    ("<blockquote>",      "blockquote"),
                ]
                for needle, name in checks:
                    if needle not in content:
                        problems.append(f"{name}: expected `{needle}` not in output")

                # Negative check: script tags inside code blocks must be escaped,
                # not passed through. We didn't put any, but make sure the
                # escaping path runs — the Python code block's `return f"Hello,
                # {name}!"` includes curly braces that shouldn't be mangled.
                if "def hello(name: str) -&gt; str:" not in content:
                    problems.append("code block text not HTML-escaped properly")

        # Title should prefer the explicit input over the H1
        if title_used and title_used != "Test Project Status Report":
            problems.append(
                f"title_used expected 'Test Project Status Report', got '{title_used}'"
            )

        # The sample has 5 headings: H1 Overview, H2 Key Metrics, H2 Action
        # Items, H2 Code Sample, H2 Links. Actually looking again:
        # # Project Status Report (1)
        # ## Overview (2)
        # ## Key Metrics (3)
        # ## Action Items (4)
        # ## Code Sample (5)
        # ## Links (6)
        # → 6 headings.
        try:
            hc = int(headings)
        except ValueError:
            hc = -1
            problems.append(f"heading_count not int: {headings}")
        if hc != 6:
            problems.append(f"heading_count expected 6, got {hc}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        print(f"TEST_STATUS=pass (html={html_path}, size={html_size}, headings={hc})")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - convert
    priority: 5
