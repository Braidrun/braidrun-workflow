---
name: test-youtube-metadata
version: 1.0.0
description: Test youtube-metadata on a classic stable video.
translations:
  en:
    name: "YouTube Metadata Test"
    description: "Test youtube-metadata on a classic stable video."
  zh:
    name: "YouTube 元数据测试"
    description: "在经典稳定视频上测试 youtube-metadata。"
  zhHant:
    name: "YouTube 中繼資料測試"
    description: "在經典穩定影片上測試 youtube-metadata。"
  ja:
    name: "YouTube メタデータテスト"
    description: "定番の安定した動画で youtube-metadata をテストします。"
  ko:
    name: "YouTube 메타데이터 테스트"
    description: "클래식한 안정적 동영상에서 youtube-metadata를 테스트합니다."
  es:
    name: "Prueba de metadatos de YouTube"
    description: "Prueba youtube-metadata en un video clásico estable."
  fr:
    name: "Test de métadonnées YouTube"
    description: "Teste youtube-metadata sur une vidéo stable classique."
  de:
    name: "YouTube-Metadaten-Test"
    description: "Testet youtube-metadata auf einem klassischen stabilen Video."
  ar:
    name: "اختبار بيانات YouTube الوصفية"
    description: "اختبار youtube-metadata على فيديو كلاسيكي ثابت."
  pt:
    name: "Teste de metadados do YouTube"
    description: "Testa youtube-metadata em um vídeo clássico estável."
  vi:
    name: "Kiểm thử siêu dữ liệu YouTube"
    description: "Kiểm thử youtube-metadata trên một video ổn định cổ điển."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-youtube-metadata
      inputs: {video_url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", use_noembed: "false"}
      outputs:
        t: title
        id: video_id
        author: author_name
        status: youtube_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        vid = os.environ.get("WF_VAR_ID", "")
        title = os.environ.get("WF_VAR_T", "")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if vid != "dQw4w9WgXcQ": print(f"TEST_STATUS=fail\n  - vid={vid}"); sys.exit(1)
        if not title: print(f"TEST_STATUS=fail\n  - title empty"); sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
