---
name: android-app-full-development
version: 3.0.0
tags:
- 移动开发
- Android
- 应用开发
- 多角色协作
- 迭代优化
- 并行处理
- group_chat
- repeat_until
- extract
- parallel
- condition
- manual_approval
category: software
description: |
  Android App 完整开发工作流 - 从市场分析到 Google Play 上架

  适用场景：Android 应用从零到一全流程交付，涵盖 Kotlin + Jetpack Compose 技术栈。
  说明：多角色协作（市场分析师、产品经理、Android 架构师、开发工程师、UI 设计师、QA、Google Play 专家），
  通过 group_chat 技术评审会对齐产品/设计/技术方案，repeat_until 迭代优化 Google Play 商品详情页素材，
  parallel 并行开发多个功能模块加速交付，extract 提取结构化指标贯穿流程。
variables:
  app_category: 工具类
  target_audience: Android 用户群
  budget: '10000'
  timeline: 3个月
  quality_threshold: '8'
  output_dir: "./output/android-app-full-development"
  demo_mode: 'true'
variable_tags:
  app_category: '业务参数'
  budget: '业务参数'
  demo_mode: '运行模式'
  output_dir: '输出'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
  timeline: '业务参数'
agents:
  market_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位资深的移动应用市场分析师，擅长：
        - Google Play 商店趋势分析
        - 竞品分析和差异化定位
        - 用户需求洞察
        - 商业模式设计
        请提供数据驱动的分析结果。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  product_manager:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位经验丰富的移动应用产品经理，负责：
        - 需求分析和功能规划
        - 用户体验设计
        - MVP 范围定义
        - 产品路线图制定
        输出清晰的产品需求文档（PRD）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  android_architect:
    preset: universal
    overrides:
      system_prompt: |-
        你是 Android 技术架构专家，精通：
        - Kotlin 语言和 Jetpack Compose 框架
        - Android 架构组件 (ViewModel, Room, Flow)
        - 现代 Android 架构模式 (MVI, MVVM, Clean Architecture)
        - 性能优化和内存管理
        提供可落地的技术方案。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  android_developer:
    preset: coder
    overrides:
      system_prompt: |-
        你是资深 Android 开发工程师，负责：
        - Kotlin 代码编写
        - Jetpack Compose 界面开发
        - API 集成
        - 单元测试
        代码要求：整洁、可维护、符合 Android 开发规范。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  ui_designer:
    preset: researcher
    overrides:
      system_prompt: |-
        你是专业的 Android UI/UX 设计师，擅长：
        - Material Design 3 (Material You) 设计规范
        - 跨设备适配（手机、平板）
        - 用户体验优化
        - 交互动效设计
        提供详细的设计规范和原型描述。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  qa_engineer:
    preset: coder
    overrides:
      system_prompt: |-
        你是 Android 质量保证工程师，负责：
        - 功能测试用例设计
        - UI/UX 测试（包含各种屏幕尺寸适配）
        - 性能测试（内存、耗电量）
        - Google Play 政策合规性检查
        提供完整的测试报告。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  google_play_specialist:
    preset: researcher
    overrides:
      system_prompt: |-
        你是 Google Play 商店上架和运营专家，精通：
        - Google Play Console 操作流程
        - Google Play 开发者政策
        - Google Play ASO（应用商店优化）
        - 商品详情页优化（标题、简短描述、详细描述、图标、截图）
        帮助应用快速通过审核并获得良好曝光。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位 Google Play 上架素材质量评审专家。对 ASO 素材进行综合评分。
        评分维度：关键词覆盖(25%)、文案吸引力(25%)、截图规范(25%)、政策合规(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: market-research
  agent: market_analyst
  input: |
    请进行 {{app_category}} Android App 市场调研，分析：
    1. Android 平台当前市场规模和增长趋势
    2. Google Play Top 10 竞品分析
    3. 用户痛点和未满足需求
    4. 目标受众：{{target_audience}}

    请提供详细的市场调研报告（保存到 android-market-research.md）
  extract:
  - pattern: market_segments=(\d+)
    variable: market_segments
  - pattern: competitor_apps=(\d+)
    variable: competitor_apps
  priority: 10
  timeout_seconds: 300
- step: product-requirements
  agent: product_manager
  input: |
    基于市场调研创建产品需求文档（PRD）：
    {{steps.market-research.output}}

    PRD 应包含核心功能清单（MVP）和优先级。
    输出必须包含以下格式化指标：
    - market_segments=N（市场细分数）
    - competitor_apps=N（竞品 App 数）
    输出到：Android-PRD.md
  depends_on:
  - market-research
  priority: 9
- step: ui-ux-design
  agent: ui_designer
  input: |
    基于 PRD 设计 Android App UI/UX：
    {{steps.product-requirements.output}}

    请基于 Material Design 3 规范提供设计方案。
    输出到：Android-UI-UX-Design.md
  depends_on:
  - product-requirements
  priority: 8
- step: technical-architecture
  agent: android_architect
  input: |
    设计 Android App 技术架构：
    {{steps.product-requirements.output}}

    包含：Jetpack 库选型、架构模式、依赖注入（Hilt）方案。
    输出到：Android-Architecture.md
  depends_on:
  - product-requirements
  priority: 7
- step: technical-review-meeting
  group_chat:
    participants:
    - product_manager
    - ui_designer
    - android_architect
    - qa_engineer
    initial_message: |-
      Android App 技术评审会。请审查以下方案：

      产品需求：{{steps.product-requirements.output}}
      UI/UX 设计：{{steps.ui-ux-design.output}}
      技术架构：{{steps.technical-architecture.output}}

      讨论重点：
      1. 技术方案是否满足产品需求？
      2. UI 设计是否符合 Material Design 3？
      3. 架构方案的可扩展性和性能？
      4. 测试策略如何覆盖关键路径？
      讨论完毕后请说 TECH_APPROVED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: TECH_APPROVED
  depends_on:
  - technical-architecture
  - ui-ux-design
  priority: 6
- step: project-setup
  agent: android_developer
  input: |-
    创建 Android 项目基础架构：
    {{steps.technical-architecture.output}}

    任务：
    1. 生成 Gradle 基础配置
    2. 配置项目模块结构
    3. 设置 Kotlin 协程和 Hilt
    输出初始化脚本到：setup-android-project.sh

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/project-setup.md。
  depends_on:
  - technical-architecture
  priority: 6
- step: core-features-development
  agent: android_developer
  input: |
    开发 Android 核心功能：
    {{steps.product-requirements.output}}

    输出到：Android-Core-Features/
  depends_on:
  - project-setup
  - ui-ux-design
  priority: 6
  parallel:
    tasks:
    - 实现基础数据模型和 Room 数据库
    - 开发网络层和 API 集成
    - 开发核心 UI 界面 (Jetpack Compose)
    - 实现依赖注入和 ViewModel 逻辑
    max_parallel: 2
    aggregate_results: true
- step: execute-testing
  agent: qa_engineer
  input: |
    执行 Android 测试：
    {{steps.core-features-development.output}}

    包含：功能测试、内存泄露检查、多分辨率适配测试。
    输出到：Android-Test-Report.md
  depends_on:
  - core-features-development
  priority: 5
- step: store-metadata-optimization
  agent: google_play_specialist
  input: |
    优化 Google Play 商品详情页：
    {{steps.product-requirements.output}}

    创建：标题、简短描述、详细描述、关键词建议。
    上次评估反馈（如有）：{{steps.store-metadata-optimization:evaluate.output}}

    输出到：Google-Play-Metadata.md
  depends_on:
  - execute-testing
  priority: 4
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下 Google Play 上架素材。评分维度：关键词覆盖(25%)、文案吸引力(25%)、截图规范(25%)、政策合规(25%)。
      输出格式：quality_score=N（1-10 分）
      素材：{{steps.store-metadata-optimization.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: policy-compliance-check
  agent: google_play_specialist
  input: |
    检查 Google Play 政策合规性：
    1. 隐私权政策要点
    2. 数据安全声明
    3. 广告和内购政策
    输出到：Google-Play-Compliance.md
  depends_on:
  - store-metadata-optimization
  priority: 3
- step: project-summary
  agent: product_manager
  input: |
    汇总 Android 项目所有交付物。
    输出到：Android-Project-Summary.md
  depends_on:
  - policy-compliance-check
  manual_approval:
    enabled: false
    approvers:
    - admin@example.com
    timeout: 3600
    approval_message: "确认将应用提交到 Google Play Store？（演示模板默认关闭人工审批，复制模板后可按需重新开启。）"
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 10s
  continue_on_error: false
timeout:
  total: 3600s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
