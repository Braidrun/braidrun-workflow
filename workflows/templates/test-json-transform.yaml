---
name: test-json-transform
version: 1.0.0
description: |
  Test harness for utility-module-json-transform.

  Runs a chain of extract → filter → sort → pick on a small fixture,
  then asserts the output size and status.

translations:
  en:
    name: "JSON Transform Test"
    description: "Test harness for utility-module-json-transform. Runs a chain of extract → filter → sort → pick on a small fixture, then asserts the output size and status."
  zh:
    name: "JSON 转换测试"
    description: "utility-module-json-transform 的测试套件。对一个小型 fixture 运行 extract → filter → sort → pick 链，然后断言输出大小和状态。"
  zhHant:
    name: "JSON 轉換測試"
    description: "utility-module-json-transform 的測試套件。對一個小型 fixture 執行 extract → filter → sort → pick 鏈，然後斷言輸出大小和狀態。"
  ja:
    name: "JSON 変換テスト"
    description: "utility-module-json-transform 用のテストハーネス。小さな fixture に対して extract → filter → sort → pick のチェーンを実行し、出力サイズと状態を検証します。"
  ko:
    name: "JSON 변환 테스트"
    description: "utility-module-json-transform용 테스트 하네스입니다. 작은 fixture에 대해 extract → filter → sort → pick 체인을 실행한 뒤 출력 크기와 상태를 검증합니다."
  es:
    name: "Test de transformación JSON"
    description: "Banco de pruebas para utility-module-json-transform. Ejecuta una cadena extract → filter → sort → pick sobre un fixture pequeño y luego comprueba el tamaño de salida y el estado."
  fr:
    name: "Test de transformation JSON"
    description: "Banc de test pour utility-module-json-transform. Exécute une chaîne extract → filter → sort → pick sur un petit fixture, puis vérifie la taille de sortie et l’état."
  de:
    name: "JSON-Transformations-Test"
    description: "Test-Harness für utility-module-json-transform. Führt auf einem kleinen Fixture eine Kette aus extract → filter → sort → pick aus und prüft anschließend Ausgabelänge und Status."
  ar:
    name: "اختبار تحويل JSON"
    description: "إطار اختبار لـ utility-module-json-transform. يشغّل سلسلة extract → filter → sort → pick على fixture صغير، ثم يتحقق من حجم المخرجات والحالة."
  pt:
    name: "Teste de transformação JSON"
    description: "Harness de teste para utility-module-json-transform. Executa uma cadeia extract → filter → sort → pick em um fixture pequeno e depois verifica o tamanho da saída e o status."
  vi:
    name: "Kiểm thử chuyển đổi JSON"
    description: "Bộ kiểm thử cho utility-module-json-transform. Chạy chuỗi extract → filter → sort → pick trên một fixture nhỏ, rồi xác nhận kích thước đầu ra và trạng thái."
tags:
  - code
  - extract
  - sub_workflow

variables:
  fixture: |
    {
      "data": {
        "items": [
          {"id": 1, "name": "alice", "active": true, "score": 40},
          {"id": 2, "name": "bob",   "active": false, "score": 85},
          {"id": 3, "name": "carol", "active": true, "score": 95},
          {"id": 4, "name": "dave",  "active": true, "score": 70}
        ]
      }
    }
  operations: |
    [
      {"op": "extract", "path": "$.data.items"},
      {"op": "filter",  "field": "active", "eq": true},
      {"op": "sort",    "field": "score", "order": "desc"},
      {"op": "pick",    "fields": ["id", "name", "score"]}
    ]

agents: {}

workflow:
  - step: run_transform
    sub_workflow:
      name: utility-module-json-transform
      inputs:
        input_json: "{{var:fixture}}"
        operations_json: "{{var:operations}}"
        pretty_print: "true"
      outputs:
        transform_output_json: output_json
        transform_status: transform_status
        transform_item_count: item_count
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json
        import os
        import sys

        status = os.environ.get("WF_VAR_TRANSFORM_STATUS", "").strip()
        count_raw = os.environ.get("WF_VAR_TRANSFORM_ITEM_COUNT", "0").strip()
        out_raw = os.environ.get("WF_VAR_TRANSFORM_OUTPUT_JSON", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"status != ok (got '{status}')")
        try:
            count = int(count_raw)
        except ValueError:
            problems.append(f"item_count not int: '{count_raw}'")
            count = -1
        if count != 3:
            problems.append(f"expected 3 active items after filter, got {count}")

        # Extract raw JSON from the single-line preview (newlines were stripped).
        # Rebuild by stripping prefix and parsing.
        json_text = out_raw
        try:
            parsed = json.loads(json_text)
        except json.JSONDecodeError as e:
            problems.append(f"output is not valid JSON: {e}; raw='{json_text[:200]}'")
            parsed = None

        if parsed is not None:
            if not isinstance(parsed, list) or len(parsed) != 3:
                problems.append(f"expected JSON array of 3, got: {type(parsed).__name__} len={len(parsed) if hasattr(parsed, '__len__') else 'n/a'}")
            else:
                # Verify sort order: 95, 70, 40
                scores = [x.get("score") for x in parsed]
                if scores != [95, 70, 40]:
                    problems.append(f"sort order wrong: {scores}")
                # Verify pick worked
                leftover_keys = set(parsed[0].keys()) - {"id", "name", "score"}
                if leftover_keys:
                    problems.append(f"pick failed, leftover keys: {leftover_keys}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - run_transform
    priority: 5
