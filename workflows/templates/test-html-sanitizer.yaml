---
name: test-html-sanitizer
version: 1.0.0
description: Test html-sanitizer — strip mode removes tags, whitelist blocks script.
translations:
  en:
    name: "HTML Sanitizer Test"
    description: "Test html-sanitizer — strip mode removes tags, whitelist blocks script."
  zh:
    name: "HTML 清理器测试"
    description: "测试 html-sanitizer — strip 模式会移除标签，白名单会阻止 script。"
  zhHant:
    name: "HTML 清理器測試"
    description: "測試 html-sanitizer — strip 模式會移除標籤，白名單會阻止 script。"
  ja:
    name: "HTML サニタイザーテスト"
    description: "html-sanitizer のテスト — strip モードではタグを削除し、ホワイトリストは script をブロックします。"
  ko:
    name: "HTML 정리기 테스트"
    description: "html-sanitizer 테스트 — strip 모드는 태그를 제거하고, 허용 목록은 script를 차단합니다."
  es:
    name: "Test de saneador HTML"
    description: "Prueba de html-sanitizer — el modo strip elimina las etiquetas y la lista de अनुमति bloquea script."
  fr:
    name: "Test de nettoyage HTML"
    description: "Test de html-sanitizer — le mode strip supprime les balises et la liste blanche bloque script."
  de:
    name: "HTML-Bereinigungs-Test"
    description: "Test für html-sanitizer — der strip-Modus entfernt Tags, die Whitelist blockiert script."
  ar:
    name: "اختبار منظف HTML"
    description: "اختبار html-sanitizer — وضع strip يزيل العلامات، والقائمة البيضاء تحظر script."
  pt:
    name: "Teste de saneador HTML"
    description: "Teste de html-sanitizer — o modo strip remove as tags e a lista de अनुमति bloqueia script."
  vi:
    name: "Kiểm thử bộ làm sạch HTML"
    description: "Kiểm thử html-sanitizer — chế độ strip xóa thẻ, và danh sách cho phép chặn script."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: strip
    sub_workflow:
      name: utility-module-html-sanitizer
      inputs:
        input_html: "<p>Hello <strong>world</strong></p><script>alert('xss')</script><p>safe</p>"
        mode: strip
      outputs:
        strip_text: clean_text
        strip_stripped: stripped_tag_count
        strip_status: sanitize_status
    priority: 10
  - step: whitelist
    sub_workflow:
      name: utility-module-html-sanitizer
      inputs:
        input_html: "<p>safe <script>bad()</script><a href=\"javascript:alert(1)\">x</a><a href=\"https://ok.com\">ok</a></p>"
        mode: whitelist
      outputs:
        wl_text: clean_text
        wl_stripped: stripped_tag_count
    priority: 9
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        strip_text = os.environ.get("WF_VAR_STRIP_TEXT", "")
        wl_text = os.environ.get("WF_VAR_WL_TEXT", "")
        problems = []
        if "<" in strip_text: problems.append(f"strip still contains a tag: {strip_text[:300]}")
        if "alert" in strip_text: problems.append("strip did not remove script content")
        if "Hello" not in strip_text or "world" not in strip_text: problems.append("strip lost text")
        # whitelist: script should be gone, javascript: stripped, but a normal https link kept
        if "<script>" in wl_text: problems.append(f"whitelist missed script: {wl_text[:300]}")
        if "javascript:" in wl_text: problems.append(f"javascript: not stripped: {wl_text[:300]}")
        if 'href="https://ok.com"' not in wl_text: problems.append("safe link was incorrectly stripped")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [strip, whitelist]
    priority: 5
