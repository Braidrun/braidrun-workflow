---
name: test-html-sanitizer
version: 1.0.0
description: Test html-sanitizer — strip mode removes tags, whitelist blocks script.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: strip
    sub_workflow:
      name: utility-module-html-sanitizer
      inputs:
        input_html: "<p>Hello <strong>world</strong></p><script>alert('xss')</script><p>safe</p>"
        mode: strip
      outputs:
        strip_text: clean_text
        strip_stripped: stripped_tag_count
        strip_status: sanitize_status
    priority: 10
  - step: whitelist
    sub_workflow:
      name: utility-module-html-sanitizer
      inputs:
        input_html: "<p>safe <script>bad()</script><a href=\"javascript:alert(1)\">x</a><a href=\"https://ok.com\">ok</a></p>"
        mode: whitelist
      outputs:
        wl_text: clean_text
        wl_stripped: stripped_tag_count
    priority: 9
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        strip_text = os.environ.get("WF_VAR_STRIP_TEXT", "")
        wl_text = os.environ.get("WF_VAR_WL_TEXT", "")
        problems = []
        if "<" in strip_text: problems.append(f"strip 仍含 tag: {strip_text[:300]}")
        if "alert" in strip_text: problems.append("strip 没移除 script 内容")
        if "Hello" not in strip_text or "world" not in strip_text: problems.append("strip 丢了文字")
        # whitelist: script 应该没了，javascript: 被剥，但普通 https link 保留
        if "<script>" in wl_text: problems.append(f"whitelist 漏掉 script: {wl_text[:300]}")
        if "javascript:" in wl_text: problems.append(f"javascript: 未被剥: {wl_text[:300]}")
        if 'href="https://ok.com"' not in wl_text: problems.append("安全链接被错误剥除")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [strip, whitelist]
    priority: 5
