---
name: test-dingyue-optimize-task-list
version: 1.0.0
description: Test optimize task list — chain app-list → optimize task list.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: list_apps
    sub_workflow:
      name: dingyue-module-app-list-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", max_apps: "1"}
      outputs: {ids: app_ids_csv}
    priority: 20
  - step: pick
    code:
      language: python
      timeout: 5
      script: |
        import os
        ids = os.environ.get("WF_VAR_IDS", "").split(",")
        print(f"first_id={ids[0] if ids else ''}")
    extract: [{pattern: 'first_id=(.+)', variable: first_app_id}]
    depends_on: [list_apps]
    priority: 15
  - step: fetch
    sub_workflow:
      name: dingyue-module-optimize-task-list
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", app_id: "{{var:first_app_id}}", mobile_platform: "ios"}
      outputs:
        status: fetch_status
        cnt: task_count
        running: running_count
    depends_on: [pick]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        cnt = os.environ.get("WF_VAR_CNT", "")
        if not cnt.isdigit(): problems.append(f"cnt not numeric: {cnt}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (tasks={cnt}, running={os.environ.get('WF_VAR_RUNNING','?')})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch]
    priority: 5
