variables:
  topic: Trends in cloud computing technology
  output_dir: "./output"
  demo_mode: 'true'
agents:
  researcher:
    preset: researcher
    description: "Handles research and information gathering responsibilities in this test workflow."
    translations:
      en:
        description: "Handles research and information gathering responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的研究和信息收集职责。"
      zhHant:
        description: "負責此測試工作流程中的研究與資訊蒐集職責。"
      ja:
        description: "このテストワークフローで調査と情報収集を担当します。"
      ko:
        description: "이 테스트 워크플로에서 조사 및 정보 수집 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de investigación y recopilación de información en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de recherche et collecte d’informations dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Recherche und Informationsbeschaffung."
      ar:
        description: "يتولى مسؤوليات البحث وجمع المعلومات في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de pesquisa e coleta de informações neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò nghiên cứu và thu thập thông tin trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a research agent. Gather information on the given topic and produce a research summary.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  analyst:
    preset: data_analyst
    description: "Handles analysis responsibilities in this test workflow."
    translations:
      en:
        description: "Handles analysis responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的分析职责。"
      zhHant:
        description: "負責此測試工作流程中的分析職責。"
      ja:
        description: "このテストワークフローで分析を担当します。"
      ko:
        description: "이 테스트 워크플로에서 분석 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de análisis en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de analyse dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Analyse."
      ar:
        description: "يتولى مسؤوليات التحليل في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de análise neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò phân tích trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a data analyst. Analyze the research data and extract key insights.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  writer:
    preset: writer
    description: "Handles content and report writing responsibilities in this test workflow."
    translations:
      en:
        description: "Handles content and report writing responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的内容和报告写作职责。"
      zhHant:
        description: "負責此測試工作流程中的內容與報告撰寫職責。"
      ja:
        description: "このテストワークフローでコンテンツとレポートの作成を担当します。"
      ko:
        description: "이 테스트 워크플로에서 콘텐츠 및 보고서 작성 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de redacción de contenidos e informes en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de rédaction de contenus et de rapports dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Erstellung von Inhalten und Berichten."
      ar:
        description: "يتولى مسؤوليات كتابة المحتوى والتقارير في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de redação de conteúdo e relatórios neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò viết nội dung và báo cáo trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a professional writer. Create well-structured reports based on research and analysis.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: research
  agent: researcher
  priority: 10
  input: |-
    Research the topic "{{topic}}".
    Write a research summary (150-200 words) to {{output_dir}}/research.txt.
    Include key facts, trends, and notable developments.
    Create the output directory if it doesn't exist.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/research.md.
- step: analyze
  agent: analyst
  depends_on:
  - research
  priority: 8
  input: |-
    Read the research summary from {{output_dir}}/research.txt.
    Analyze the content and extract 3-5 key insights.
    Write your analysis to {{output_dir}}/analysis.txt.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/analyze.md.
- step: report
  agent: writer
  depends_on:
  - analyze
  priority: 5
  input: |-
    Read {{output_dir}}/research.txt and {{output_dir}}/analysis.txt.
    Write a final report (200-300 words) that combines the research and analysis.
    Save the report to {{output_dir}}/final_report.txt.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/report.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 300s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
