---
name: test-workflow-multi-preset
version: 1.0.0
tags:
- 测试
- 多预设
description: 多预设协作测试 - 使用不同类型的 agent 预设协同完成任务
variables:
  topic: 云计算技术发展趋势
  output_dir: "./output"
  demo_mode: 'true'
agents:
  researcher:
    preset: researcher
    overrides:
      system_prompt: |-
        You are a research agent. Gather information on the given topic and produce a research summary.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  analyst:
    preset: data_analyst
    overrides:
      system_prompt: |-
        You are a data analyst. Analyze the research data and extract key insights.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  writer:
    preset: writer
    overrides:
      system_prompt: |-
        You are a professional writer. Create well-structured reports based on research and analysis.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: research
  agent: researcher
  priority: 10
  input: |-
    Research the topic "{{topic}}".
    Write a research summary (150-200 words) to {{output_dir}}/research.txt.
    Include key facts, trends, and notable developments.
    Create the output directory if it doesn't exist.
    Call exit when done.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/research.md。
- step: analyze
  agent: analyst
  depends_on:
  - research
  priority: 8
  input: |-
    Read the research summary from {{output_dir}}/research.txt.
    Analyze the content and extract 3-5 key insights.
    Write your analysis to {{output_dir}}/analysis.txt.
    Call exit when done.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/analyze.md。
- step: report
  agent: writer
  depends_on:
  - analyze
  priority: 5
  input: |-
    Read {{output_dir}}/research.txt and {{output_dir}}/analysis.txt.
    Write a final report (200-300 words) that combines the research and analysis.
    Save the report to {{output_dir}}/final_report.txt.
    Call exit when done.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/report.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 300s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
