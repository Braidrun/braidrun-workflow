---
name: test-workflow-parallel
version: 1.0.0
tags:
- test
- parallel-execution
- parallel-processing
- parallel
description: Parallel execution test - multiple steps run simultaneously, testing parallel scheduling and result aggregation
translations:
  en:
    name: "Parallel Execution Test"
    description: "Parallel execution test - multiple steps run simultaneously, testing parallel scheduling and result aggregation"
  zh:
    name: "并行执行测试"
    description: "并行执行测试 - 多个步骤同时运行，测试并行调度和结果聚合"
  zhHant:
    name: "並行執行測試"
    description: "並行執行測試 - 多個步驟同時執行，測試並行排程和結果彙總"
  ja:
    name: "並列実行 テスト"
    description: "並列実行テスト - 複数のステップを同時に実行し、並列スケジューリングと結果の集約をテストします"
  ko:
    name: "병렬 실행 테스트"
    description: "병렬 실행 테스트 - 여러 단계가 동시에 실행되며, 병렬 스케줄링과 결과 집계를 테스트합니다"
  es:
    name: "Prueba de ejecución paralela"
    description: "Prueba de ejecución paralela: varias etapas se ejecutan simultáneamente, probando la programación paralela y la agregación de resultados"
  fr:
    name: "Test d’exécution parallèle"
    description: "Test d’exécution parallèle : plusieurs étapes s’exécutent simultanément, en testant la planification parallèle et l’agrégation des résultats"
  de:
    name: "Parallelausführungs-Test"
    description: "Parallelausführungs-Test - mehrere Schritte laufen gleichzeitig und testen die parallele Planung sowie die Ergebnisaggregation"
  ar:
    name: "اختبار التنفيذ المتوازي"
    description: "اختبار التنفيذ المتوازي - تعمل عدة خطوات في وقت واحد، مع اختبار الجدولة المتوازية وتجميع النتائج"
  pt:
    name: "Teste de execução paralela"
    description: "Teste de execução paralela - várias etapas são executadas simultaneamente, testando o agendamento paralelo e a agregação de resultados"
  vi:
    name: "Kiểm thử thực thi song song"
    description: "Kiểm thử thực thi song song - nhiều bước chạy đồng thời, kiểm thử lập lịch song song và tổng hợp kết quả"
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  worker:
    preset: universal
    description: "Handles precise task execution responsibilities in this test workflow."
    translations:
      en:
        description: "Handles precise task execution responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的精确任务执行职责。"
      zhHant:
        description: "負責此測試工作流程中的精確任務執行職責。"
      ja:
        description: "このテストワークフローで正確なタスク実行を担当します。"
      ko:
        description: "이 테스트 워크플로에서 정확한 작업 실행 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de ejecución precisa de tareas en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de exécution précise des tâches dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für präzise Aufgabenausführung."
      ar:
        description: "يتولى مسؤوليات التنفيذ الدقيق للمهام في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de execução precisa de tarefas neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò thực thi tác vụ chính xác trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a precise assistant. Follow instructions exactly. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: init
  agent: worker
  priority: 10
  input: |-
    Create the directory {{var:output_dir}}/parallel if it doesn't exist.
    Create a file {{var:output_dir}}/parallel/start.txt with content "Parallel test started".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/init.md.
- step: task_a
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_a.txt with content "Task A completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_a.md.
- step: task_b
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_b.txt with content "Task B completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_b.md.
- step: task_c
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_c.txt with content "Task C completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_c.md.
- step: aggregate
  agent: worker
  depends_on:
  - task_a
  - task_b
  - task_c
  parallel:
    tasks:
    - task_a
    - task_b
    - task_c
    aggregate_results: true
    max_parallel: 3
  input: |-
    Read all files in {{var:output_dir}}/parallel/ directory.
    Create a file {{var:output_dir}}/parallel/result.txt that lists:
    - Which tasks completed (task_a, task_b, task_c)
    - The content of each task file
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/aggregate.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
