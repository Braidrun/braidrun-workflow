---
name: test-workflow-parallel
version: 1.0.0
tags:
- test
- parallel-execution
- parallel-processing
- parallel
description: Parallel execution test - multiple steps run simultaneously, testing parallel scheduling and result aggregation
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  worker:
    preset: universal
    overrides:
      system_prompt: |-
        You are a precise assistant. Follow instructions exactly. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: init
  agent: worker
  priority: 10
  input: |-
    Create the directory {{var:output_dir}}/parallel if it doesn't exist.
    Create a file {{var:output_dir}}/parallel/start.txt with content "Parallel test started".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/init.md。
- step: task_a
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_a.txt with content "Task A completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_a.md。
- step: task_b
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_b.txt with content "Task B completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_b.md。
- step: task_c
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_c.txt with content "Task C completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/task_c.md。
- step: aggregate
  agent: worker
  depends_on:
  - task_a
  - task_b
  - task_c
  parallel:
    tasks:
    - task_a
    - task_b
    - task_c
    aggregate_results: true
    max_parallel: 3
  input: |-
    Read all files in {{var:output_dir}}/parallel/ directory.
    Create a file {{var:output_dir}}/parallel/result.txt that lists:
    - Which tasks completed (task_a, task_b, task_c)
    - The content of each task file
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/aggregate.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
