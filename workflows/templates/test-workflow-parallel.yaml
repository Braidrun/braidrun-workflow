---
name: test-workflow-parallel
version: 1.0.0
tags:
- 测试
- 并行执行
- 并行处理
- parallel
description: 并行执行测试 - 多个步骤同时执行，测试并行调度和结果聚合
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  worker:
    preset: universal
    overrides:
      system_prompt: |-
        You are a precise assistant. Follow instructions exactly. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: init
  agent: worker
  priority: 10
  input: |-
    Create the directory {{var:output_dir}}/parallel if it doesn't exist.
    Create a file {{var:output_dir}}/parallel/start.txt with content "Parallel test started".
    Then call exit.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/init.md。
- step: task_a
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_a.txt with content "Task A completed".
    Then call exit.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/task_a.md。
- step: task_b
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_b.txt with content "Task B completed".
    Then call exit.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/task_b.md。
- step: task_c
  agent: worker
  depends_on:
  - init
  input: |-
    Create a file {{var:output_dir}}/parallel/task_c.txt with content "Task C completed".
    Then call exit.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/task_c.md。
- step: aggregate
  agent: worker
  depends_on:
  - task_a
  - task_b
  - task_c
  parallel:
    tasks:
    - task_a
    - task_b
    - task_c
    aggregate_results: true
    max_parallel: 3
  input: |-
    Read all files in {{var:output_dir}}/parallel/ directory.
    Create a file {{var:output_dir}}/parallel/result.txt that lists:
    - Which tasks completed (task_a, task_b, task_c)
    - The content of each task file
    Then call exit.

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/aggregate.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
