---
name: social-media-ad-campaign
version: 3.0.0
tags:
- 社交媒体广告
- 广告投放
- 品牌推广
- 多角色协作
- 迭代优化
- 动态编排
- group_chat
- repeat_until
- agent_based
- extract
- condition
category: marketing
description: |
  社交媒体广告投放工作流。
  从受众洞察到投放优化的全链路社交广告管理：受众分析 → 创意策划会 → 多平台文案与素材制作 → 迭代审核 → 投放排期与优化策略。
  适用场景：微信朋友圈、抖音信息流、小红书等国内主流社交平台的广告投放与素材管理。
  特性：extract 结构化指标提取、group_chat 创意策划会、repeat_until 素材质量迭代、agent_based 多平台素材动态分配
variables:
  brand_name: 智慧学堂
  product: AI 英语口语陪练 App
  target_audience: 18-35 岁大学生和白领
  platforms: 微信朋友圈、抖音信息流、小红书
  daily_budget: 5000 元/天
  campaign_goal: App 下载安装
  quality_threshold: '8'
  output_dir: "./output/social-media-ad-campaign"
  demo_mode: 'true'
variable_tags:
  brand_name: '平台账号'
  campaign_goal: '业务参数'
  daily_budget: '业务参数'
  demo_mode: '运行模式'
  output_dir: '输出'
  platforms: '平台账号'
  product: '业务参数'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
agents:
  audience_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位社交媒体受众分析专家，精通用户画像构建和投放人群包策略。
        你擅长分析不同平台的用户行为差异，制定精准定向方案。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  creative_director:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位广告创意总监，精通社交媒体广告的创意策略。
        你擅长设计高转化率的广告创意，深谙各平台的内容调性和最佳实践。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  copywriter:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位广告文案撰写专家，擅长撰写各种社交媒体广告文案。
        你的文案简洁有力、转化率高，能精准戳中目标用户的痛点。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  media_buyer:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位广告投放优化师，精通各平台广告系统的出价策略和优化技巧。
        你擅长预算分配、A/B 测试和投放效果分析。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位广告素材质量评审专家。对广告创意素材进行综合评分。
        评分维度：创意吸引力(25%)、文案转化力(25%)、平台适配(25%)、品牌一致性(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: audience-analysis
  agent: audience_analyst
  input: |
    为「{{var:brand_name}}」的广告投放制定受众策略：
    产品：{{var:product}}
    目标受众：{{var:target_audience}}
    投放平台：{{var:platforms}}
    投放目标：{{var:campaign_goal}}
    日预算：{{var:daily_budget}}

    1. 核心用户画像（人口属性、兴趣标签、行为特征）。
    2. 各平台定向设置建议（年龄/地域/兴趣/行为）。
    3. 竞品广告分析（竞品在投什么素材、什么定向）。
    4. 种子人群和 Lookalike 策略。
    5. 预估各平台的 CPA 和 ROI。
    输出必须包含以下格式化指标：
    - target_audience_size=N（目标受众规模）
    - platform_count=N（投放平台数）
    输出到：audience-analysis.md
  extract:
  - pattern: target_audience_size=(\d+)
    variable: target_audience_size
  - pattern: platform_count=(\d+)
    variable: platform_count
  priority: 10
- step: creative-meeting
  group_chat:
    participants:
    - audience_analyst
    - creative_director
    - copywriter
    - media_buyer
    initial_message: |-
      广告创意策划会开始。请审查受众分析：
      {{steps.audience-analysis.output}}

      讨论重点：
      1. 核心卖点提炼：产品最打动目标用户的 3 个点是什么？
      2. 各平台创意方向：朋友圈/抖音/小红书分别用什么形式？
      3. 广告 Hook 策略：前 3 秒/第一句话怎么抓住注意力？
      4. 预算如何在各平台间分配？
      5. A/B 测试计划：测试哪些变量？
      讨论完毕后请说 PLAN_APPROVED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: PLAN_APPROVED
  depends_on:
  - audience-analysis
  priority: 9
- step: creative-production
  agent_based:
    orchestrator:
      preset: universal
      overrides:
        system_prompt: |
          你是广告制作项目经理。根据创意策划会的共识，分配素材制作任务：
          - 文案类任务分配给 copywriter
          - 投放策略和出价建议分配给 media_buyer
          - 可以并行制作不同平台的素材
          确保每个平台至少有 3 套不同创意变体用于 A/B 测试。
        session_id_strategy: per_execution
    participants:
    - copywriter
    - media_buyer
    goal: |-
      基于创意策划会共识制作各平台广告素材：

      受众分析：{{steps.audience-analysis.output}}
      创意共识：{{steps.creative-meeting.output}}

      需要制作：
      1. 微信朋友圈：外层文案（3版）+ 落地页文案
      2. 抖音信息流：视频脚本（3版，各15-30秒）+ 标题
      3. 小红书：种草笔记风格广告（3版）
      4. 各平台出价策略和预算分配方案，并生成可直接展示的 demo 结论。
    max_steps: 12
    budget_tokens: 400000
  depends_on:
  - creative-meeting
  priority: 8
- step: creative-review
  agent: creative_director
  input: |
    对广告素材进行质量审核和优化：

    素材：{{steps.creative-production.output}}
    上次评估反馈（如有）：{{steps.creative-review:evaluate.output}}

    审核维度：
    1. 各平台素材是否符合平台规范？
    2. 品牌调性是否一致？
    3. CTA 是否清晰有力？
    4. 文案是否有歧义或合规风险？
    5. 优化后输出到：creative-final.md
  depends_on:
  - creative-production
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下广告素材的质量。
      评分维度：创意吸引力(25%)、文案转化力(25%)、平台适配(25%)、品牌一致性(25%)。
      输出格式：quality_score=N（1-10 分）

      广告素材：
      {{steps.creative-review.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: launch-strategy
  agent: media_buyer
  input: |
    为广告素材（质量评分 {{var:quality_score}}）制定投放和优化策略：

    终稿素材：{{steps.creative-review.output}}
    受众定向：{{steps.audience-analysis.output}}
    日预算：{{var:daily_budget}}

    1. 投放排期：分阶段投放计划（测试期→放量期→稳定期）。
    2. A/B 测试方案：素材/文案/定向的测试矩阵。
    3. 出价策略：各平台的初始出价和调价规则。
    4. 优化检查清单：每日/每周需关注的指标和优化动作。
    5. 预警规则：CPA 超过阈值、消耗异常等自动预警设置。
    6. 周报模板：关键数据指标汇总格式。
    输出到：launch-strategy.md
  depends_on:
  - creative-review
  priority: 4
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
