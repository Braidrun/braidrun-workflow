---
name: test-quality-review-loop
version: 1.0.0
description: |
  Test harness for dingyue-module-quality-review-loop (LLM-driven).

  Runs a trivial quality-review loop with a low-bar rubric (min_score=5)
  that should pass in 1-2 iterations, asserts final review_status is either
  "passed" or "max_iterations_reached" (both are valid terminal states).

  Requires: OPENROUTER_API_KEY env var set.

tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: review_loop
    sub_workflow:
      name: dingyue-module-quality-review-loop
      inputs:
        task_prompt: "写一段 2-3 句话介绍 Braidrun 平台是什么。"
        rubric_description: "5 分通过标准: 包含'AI agent'和'订阅管理'两个关键词即可。不需要文采。"
        min_score: "5"
        max_iterations: "2"
        agent_preset: universal
      outputs:
        rv_status: review_status
        rv_score: final_score
        rv_iterations: iteration_count
        rv_output: final_output
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        status = os.environ.get("WF_VAR_RV_STATUS", "").strip()
        score_raw = os.environ.get("WF_VAR_RV_SCORE", "").strip()
        iters_raw = os.environ.get("WF_VAR_RV_ITERATIONS", "").strip()

        problems = []

        # Both "passed" and "max_iterations_reached" are valid terminal outputs.
        # The test verifies the loop actually ran and produced a score.
        if status not in {"passed", "max_iterations_reached"}:
            problems.append(f"review_status expected passed|max_iterations_reached, got '{status}'")

        try:
            score = int(score_raw)
            if score < 0 or score > 100:
                problems.append(f"final_score out of [0, 100]: {score}")
        except ValueError:
            problems.append(f"final_score not int: '{score_raw}'")

        try:
            iters = int(iters_raw)
            if iters < 1 or iters > 3:
                problems.append(f"iteration_count out of [1, 3]: {iters}")
        except ValueError:
            problems.append(f"iteration_count not int: '{iters_raw}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print(f"TEST_STATUS=pass (status={status}, score={score_raw}, iters={iters_raw})")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - review_loop
    priority: 5
