---
name: flutter-cross-platform-development
version: 3.0.0
tags:
- Flutter
- 跨平台开发
- 移动开发
- 多角色协作
- 迭代优化
- group_chat
- repeat_until
- extract
- condition
category: software
description: |
  Flutter 跨平台 App 开发工作流

  适用场景：使用 Flutter/Dart 同时交付 iOS 和 Android 应用，需要兼顾两端 UI 规范和原生能力集成。
  说明：Flutter 架构师、跨平台 UI 设计师、原生平台专家三方协作，通过 group_chat 技术评审会确认架构和状态管理方案，
  repeat_until 迭代优化构建策略直到质量达标，涵盖 CI/CD、Flavor 配置、包体瘦身等工程化环节。
  流程：架构设计 -> 技术评审 -> UI 规范 -> 原生集成 -> 构建策略迭代优化 -> 最终技术方案汇总。
variables:
  app_name: FlutterX
  use_firebase: 'true'
  state_management: Riverpod
  quality_threshold: '8'
  output_dir: "./output/flutter-cross-platform-development"
  demo_mode: 'true'
variable_tags:
  app_name: '平台账号'
  demo_mode: '运行模式'
  output_dir: '输出'
  quality_threshold: '业务参数'
  state_management: '业务参数'
  use_firebase: '运行模式'
agents:
  flutter_architect:
    preset: universal
    overrides:
      system_prompt: |-
        你是 Flutter 专家，精通：
        - Dart 语言和 Flutter 渲染引擎
        - 状态管理 (Riverpod, Provider)
        - 响应式 UI 布局
        - 跨平台原生插件开发 (MethodChannel)
        - 编译优化
        提供高效、健壮的跨平台架构。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  flutter_ui_designer:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位擅长 Flutter 的 UI/UX 设计师，负责：
        - 同时设计符合 iOS (Cupertino) 和 Android (Material) 风格的通用组件
        - 屏幕自适应方案设计
        - Flutter 动画效果设计

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  platform_specialist:
    preset: coder
    overrides:
      system_prompt: |-
        你是一位移动端原生开发专家，精通 iOS (Swift) 和 Android (Kotlin) 原生开发。
        你负责评估 Flutter 与原生交互的方案，包括 Platform Channel、FFI 和原生模块集成。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位移动端架构评审专家。对跨平台方案进行综合评分。
        评分维度：架构合理性(25%)、跨平台兼容性(25%)、性能考量(25%)、可维护性(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: architecture-design
  agent: flutter_architect
  input: |
    针对项目「{{var:app_name}}」，采用「{{var:state_management}}」状态管理进行架构设计：
    1. 核心文件夹结构设计（feature-first 模块化）。
    2. 路由方案（Navigator 2.0 / go_router）。
    3. 网络封装（Dio + 拦截器 + 缓存策略）。
    4. 本地化多语言方案建议。
    5. 依赖注入方案。
    6. 错误处理和日志系统。
    输出必须包含以下格式化指标：
    - features_count=N（功能点数量）
    - screens_count=N（页面数量）
    输出到：flutter-architecture.md
  extract:
  - pattern: features_count=(\d+)
    variable: features_count
  - pattern: screens_count=(\d+)
    variable: screens_count
  priority: 10
- step: tech-review
  group_chat:
    participants:
    - flutter_architect
    - flutter_ui_designer
    - platform_specialist
    initial_message: |-
      Flutter 项目技术评审会。请审查架构设计：
      {{steps.architecture-design.output}}

      讨论重点：
      1. 状态管理方案（{{var:state_management}}）是否适合项目规模？
      2. 路由方案是否支持深链接和导航守卫？
      3. UI 组件设计是否兼顾 iOS 和 Android 风格差异？
      4. 需要哪些原生能力？Platform Channel 方案是否合理？
      5. Firebase 集成（{{var:use_firebase}}）的范围和配置
      讨论完毕后请说 TECH_APPROVED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: TECH_APPROVED
  depends_on:
  - architecture-design
  priority: 9
- step: flutter-ui-spec
  agent: flutter_ui_designer
  input: |
    基于技术评审共识，设计通用 App UI 组件规范：

    架构设计：{{steps.architecture-design.output}}
    评审反馈：{{steps.tech-review.output}}

    1. Design Token 定义（颜色、字体、间距、圆角变量）。
    2. 封装常用组件（Button、TextField、Card、Dialog、BottomSheet）。
    3. iOS (Cupertino) 和 Android (Material) 风格差异适配策略。
    4. 响应式布局方案（手机/平板/折叠屏）。
    5. 动画规范（页面转场、微交互、加载动画）。
    6. 暗色模式适配方案。
    输出到：flutter-ui-spec.md
  depends_on:
  - tech-review
  priority: 8
- step: native-integration
  agent: platform_specialist
  input: |
    设计原生能力集成方案：

    架构设计：{{steps.architecture-design.output}}
    评审反馈：{{steps.tech-review.output}}

    1. Firebase 集成范围：{{var:use_firebase}}（Analytics, Crashlytics, Push, Auth）。
    2. 原生权限清单（Camera, Location, Storage 等）和权限请求流程。
    3. Platform Channel 接口定义（需要原生实现的功能清单）。
    4. 第三方 SDK 集成（iOS: SPM/CocoaPods, Android: Gradle）。
    5. 平台特定功能（iOS: Widget, Android: Foreground Service）。
    输出到：native-integration.md
  depends_on:
  - tech-review
  priority: 8
- step: build-strategy
  agent: flutter_architect
  input: |
    制定多端构建策略并优化：

    架构：{{steps.architecture-design.output}}
    UI 规范：{{steps.flutter-ui-spec.output}}
    原生集成：{{steps.native-integration.output}}
    上次评估反馈（如有）：{{steps.build-strategy:evaluate.output}}

    1. 配置 Flavors（Dev, Staging, Prod）及环境变量。
    2. CI/CD 配置（Codemagic / GitHub Actions / Fastlane）。
    3. 代码混淆和包体瘦身方案（Tree Shaking, 资源压缩）。
    4. 性能优化清单（启动速度、内存占用、帧率）。
    5. 多端构建脚本和自动化分发。
    输出到：flutter-build-plan.md
  depends_on:
  - flutter-ui-spec
  - native-integration
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下 Flutter 跨平台方案的质量。
      评分维度：架构合理性(25%)、跨平台兼容性(25%)、性能考量(25%)、可维护性(25%)。
      输出格式：quality_score=N（1-10 分）

      方案：
      {{steps.build-strategy.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: final-plan
  agent: flutter_architect
  input: |
    汇总生成最终 Flutter 项目技术方案（评分 {{var:quality_score}}）：
    1. 架构设计：{{steps.architecture-design.output}}
    2. 技术评审共识：{{steps.tech-review.output}}
    3. UI 组件规范：{{steps.flutter-ui-spec.output}}
    4. 原生集成方案：{{steps.native-integration.output}}
    5. 构建策略：{{steps.build-strategy.output}}
    6. 项目里程碑和排期建议
    输出到：flutter-project-plan.md
  depends_on:
  - build-strategy
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
