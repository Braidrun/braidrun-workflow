---
name: user-growth-strategy
version: 3.0.0
tags:
- 用户增长
- 增长策略
- 运营
- 多角色协作
- 迭代优化
- group_chat
- repeat_until
- extract
- condition
category: marketing
description: |
  用户增长策略工作流。
  基于 AARRR 模型的系统化增长方案生成：数据分析与增长瓶颈识别 → 多角色增长策略会 → 渠道与产品增长策略制定 → 迭代优化 → 分阶段执行计划输出。
  适用场景：移动应用或 SaaS 产品的用户增长规划，包括获客渠道选择、裂变机制设计、留存优化和增长实验设计。
  特性：extract 结构化指标提取、group_chat 增长策略会、repeat_until 策略质量迭代
variables:
  product_name: 智慧学堂 App
  current_dau: 50000
  growth_target: 3 个月内 DAU 翻倍至 10 万
  budget: 月预算 20 万
  quality_threshold: '8'
  output_dir: "./output/user-growth-strategy"
  demo_mode: 'true'
variable_tags:
  budget: '业务参数'
  current_dau: '业务参数'
  demo_mode: '运行模式'
  growth_target: '业务参数'
  output_dir: '输出'
  product_name: '业务参数'
  quality_threshold: '业务参数'
agents:
  growth_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位用户增长分析师，精通增长黑客方法论和 AARRR 模型。
        你擅长数据驱动的增长实验设计和用户行为分析。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  channel_expert:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位渠道增长专家，精通各类获客渠道（SEO/SEM/社交/内容/裂变）。
        你能评估不同渠道的 ROI 并制定最优的渠道组合策略。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  product_growth:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位产品增长专家，擅长产品内增长机制设计。
        你精通邀请裂变、Onboarding 优化、留存策略和用户激活。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位增长策略评审专家。对增长方案进行综合评分。
        评分维度：数据支撑(25%)、策略可行性(25%)、ROI 预期(25%)、创新性(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: growth-analysis
  agent: growth_analyst
  input: |
    分析「{{var:product_name}}」的增长现状：
    当前 DAU：{{var:current_dau}}
    增长目标：{{var:growth_target}}
    预算：{{var:budget}}

    1. 当前漏斗分析（AARRR）：获客→激活→留存→收入→推荐各环节的转化率。
    2. 用户分层分析：核心用户、活跃用户、沉默用户、流失用户占比。
    3. 增长瓶颈识别：哪个环节的优化空间最大？
    4. 竞品增长策略分析。
    5. 历史增长数据趋势和关键转折点。
    输出必须包含以下格式化指标：
    - current_users=N（当前用户数）
    - growth_channels=N（增长渠道数）
    输出到：growth-analysis.md
  extract:
  - pattern: current_users=(\d+)
    variable: current_users
  - pattern: growth_channels=(\d+)
    variable: growth_channels
  priority: 10
- step: growth-meeting
  group_chat:
    participants:
    - growth_analyst
    - channel_expert
    - product_growth
    initial_message: |-
      增长策略会议开始。请审查增长分析：
      {{steps.growth-analysis.output}}

      目标：{{var:growth_target}}，预算：{{var:budget}}

      讨论重点：
      1. 增长瓶颈的根因是什么？从哪里突破？
      2. 渠道增长 vs 产品增长，预算如何分配？
      3. 有哪些低成本高回报的增长实验可以快速验证？
      4. 裂变机制如何设计？（邀请奖励、社交传播）
      5. 留存优化和激活优化哪个 ROI 更高？
      讨论完毕后请说 STRATEGY_ALIGNED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 5
    speaker_selection: round_robin
    termination_keyword: STRATEGY_ALIGNED
  depends_on:
  - growth-analysis
  priority: 8
- step: growth-strategy
  agent: growth_analyst
  input: |
    基于策略会共识制定增长方案：

    增长分析：{{steps.growth-analysis.output}}
    策略共识：{{steps.growth-meeting.output}}
    上次评估反馈（如有）：{{steps.growth-strategy:evaluate.output}}

    方案结构：
    1. 渠道增长策略（按渠道列出具体方案、预算和预期 ROI）。
    2. 产品增长策略（Onboarding 优化、裂变机制、留存策略）。
    3. 增长实验清单（至少 10 个，含假设/方法/成功指标/优先级）。
    4. 预算分配方案和里程碑。
    5. 风险评估和备选方案。
    输出到：growth-strategy.md
  depends_on:
  - growth-meeting
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下增长策略的质量。
      评分维度：数据支撑(25%)、策略可行性(25%)、ROI 预期(25%)、创新性(25%)。
      输出格式：quality_score=N（1-10 分）

      增长策略：
      {{steps.growth-strategy.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: execution-plan
  agent: growth_analyst
  input: |
    生成增长执行计划（质量评分 {{var:quality_score}}）：
    1. 第 1 个月：快速验证期（Top 3 增长实验）。
    2. 第 2 个月：放大期（有效策略加大投入）。
    3. 第 3 个月：优化期（精细化运营）。
    4. 周报/月报模板和关键追踪指标。
    5. 团队分工和协作机制。
    输出到：growth-execution-plan.md
  depends_on:
  - growth-strategy
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
