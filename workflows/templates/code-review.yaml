name: code-review
version: 1.0.0
description: Generic code review workflow for repository changes.
tags:
  - coding
  - review
agents:
  reviewer:
    preset: coder
    overrides:
      max_iterations: 24
workflow:
  - step: inspect_changes
    agent: reviewer
    input: |
      Review the current repository changes.
      Focus on correctness, regressions, security risks, and missing tests.
  - step: summarize_findings
    agent: reviewer
    depends_on: [inspect_changes]
    input: |
      Turn the review notes into a concise report with findings first.
      Previous output:
      {{steps.inspect_changes.output}}
