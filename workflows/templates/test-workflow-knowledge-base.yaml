variables:
  research_topic: Capabilities and best practices of the braidrun-workflow workflow system
  output_dir: "./output"
  demo_mode: 'true'
agents:
  researcher:
    preset: universal
    overrides:
      system_prompt: |-
        You are a researcher. Use searchKnowledge tool to find relevant information
        from the shared knowledge base. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      - rag_tools
      max_iterations: 8196
      session_id_strategy: auto
  analyst:
    preset: universal
    overrides:
      system_prompt: |-
        You are a data analyst. Analyze data and produce reports with metrics.
        Use searchKnowledge tool to query the knowledge base. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      - rag_tools
      max_iterations: 8196
      session_id_strategy: auto
  writer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a report writer. Create comprehensive reports. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: initial_research
  agent: researcher
  input: |-
    Conduct initial research on "{{var:research_topic}}".
    Output the key findings, major trends, and important data points.
    Note: your output will be automatically indexed into the shared knowledge base.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/initial_research.md.
- step: deep_analysis
  agent: analyst
  input: |-
    Conduct an in-depth analysis of "{{var:research_topic}}".
    Use the searchKnowledge tool to look up relevant information in the knowledge base.
    Output an analysis report backed by concrete data.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/deep_analysis.md.
  depends_on:
  - initial_research
- step: supplementary_research
  agent: researcher
  input: |-
    Based on the existing research and analysis, conduct supplementary research.
    Use searchKnowledge to look up existing findings in the knowledge base and avoid duplication.
    Focus on aspects not covered previously.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/supplementary_research.md.
  depends_on:
  - deep_analysis
- step: final_report
  agent: writer
  input: |
    Based on the following, generate the final research report and save it to {{var:output_dir}}/research_report.txt:
    Initial research: {{steps.initial_research.output}}
    In-depth analysis: {{steps.deep_analysis.output}}
    Supplementary research: {{steps.supplementary_research.output}}
  depends_on:
  - supplementary_research
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
knowledge_base:
  enabled: true
  storage_dir: "./kb-test"
  embedding_model: text-embedding-3-small
  embedding_provider: openai
  auto_index_outputs: true
  auto_inject_rag_tools: true
  chunk_size: 500
  chunk_overlap: 50
  max_indexed_documents: 100
  max_total_chunks: 1000
  source_files:
  - path: "./README.md"
    tags: overview,agent
  - path: "./WORKFLOW_GUIDE.md"
    tags: workflow,syntax
  - path: "./API_REFERENCE.md"
    tags: api,reference
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
