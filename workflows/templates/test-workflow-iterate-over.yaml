variables:
  task_list: Design the login page, implement user registration, write unit tests, deploy to the test environment
  output_dir: "./output"
  demo_mode: 'true'
agents:
  generator:
    preset: universal
    overrides:
      system_prompt: |-
        You are a data generator. Produce structured lists. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  processor:
    preset: universal
    overrides:
      system_prompt: |-
        You are a data processor. Process each item carefully. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a summarizer. Create concise summaries. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: process_tasks_serial
  agent: processor
  input: |-
    Handle task #{{var:task_index}}: {{var:task_item}}
    Output an execution plan for this task (a single paragraph is fine).

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/process_tasks_serial.md.
  iterate_over:
    source: "{{var:task_list}}"
    delimiter: ","
    item_variable: task_item
    index_variable: task_index
    max_items: 10
    parallel: false
    results_variable: serial_results
- step: generate_checklist
  agent: generator
  input: |-
    Based on the following task results, generate one quality-check item per task (one per line):
    {{var:serial_results}}
    Output one check item per line, in the format: check-item name

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/generate_checklist.md.
- step: parallel_check
  agent: processor
  input: |-
    Execute quality-check item #{{var:check_index}}: {{var:check_item}}
    Output the check result: pass or fail, with the reason.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/parallel_check.md.
  iterate_over:
    source: "{{steps.generate_checklist.output}}"
    delimiter: "\n"
    item_variable: check_item
    index_variable: check_index
    max_items: 5
    parallel: true
    max_parallel: 3
    results_variable: check_results
  depends_on:
  - generate_checklist
- step: iteration_summary
  agent: summarizer
  input: |
    Summarize the following iteration results and save them to {{var:output_dir}}/iteration_report.txt:
    Serial task results: {{var:serial_results}}
    Parallel check results: {{var:check_results}}
  depends_on:
  - process_tasks_serial
  - parallel_check
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
