---
name: test-workflow-iterate-over
version: 1.0.0
tags:
- 测试
- 动态列表遍历
- 批量处理
- 并行处理
- iterate_over
- parallel
description: |
  动态列表遍历功能测试 - 测试 iterate_over 步骤的各种配置
  覆盖：source（变量/步骤输出）、delimiter（换行/逗号/json_array）、
  item_variable、index_variable、max_items、parallel、
  max_parallel、results_variable
variables:
  task_list: 设计登录页面,实现用户注册,编写单元测试,部署到测试环境
  output_dir: "./output"
  demo_mode: 'true'
agents:
  generator:
    preset: universal
    overrides:
      system_prompt: |-
        You are a data generator. Produce structured lists. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  processor:
    preset: universal
    overrides:
      system_prompt: |-
        You are a data processor. Process each item carefully. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a summarizer. Create concise summaries. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: process_tasks_serial
  agent: processor
  input: |-
    处理任务 #{{var:task_index}}: {{var:task_item}}
    请输出该任务的执行方案（一段话即可）。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/process_tasks_serial.md。
  iterate_over:
    source: "{{var:task_list}}"
    delimiter: ","
    item_variable: task_item
    index_variable: task_index
    max_items: 10
    parallel: false
    results_variable: serial_results
- step: generate_checklist
  agent: generator
  input: |-
    基于以下任务处理结果，为每个任务生成一个质量检查项（每行一项）：
    {{var:serial_results}}
    请每行输出一个检查项，格式：检查项名称

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/generate_checklist.md。
- step: parallel_check
  agent: processor
  input: |-
    执行质量检查项 #{{var:check_index}}: {{var:check_item}}
    输出检查结果：通过或不通过，并说明原因。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/parallel_check.md。
  iterate_over:
    source: "{{steps.generate_checklist.output}}"
    delimiter: "\n"
    item_variable: check_item
    index_variable: check_index
    max_items: 5
    parallel: true
    max_parallel: 3
    results_variable: check_results
  depends_on:
  - generate_checklist
- step: iteration_summary
  agent: summarizer
  input: |
    汇总以下遍历执行结果，保存到 {{var:output_dir}}/iteration_report.txt：
    串行任务处理结果：{{var:serial_results}}
    并行检查结果：{{var:check_results}}
  depends_on:
  - process_tasks_serial
  - parallel_check
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
