  fr:
    name: "Test de webhook Discord"
    description: "Test de parcours négatif pour utility-module-discord-webhook. Nous n’avons pas de vraie URL de webhook Discord, donc nous vérifions le garde de validation du module : lorsqu’une URL qui ne ressemble pas à un webhook Discord est fournie, le module doit lever une erreur (et non réussir silencieusement). Le routage on_failure est utilisé, donc l’échec de sub_workflow est « récupéré » et l’étape assert s’exécute quand même."
  de:
    name: "Discord-Webhook-Test"
    description: "Negativtest für utility-module-discord-webhook. Wir haben keine echte Discord webhook URL, daher prüfen wir die Validierungsschranke des Moduls: Wenn eine URL übergeben wird, die nicht wie ein Discord webhook aussieht, muss das Modul einen Fehler auslösen und darf nicht stillschweigend erfolgreich sein. Das on_failure-Routing wird verwendet, sodass der sub_workflow-Fehler „wiederhergestellt“ wird und der assert-Schritt trotzdem ausgeführt wird."
  ar:
    name: "اختبار Webhook Discord"
    description: "اختبار مسار سلبي لـ utility-module-discord-webhook. ليس لدينا webhook URL حقيقية لـ Discord، لذا نتحقق من حارس التحقق في الوحدة: عندما تُعطى URL لا تبدو كـ Discord webhook، يجب أن ترفع الوحدة خطأً (لا أن تنجح بصمت). يستخدم التوجيه on_failure، لذا يتم \"استرداد\" فشل sub_workflow وتستمر خطوة assert في التنفيذ."
  pt:
    name: "Teste de webhook do Discord"
    description: "Teste de caminho negativo para utility-module-discord-webhook. Não გვაქვს uma URL real de webhook do Discord, então verificamos a proteção de validação do módulo: quando é fornecida uma URL que não parece um webhook do Discord, o módulo deve gerar erro (e não concluir com sucesso silenciosamente). Usa roteamento on_failure, então a falha de sub_workflow é \"recuperada\" e a etapa assert ainda é executada."
  vi:
    name: "Kiểm thử webhook Discord"
    description: "Kiểm thử luồng âm cho utility-module-discord-webhook. Chúng tôi không có URL webhook Discord thực, nên xác minh bộ kiểm tra của mô-đun: khi cung cấp một URL không giống webhook Discord, mô-đun phải phát sinh lỗi, không được âm thầm thành công. Sử dụng định tuyến on_failure, nên lỗi sub_workflow được \"khôi phục\" và bước assert vẫn chạy."
tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: bad_url
    sub_workflow:
      name: utility-module-discord-webhook
      inputs:
        webhook_url: "https://not-discord.example.com/webhook/123"
        content: "this should never be sent"
      outputs:
        bad_send_status: send_status
        bad_status_code: status_code
    on_failure:
      - next: assert
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        # If module validated URL properly, it raised before printing send_status,
        # so the parent variable stays at the default empty string.
        send_status = os.environ.get("WF_VAR_BAD_SEND_STATUS", "").strip()
        status_code = os.environ.get("WF_VAR_BAD_STATUS_CODE", "").strip()

        problems = []
        if send_status != "":
            problems.append(f"send_status should be empty (module rejected URL), got '{send_status}'")
        if status_code not in ("", "0"):
            problems.append(f"status_code should be empty/0 (no HTTP call made), got '{status_code}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass (module correctly rejected non-Discord URL)")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    priority: 5
