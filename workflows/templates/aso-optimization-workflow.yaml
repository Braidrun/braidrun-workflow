---
name: aso-optimization-workflow
version: 3.0.0
tags:
- ASO优化
- 应用商店
- 营销推广
- extract
category: marketing
description: |
  应用商店优化 (ASO) 专项工作流。
  系统化提升 App 在 App Store 和 Google Play 的搜索排名、曝光率和转化率：竞品 ASO 审计 → 关键词扩展 → 元数据优化 → 视觉资产建议 → A/B 测试方案 → 完整优化报告。
  适用场景：移动应用的商店页面优化、关键词排名提升、下载转化率优化。
  特性：extract 结构化指标提取、group_chat ASO 策略讨论、repeat_until 元数据质量迭代
variables:
  app_id: com.example.app
  main_keywords: 效率工具, 时间管理, 任务清单
  target_region: 中国
  platform: iOS
  output_dir: "./output/aso-optimization-workflow"
  demo_mode: 'true'
variable_tags:
  app_id: '平台账号'
  demo_mode: '运行模式'
  main_keywords: '业务参数'
  output_dir: '输出'
  platform: '平台账号'
  target_region: '业务参数'
agents:
  aso_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位资深的 ASO (App Store Optimization) 专家，擅长：
        - 关键词挖掘与权重分析
        - 搜索排名算法洞察
        - 竞品 ASO 策略反编译
        - 转化率 (CRO) 优化
        请提供专业、可执行的优化建议。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  copywriter:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位移动营销文案专家，擅长编写：
        - 吸引人的 App 标题和副标题
        - 高转化率的 App 描述
        - 优化的关键词列表（针对 Apple 100字符限制）
        文案应兼顾搜索权重和用户点击欲望。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  visual_designer:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位移动应用视觉设计专家，负责：
        - App 图标 (Icon) 优化建议
        - 商店截图 (Screenshots) 布局设计
        - 预览视频 (Preview Video) 脚本编写
        设计应符合当前流行趋势并突出产品核心价值。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: competitor-aso-audit
  agent: aso_analyst
  input: |
    分析 {{app_id}} 在 {{target_region}} 市场的 ASO 现状及 Top 3 竞品。

    1. 获取竞品的关键词覆盖情况（列出竞品名称、覆盖关键词数、重叠度）。
    2. 分析竞品的标题和描述结构（字符数、关键词密度、卖点表述方式）。
    3. 评估当前 App 的搜索排名劣势（与竞品的排名差距、未覆盖的高价值词）。
    4. 竞品视觉资产对比（图标风格、截图数量与布局、是否有预览视频）。
    5. 竞品评分和评论分析（星级、评论关键词、用户满意/不满的高频主题）。

    输出必须包含以下格式化指标：
    - keywords_count=N（关键词数量）
    - current_ranking=N（当前排名）
    输出到：aso-competitor-audit.md
  extract:
  - pattern: keywords_count=(\d+)
    variable: keywords_count
  - pattern: current_ranking=(\d+)
    variable: current_ranking
  priority: 10
- step: keyword-expansion
  agent: aso_analyst
  input: |
    基于核心词 "{{main_keywords}}"，在 {{target_region}} 市场进行扩展。

    1. 挖掘长尾词、关联词、同义词和场景词（至少 30 个候选词）。
    2. 评估每个词的搜索热度（高/中/低）和竞争度（难/中/易）。
    3. 按搜索意图分组（功能型/场景型/品牌型/问题型）。
    4. 筛选出一组高潜力关键词（高搜索热度 + 中低竞争度），按优先级排序。
    5. 针对 {{platform}} 平台特性给出关键词填充建议（iOS 100 字符限制 / Google Play 描述优化）。

    输出到：keyword-pool.md
  depends_on:
  - competitor-aso-audit
  priority: 9
- step: metadata-optimization
  agent: copywriter
  input: |
    基于关键词池 {{steps.keyword-expansion.output}} 为 {{platform}} 平台编写元数据。
    要求：
    1. 标题 (Title)：包含核心词，吸引点击
    2. 副标题/简短描述 (Subtitle)：补充功能价值
    3. 关键词列表 (Keywords)：仅限 iOS，利用 100 字符
    4. 详细描述 (Description)：前三行必须吸引人，包含特性列表
    输出到：metadata-v1.md
  depends_on:
  - keyword-expansion
  priority: 8
- step: visual-asset-suggestions
  agent: visual_designer
  input: |
    针对 {{steps.metadata-optimization.output}} 提供视觉优化建议。

    1. Icon 优化建议：是否需要调整元素/配色以匹配核心关键词和品类趋势？提供 2-3 个方向。
    2. 截图优化方案：
       - 前两张截图展示哪些核心功能（第一张截图的打开率决定转化率）
       - 推荐截图数量（6-10 张）及每张的内容主题
       - 文字标注风格（字体大小、位置、语言适配）
    3. 预览视频脚本建议（15-30 秒，展示核心使用场景）。
    4. 建议的配色方案（主色调应与 Icon 一致，在搜索结果中醒目）。
    5. 竞品视觉对标分析（与 Top 3 竞品的视觉差异化方向）。

    输出到：visual-assets-plan.md
  depends_on:
  - metadata-optimization
  priority: 7
- step: ab-test-strategy
  agent: aso_analyst
  input: |
    制定元数据或视觉资产的 A/B 测试计划。

    1. 确定测试变量和优先级（图标/截图/标题/描述的测试顺序）。
    2. 设计测试方案：
       - 变量 A vs 变量 B 的具体差异描述
       - 预期影响指标（CVR、下载量、页面停留时间）
    3. 设定测试周期（建议 7-14 天，最低样本量要求）和成功指标（显著性 p < 0.05）。
    4. 工具建议：Google Play 实验工具、Apple 产品页优化、第三方 A/B 测试工具对比。
    5. 测试结果分析框架和后续迭代路径。

    输出到：aso-ab-test-plan.md
  depends_on:
  - visual-asset-suggestions
  priority: 6
- step: aso-final-report
  agent: aso_analyst
  input: |
    汇总 ASO 优化完整方案。

    包含以下部分：
    1. 执行摘要：当前排名现状、优化目标和预期效果。
    2. 优化后的元数据表格（标题/副标题/关键词/描述的最终版本，含字符数统计）。
    3. 关键词分配建议（按优先级排列，标注放置位置：标题/副标题/关键词字段/描述）。
    4. 视觉修改清单（Icon/截图/视频的具体修改项和验收标准）。
    5. A/B 测试执行计划和时间线。
    6. 效果追踪指标和复查周期（建议每 2 周复查一次排名变化）。

    输出到：aso-optimization-final.md
  depends_on:
  - ab-test-strategy
  priority: 5
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1800s
  per_step: 300s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
