---
name: test-workflow-code-steps
version: 1.0.0
tags:
- 测试
- 确定性代码
- 确定性计算
- extract
- code
description: |
  确定性代码步骤功能测试 - 测试 Code 步骤的各种语言和配置
  覆盖：language（python/javascript/bash）、script（内联）、
  script_file（外部文件）、timeout、working_directory、
  环境变量注入（WF_VAR_/STEP_OUTPUT_/STEP_INPUTS）
variables:
  project_name: CodeStepTest
  input_data: hello,world,foo,bar
  threshold: '3'
  output_dir: "./output"
  demo_mode: 'true'
agents:
  helper:
    preset: universal
    overrides:
      system_prompt: |-
        You are a helpful assistant. Complete tasks precisely. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: python_data_processing
  code:
    language: python
    script: |
      import os
      import json

      # 读取工作流变量（通过环境变量注入）
      project = os.environ.get('WF_VAR_PROJECT_NAME', 'unknown')
      data = os.environ.get('WF_VAR_INPUT_DATA', '')
      threshold = int(os.environ.get('WF_VAR_THRESHOLD', '0'))

      # 确定性数据处理
      items = [item.strip() for item in data.split(',') if item.strip()]
      result = {
          "project": project,
          "item_count": len(items),
          "items": items,
          "above_threshold": len(items) > threshold,
          "status": "processed"
      }
      print(json.dumps(result))
    timeout: 15
- step: bash_setup
  code:
    language: bash
    script: |
      # 创建输出目录
      mkdir -p ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}
      # 写入元数据文件
      echo "project=${WF_VAR_PROJECT_NAME}" > ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      echo "created_by=code_step" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      echo "timestamp=$(date +%s)" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      # 输出结果
      echo "Directory setup complete: ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}"
    timeout: 10
  depends_on:
  - python_data_processing
- step: js_transform
  code:
    language: javascript
    script: |
      // 读取上游步骤的输出
      const prevOutput = process.env.STEP_OUTPUT_PYTHON_DATA_PROCESSING || '{}';
      let data;
      try {
        data = JSON.parse(prevOutput);
      } catch(e) {
        data = { raw: prevOutput };
      }

      // 数据转换
      const result = {
        source: 'js_transform',
        original_count: data.item_count || 0,
        transformed_items: (data.items || []).map(item => item.toUpperCase()),
        validation: {
          has_data: (data.item_count || 0) > 0,
          status: data.status || 'unknown'
        }
      };
      console.log(JSON.stringify(result));
    timeout: 15
  depends_on:
  - python_data_processing
- step: python_with_extract
  code:
    language: python
    script: |
      import os
      import json

      # 读取多个上游输出
      js_output = os.environ.get('STEP_OUTPUT_JS_TRANSFORM', '{}')
      bash_output = os.environ.get('STEP_OUTPUT_BASH_SETUP', '')

      try:
          js_data = json.loads(js_output)
      except:
          js_data = {}

      total_items = js_data.get('original_count', 0)
      transformed = js_data.get('transformed_items', [])

      print(f"validation_passed=true")
      print(f"total_count={total_items}")
      print(f"Summary: Processed {total_items} items, transformed {len(transformed)} items")
    timeout: 15
  extract:
  - pattern: validation_passed=(\w+)
    variable: validation_result
  - pattern: total_count=(\d+)
    variable: total_count
  depends_on:
  - js_transform
  - bash_setup
- step: generate_report
  agent: helper
  input: |
    基于以下处理结果，生成最终报告并保存到 {{var:output_dir}}/{{var:project_name}}/report.txt：
    数据处理结果：{{steps.python_data_processing.output}}
    数据转换结果：{{steps.js_transform.output}}
    验证结果：{{var:validation_result}}
    总数量：{{var:total_count}}
  depends_on:
  - python_with_extract
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 60s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
