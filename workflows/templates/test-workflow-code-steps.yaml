variables:
  project_name: CodeStepTest
  input_data: hello,world,foo,bar
  threshold: '3'
  output_dir: "./output"
  demo_mode: 'true'
agents:
  helper:
    preset: universal
    overrides:
      system_prompt: |-
        You are a helpful assistant. Complete tasks precisely. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: python_data_processing
  code:
    language: python
    script: |
      import os
      import json

      # read workflow variables (injected via environment variables)
      project = os.environ.get('WF_VAR_PROJECT_NAME', 'unknown')
      data = os.environ.get('WF_VAR_INPUT_DATA', '')
      threshold = int(os.environ.get('WF_VAR_THRESHOLD', '0'))

      # deterministic data processing
      items = [item.strip() for item in data.split(',') if item.strip()]
      result = {
          "project": project,
          "item_count": len(items),
          "items": items,
          "above_threshold": len(items) > threshold,
          "status": "processed"
      }
      print(json.dumps(result))
    timeout: 15
- step: bash_setup
  code:
    language: bash
    script: |
      # create the output directory
      mkdir -p ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}
      # write the metadata file
      echo "project=${WF_VAR_PROJECT_NAME}" > ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      echo "created_by=code_step" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      echo "timestamp=$(date +%s)" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/metadata.txt
      # output the result
      echo "Directory setup complete: ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}"
    timeout: 10
  depends_on:
  - python_data_processing
- step: js_transform
  code:
    language: javascript
    script: |
      // read the output of the upstream step
      const prevOutput = process.env.STEP_OUTPUT_PYTHON_DATA_PROCESSING || '{}';
      let data;
      try {
        data = JSON.parse(prevOutput);
      } catch(e) {
        data = { raw: prevOutput };
      }

      // data transformation
      const result = {
        source: 'js_transform',
        original_count: data.item_count || 0,
        transformed_items: (data.items || []).map(item => item.toUpperCase()),
        validation: {
          has_data: (data.item_count || 0) > 0,
          status: data.status || 'unknown'
        }
      };
      console.log(JSON.stringify(result));
    timeout: 15
  depends_on:
  - python_data_processing
- step: python_with_extract
  code:
    language: python
    script: |
      import os
      import json

      # read multiple upstream outputs
      js_output = os.environ.get('STEP_OUTPUT_JS_TRANSFORM', '{}')
      bash_output = os.environ.get('STEP_OUTPUT_BASH_SETUP', '')

      try:
          js_data = json.loads(js_output)
      except:
          js_data = {}

      total_items = js_data.get('original_count', 0)
      transformed = js_data.get('transformed_items', [])

      print(f"validation_passed=true")
      print(f"total_count={total_items}")
      print(f"Summary: Processed {total_items} items, transformed {len(transformed)} items")
    timeout: 15
  extract:
  - pattern: validation_passed=(\w+)
    variable: validation_result
  - pattern: total_count=(\d+)
    variable: total_count
  depends_on:
  - js_transform
  - bash_setup
- step: generate_report
  agent: helper
  input: |
    Based on the following results, generate the final report and save it to {{var:output_dir}}/{{var:project_name}}/report.txt:
    Data processing result: {{steps.python_data_processing.output}}
    Data transformation result: {{steps.js_transform.output}}
    Validation result: {{var:validation_result}}
    Total count: {{var:total_count}}
  depends_on:
  - python_with_extract
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 60s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
