---
name: test-workflow-code-steps
version: 1.0.0
tags:
- test
- deterministic-code
- deterministic-compute
- extract
- code
description: |
  Deterministic code step feature test - tests the various languages and configurations of the Code step
  Covers: language (python/javascript/bash), script (inline),
  script_file (external file), timeout, working_directory,
  environment variable injection (WF_VAR_/STEP_OUTPUT_/STEP_INPUTS)
