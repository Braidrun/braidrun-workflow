---
name: test-markdown-report-builder
version: 1.0.0
description: |
  Test harness for dingyue-module-markdown-report-builder (LLM-driven, needs OpenRouter key).

  Writes a simple summary JSON fixture, asks the builder to render a
  summary-type markdown report, and verifies:
  - report_status == ok
  - report_file is a real markdown file with headings
  - section_count >= 1

  Requires: OPENROUTER_API_KEY env var set.

tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: setup_fixture
    code:
      language: python
      timeout: 10
      script: |
        import json
        import tempfile
        from pathlib import Path

        base = Path(tempfile.mkdtemp(prefix="md_test_"))
        data = {
            "title": "Q1 2026 Subscription Snapshot",
            "period": "2026-01 to 2026-03",
            "highlights": [
                {"metric": "MRR", "value": "$128,400", "change": "+12%"},
                {"metric": "Active Users", "value": "4,320", "change": "+18%"},
                {"metric": "Churn Rate", "value": "2.1%", "change": "-0.4%"},
            ],
            "notes": "All three metrics trended favorably. MRR grew primarily from the Pro tier upsell.",
        }
        fixture = base / "data.json"
        fixture.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
        out_dir = base / "reports"
        out_dir.mkdir()
        print(f"fixture_path={fixture}")
        print(f"out_dir={out_dir}")
    extract:
      - pattern: 'fixture_path=(.+)'
        variable: fixture_path
      - pattern: 'out_dir=(.+)'
        variable: out_dir
    priority: 20

  - step: build
    sub_workflow:
      name: dingyue-module-markdown-report-builder
      inputs:
        data_json_path: "{{var:fixture_path}}"
        template_type: summary
        title: "Q1 2026 Subscription Snapshot"
        subtitle: "Generated by test harness"
        output_dir: "{{var:out_dir}}"
        output_filename: "q1_snapshot"
        include_summary_table: "true"
      outputs:
        md_status: report_status
        md_file: report_file
        md_sections: section_count
    depends_on:
      - setup_fixture
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys
        from pathlib import Path

        status = os.environ.get("WF_VAR_MD_STATUS", "").strip()
        md_file = os.environ.get("WF_VAR_MD_FILE", "").strip()
        sections_raw = os.environ.get("WF_VAR_MD_SECTIONS", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"report_status != 'ok', got '{status}'")

        if not md_file:
            problems.append("report_file is empty")
        elif not Path(md_file).exists():
            problems.append(f"report_file does not exist: {md_file}")
        else:
            content = Path(md_file).read_text(encoding="utf-8")
            if len(content) < 50:
                problems.append(f"report is suspiciously short ({len(content)} chars)")
            if "#" not in content:
                problems.append("report has no markdown heading (no '#' char)")

        try:
            sections = int(sections_raw)
            if sections < 1:
                problems.append(f"section_count expected >= 1, got {sections}")
        except ValueError:
            problems.append(f"section_count not int: '{sections_raw}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print(f"TEST_STATUS=pass (sections={sections_raw}, size={len(content) if md_file and Path(md_file).exists() else 0})")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - build
    priority: 5
