---
name: test-data-merger
version: 1.0.0
description: Test data-merger LEFT JOIN users + orders on id = user_id.
translations:
  en:
    name: "Data Merger Test"
    description: "Test data-merger LEFT JOIN users + orders on id = user_id."
  zh:
    name: "数据合并测试"
    description: "测试 data-merger 对用户和订单按 id = user_id 执行 LEFT JOIN。"
  zhHant:
    name: "資料合併測試"
    description: "測試 data-merger 針對使用者與訂單依 id = user_id 執行 LEFT JOIN。"
  ja:
    name: "データマージャーテスト"
    description: "data-merger の users と orders を id = user_id で LEFT JOIN するテスト。"
  ko:
    name: "데이터 병합 테스트"
    description: "data-merger가 users와 orders를 id = user_id로 LEFT JOIN하는지 테스트합니다."
  es:
    name: "Prueba de combinación de datos"
    description: "Prueba de data-merger: LEFT JOIN de users y orders por id = user_id."
  fr:
    name: "Test de fusion de données"
    description: "Test de data-merger : LEFT JOIN de users et orders sur id = user_id."
  de:
    name: "Datenzusammenführungs-Test"
    description: "Test von data-merger: LEFT JOIN von users und orders über id = user_id."
  ar:
    name: "اختبار دمج البيانات"
    description: "اختبار data-merger: تنفيذ LEFT JOIN بين users وorders على id = user_id."
  pt:
    name: "Teste de mesclagem de dados"
    description: "Teste de data-merger: LEFT JOIN de users e orders em id = user_id."
  vi:
    name: "Kiểm thử gộp dữ liệu"
    description: "Kiểm thử data-merger: LEFT JOIN users và orders theo id = user_id."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-data-merger
      inputs:
        left_json: '[{"id":1,"name":"alice"},{"id":2,"name":"bob"},{"id":3,"name":"carol"}]'
        right_json: '[{"user_id":1,"amount":100},{"user_id":1,"amount":50},{"user_id":3,"amount":80}]'
        left_key: id
        right_key: user_id
        join_type: left
      outputs:
        merged: merged_json
        cnt: merged_count
        status: merge_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        raw = os.environ.get("WF_VAR_MERGED", "")
        cnt = os.environ.get("WF_VAR_CNT", "0")
        problems = []
        rows = json.loads(raw)
        # alice has 2 orders, bob 0 (LEFT preserves), carol 1 → 4 rows
        if len(rows) != 4: problems.append(f"rows expected 4, got {len(rows)}")
        names = [r.get("name") for r in rows]
        if sorted(names) != ["alice","alice","bob","carol"]:
          problems.append(f"names {names}")
        if problems:
          print("TEST_STATUS=fail")
          [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
