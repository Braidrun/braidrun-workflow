---
name: test-slack-deliver
version: 1.0.0
description: |
  Negative-path test for dingyue-module-slack-deliver.

  Without a Slack Incoming Webhook URL, we verify the module's pre-flight
  validation: empty slack_webhook_url should raise in prepare_payload before
  any network activity. Uses on_failure recovery so the test workflow can still
  assert on the outcome.

tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: missing_webhook
    sub_workflow:
      name: dingyue-module-slack-deliver
      inputs:
        slack_webhook_url: ""
        message_text: "this should never be sent"
      outputs:
        slack_status: delivery_status
        slack_message: delivery_message
        slack_target: delivery_target
    on_failure:
      - next: assert
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        status = os.environ.get("WF_VAR_SLACK_STATUS", "").strip()
        message = os.environ.get("WF_VAR_SLACK_MESSAGE", "").strip()
        target = os.environ.get("WF_VAR_SLACK_TARGET", "").strip()

        problems = []
        if status != "":
            problems.append(f"delivery_status should be empty (pre-flight raised), got '{status}'")
        if message != "":
            problems.append(f"delivery_message should be empty (pre-flight raised), got '{message}'")
        if target != "":
            problems.append(f"delivery_target should be empty (pre-flight raised), got '{target}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass (module correctly rejected empty webhook)")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    priority: 5
