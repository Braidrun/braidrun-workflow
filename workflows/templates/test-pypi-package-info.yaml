---
name: test-pypi-package-info
version: 1.0.0
description: Test pypi-package-info for requests (stable, popular).
translations:
  en:
    name: "PyPI Package Info Test"
    description: "Test pypi-package-info for requests (stable, popular)."
  zh:
    name: "PyPI 包信息测试"
    description: "针对 requests 的 pypi-package-info 测试（稳定、流行）。"
  zhHant:
    name: "PyPI 套件資訊測試"
    description: "針對 requests 的 pypi-package-info 測試（穩定、熱門）。"
  ja:
    name: "PyPI パッケージ情報テスト"
    description: "requests に対する pypi-package-info のテスト（安定、人気）。"
  ko:
    name: "PyPI 패키지 정보 테스트"
    description: "requests에 대한 pypi-package-info 테스트(안정적, 인기 있음)."
  es:
    name: "Prueba de información de paquete de PyPI"
    description: "Prueba de pypi-package-info para requests (estable, popular)."
  fr:
    name: "Test d’informations de paquet PyPI"
    description: "Test de pypi-package-info pour requests (stable, populaire)."
  de:
    name: "PyPI-Paketinfo-Test"
    description: "Test von pypi-package-info für requests (stabil, beliebt)."
  ar:
    name: "اختبار معلومات حزمة PyPI"
    description: "اختبار pypi-package-info لـ requests (مستقر، شائع)."
  pt:
    name: "Teste de informações do pacote PyPI"
    description: "Teste de pypi-package-info para requests (estável, popular)."
  vi:
    name: "Kiểm thử thông tin gói PyPI"
    description: "Kiểm thử pypi-package-info cho requests (ổn định, phổ biến)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-pypi-package-info
      inputs: {package_name: "requests", max_versions: "5"}
      outputs:
        ver: latest_version
        desc: description
        status: pypi_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        ver = os.environ.get("WF_VAR_VER", "")
        if not ver or not ver.count(".") >= 1: problems.append(f"version invalid: {ver}")
        desc = os.environ.get("WF_VAR_DESC", "").lower()
        if "http" not in desc: problems.append(f"description doesn't mention http: {desc}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (requests v{ver})")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
