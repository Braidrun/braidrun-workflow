---
name: test-opengraph-fetcher
version: 1.0.0
description: Test opengraph-fetcher on github.com home (reliable OG tags).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-opengraph-fetcher
      inputs: {url: "https://github.com/", timeout_seconds: "15"}
      outputs:
        t: og_title
        img: og_image
        status: og_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        title = os.environ.get("WF_VAR_T", "")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if "GitHub" not in title and "github" not in title.lower():
          print(f"TEST_STATUS=fail\n  - og_title wrong: {title}"); sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
