---
name: test-dingyue-asa-adgroup-fetcher
version: 1.0.0
description: Test ASA adgroup fetcher — chain discover → first app → first campaign → adgroups.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: discover
    sub_workflow:
      name: dingyue-module-asa-app-discover
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", limit: "5"}
      outputs: {apps: apps_json}
    priority: 30
  - step: pick_app
    code:
      language: python
      timeout: 5
      script: |
        import json, os
        apps = json.loads(os.environ.get("WF_VAR_APPS", "[]"))
        if not apps: raise RuntimeError("no ASA apps")
        print(f"asa_app_id={apps[0]['app_id']}")
    extract: [{pattern: 'asa_app_id=(.+)', variable: asa_app_id}]
    depends_on: [discover]
    priority: 25
  - step: campaigns
    sub_workflow:
      name: dingyue-module-asa-campaign-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", app_id: "{{var:asa_app_id}}"}
      outputs: {camps: campaigns_json, cnt: campaign_count}
    depends_on: [pick_app]
    priority: 20
  - step: pick_camp
    code:
      language: python
      timeout: 5
      script: |
        import json, os
        camps = json.loads(os.environ.get("WF_VAR_CAMPS", "[]"))
        if not camps: raise RuntimeError("no campaigns")
        print(f"camp_id={camps[0]['id']}")
    extract: [{pattern: 'camp_id=(.+)', variable: camp_id}]
    depends_on: [campaigns]
    priority: 15
  - step: fetch
    sub_workflow:
      name: dingyue-module-asa-adgroup-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", app_id: "{{var:asa_app_id}}", campaign_id: "{{var:camp_id}}"}
      outputs:
        status: fetch_status
        cnt: adgroup_count
    depends_on: [pick_camp]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        cnt = os.environ.get("WF_VAR_CNT", "")
        if not cnt.isdigit(): problems.append(f"cnt not numeric: {cnt}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (adgroups={cnt})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch]
    priority: 5
