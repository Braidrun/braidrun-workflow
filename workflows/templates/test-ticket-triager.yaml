---
name: test-ticket-triager
version: 1.0.0
description: Test utility-module-ticket-triager (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-ticket-triager
      inputs:
        "ticket_title": "Cannot login — password reset email not arriving"
        ticket_body: "I have tried requesting a password reset 5 times over the past hour. No email has arrived in my inbox or spam folder. This is blocking my work."
      outputs:
        cat: category
        sev: severity
        status: triage_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
