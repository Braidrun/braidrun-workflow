variables:
  dataset: sales_q4_2025
  output_dir: "./output"
  demo_mode: 'true'
agents:
  analyst:
    preset: universal
    description: "Handles analysis responsibilities in this test workflow."
    translations:
      en:
        description: "Handles analysis responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的分析职责。"
      zhHant:
        description: "負責此測試工作流程中的分析職責。"
      ja:
        description: "このテストワークフローで分析を担当します。"
      ko:
        description: "이 테스트 워크플로에서 분석 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de análisis en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de analyse dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Analyse."
      ar:
        description: "يتولى مسؤوليات التحليل في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de análise neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò phân tích trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a data analyst. Always output structured data in the requested format.
        Include metrics like score=N, count=N in your output. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    description: "Handles report summarization responsibilities in this test workflow."
    translations:
      en:
        description: "Handles report summarization responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的报告总结职责。"
      zhHant:
        description: "負責此測試工作流程中的報告摘要職責。"
      ja:
        description: "このテストワークフローでレポート要約を担当します。"
      ko:
        description: "이 테스트 워크플로에서 보고서 요약 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de resumen de informes en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de synthèse de rapports dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Berichtszusammenfassung."
      ar:
        description: "يتولى مسؤوليات تلخيص التقارير في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de resumo de relatórios neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò tóm tắt báo cáo trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a report summarizer. Create concise summaries. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: analyze_data
  agent: analyst
  input: |-
    Analyze the dataset "{{var:dataset}}". The output must include metrics in the following format:
    total_records=<count>
    quality_score=<score 1-10>
    anomaly_count=<number of anomalies>
    status=completed

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/analyze_data.md.
  extract:
  - pattern: total_records=(\d+)
    variable: total_records
  - pattern: quality_score=(\d+)
    variable: quality_score
  - pattern: anomaly_count=(\d+)
    variable: anomaly_count
  - pattern: status=(\w+)
    variable: analysis_status
- step: compute_metrics
  code:
    language: python
    script: |
      import os
      import json

      records = int(os.environ.get('WF_VAR_TOTAL_RECORDS', '100'))
      anomalies = int(os.environ.get('WF_VAR_ANOMALY_COUNT', '5'))

      result = {
        "metrics": {
          "completeness": round((records - anomalies) / max(records, 1) * 100, 2),
          "health": "good" if anomalies < records * 0.1 else "poor"
        },
        "summary": {
          "processed": records,
          "clean": records - anomalies
        }
      }
      print(json.dumps(result))
    timeout: 10
  extract:
  - json_path: "$.metrics.completeness"
    variable: completeness_pct
  - json_path: "$.metrics.health"
    variable: data_health
  - json_path: "$.summary.clean"
    variable: clean_records
  depends_on:
  - analyze_data
- step: validate_results
  code:
    language: bash
    script: |
      echo "Validation Report"
      echo "================="
      echo "Dataset: ${WF_VAR_DATASET}"
      echo "Completeness: ${WF_VAR_COMPLETENESS_PCT}%"
      echo "Health: ${WF_VAR_DATA_HEALTH}"
      echo "Clean Records: ${WF_VAR_CLEAN_RECORDS}"
      echo "validation_passed=true"
      echo "report_version=1.0"
    timeout: 10
  extract:
  - pattern: validation_passed=(\w+)
    variable: is_validated
  - pattern: report_version=([\d.]+)
    variable: report_version
  depends_on:
  - compute_metrics
- step: final_report
  agent: summarizer
  input: |
    Generate the final data-analysis report and save it to {{var:output_dir}}/analysis_report.txt:
    Dataset: {{var:dataset}}
    Total records: {{var:total_records}}
    Quality score: {{var:quality_score}}
    Anomaly count: {{var:anomaly_count}}
    Analysis status: {{var:analysis_status}}
    Completeness: {{var:completeness_pct}}%
    Data health: {{var:data_health}}
    Cleaned records: {{var:clean_records}}
    Validation passed: {{var:is_validated}}
    Report version: {{var:report_version}}
  depends_on:
  - validate_results
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 60s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
