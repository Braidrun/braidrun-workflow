---
name: test-regex-extractor
version: 1.0.0
description: |
  Test harness for utility-module-regex-extractor.

  Feeds a mixed text blob through the built-in email + url + ipv4 extractors
  plus a custom price-pattern; asserts each extractor returns the expected
  number of matches.

translations:
  en:
    name: "Regex Extractor Test"
    description: "Test harness for utility-module-regex-extractor. Feeds a mixed text blob through the built-in email + url + ipv4 extractors plus a custom price-pattern; asserts each extractor returns the expected number of matches."
  zh:
    name: "正则提取器测试"
    description: "utility-module-regex-extractor 的测试框架。将混合文本块输入内置的 email、url、ipv4 提取器以及自定义价格模式；断言每个提取器返回的匹配数量符合预期。"
  zhHant:
    name: "Regex 擷取器測試"
    description: "utility-module-regex-extractor 的測試框架。將混合文字區塊輸入內建的 email、url、ipv4 擷取器以及自訂價格模式；斷言每個擷取器返回的符合數量符合預期。"
  ja:
    name: "Regex 抽出テスト"
    description: "utility-module-regex-extractor のテストハーネス。混在したテキストブロックを組み込みの email、url、ipv4 抽出器とカスタムの price-pattern に通し、各抽出器が期待どおりの一致数を返すことを検証する。"
  ko:
    name: "정규식 추출기 테스트"
    description: "utility-module-regex-extractor의 테스트 하니스. 혼합된 텍스트 블록을 내장 email, url, ipv4 추출기와 사용자 지정 price-pattern에 통과시키고, 각 추출기가 예상한 일치 개수를 반환하는지 검증한다."
  es:
    name: "Prueba de extractor de expresiones regulares"
    description: "Arnés de pruebas para utility-module-regex-extractor. Pasa un bloque de texto mixto por los extractores integrados email, url e ipv4, además de un patrón de precio personalizado; afirma que cada extractor devuelve el número esperado de coincidencias."
  fr:
    name: "Test d’extracteur d’expressions régulières"
    description: "Harnais de test pour utility-module-regex-extractor. Envoie un bloc de texte mixte aux extracteurs intégrés email, url et ipv4, ainsi qu’à un motif de prix personnalisé ; vérifie que chaque extracteur renvoie le nombre de correspondances attendu."
  de:
    name: "Regex-Extraktor Test"
    description: "Testharness für utility-module-regex-extractor. Führt einen gemischten Textblock durch die integrierten email-, url- und ipv4-Extraktoren sowie ein benutzerdefiniertes price-pattern; prüft, dass jeder Extraktor die erwartete Anzahl von Treffern zurückgibt."
  ar:
    name: "اختبار مستخرج التعبيرات النمطية"
    description: "إطار اختبار لـ utility-module-regex-extractor. يمرر كتلة نصية مختلطة عبر مستخرجات email وurl وipv4 المضمنة بالإضافة إلى نمط price-pattern مخصص؛ ويؤكد أن كل مستخرج يعيد العدد المتوقع من المطابقات."
  pt:
    name: "Teste de extrator de regex"
    description: "Suíte de teste para utility-module-regex-extractor. Envia um bloco de texto misto pelos extratores embutidos email, url e ipv4, além de um padrão de preço personalizado; afirma que cada extrator retorna o número esperado de correspondências."
  vi:
    name: "Kiểm thử bộ trích xuất regex"
    description: "Bộ kiểm thử cho utility-module-regex-extractor. Đưa một khối văn bản hỗn hợp qua các bộ trích xuất email, url và ipv4 tích hợp cùng một mẫu giá tùy chỉnh; xác nhận mỗi bộ trích xuất trả về số lượng khớp như mong đợi."
tags:
  - code
  - extract
  - sub_workflow

variables:
  sample_text: |
    Contact us at support@example.com or sales@foo.io for inquiries.
    Visit https://example.com/docs or http://foo.bar/a-b?x=1#frag for more.
    Our API servers are 10.0.0.5 and 192.168.1.100 (staging: 172.16.0.42).
    Pricing: $9.99 and $1299.00 per seat per month.
    Bad IPs like 999.999.999.999 must NOT match ipv4.
  price_patterns: |
    {"price": {"regex": "\\$(\\d+(?:\\.\\d+)?)", "all": true}}

agents: {}

workflow:
  - step: run_extract
    sub_workflow:
      name: utility-module-regex-extractor
      inputs:
        input_text: "{{var:sample_text}}"
        patterns_json: "{{var:price_patterns}}"
        builtin_patterns: "email,url,ipv4"
        first_only: "false"
        dedupe_matches: "true"
      outputs:
        extracted_json: extracted_json
        total_matches: total_matches
        pattern_count: pattern_count
        extract_status: extract_status
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json
        import os
        import sys

        status = os.environ.get("WF_VAR_EXTRACT_STATUS", "").strip()
        total_raw = os.environ.get("WF_VAR_TOTAL_MATCHES", "").strip()
        patcount_raw = os.environ.get("WF_VAR_PATTERN_COUNT", "").strip()
        extracted_raw = os.environ.get("WF_VAR_EXTRACTED_JSON", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"status != ok (got '{status}')")

        try:
            parsed = json.loads(extracted_raw)
        except json.JSONDecodeError as e:
            problems.append(f"extracted_json not valid JSON: {e}")
            parsed = None

        if parsed is not None:
            # Expect exactly these four named groups.
            expected_keys = {"email", "url", "ipv4", "price"}
            actual_keys = set(parsed.keys())
            if actual_keys != expected_keys:
                problems.append(f"pattern keys mismatch; expected {expected_keys}, got {actual_keys}")

            emails = parsed.get("email", [])
            if sorted(emails) != ["sales@foo.io", "support@example.com"]:
                problems.append(f"emails wrong: {emails}")

            urls = parsed.get("url", [])
            if len(urls) != 2:
                problems.append(f"expected 2 urls, got {len(urls)}: {urls}")

            ipv4s = parsed.get("ipv4", [])
            if sorted(ipv4s) != ["10.0.0.5", "172.16.0.42", "192.168.1.100"]:
                problems.append(f"ipv4 wrong (should have 3, excluding 999.999.999.999): {ipv4s}")

            prices = parsed.get("price", [])
            # Regex has a capture group, so the extractor should return the numeric portion.
            if sorted(prices) != ["1299.00", "9.99"]:
                problems.append(f"price wrong: {prices}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - run_extract
    priority: 5
