---
name: test-asa-report-fetcher
version: 1.0.0
description: |
  Test harness for braidrun-module-asa-report-fetcher.

  With braidrun web creds the ASA skill login succeeds but subsequent
  report calls require a real ASA-enrolled app_id which the configured test account
  may or may not have. We test:
  - negative path: missing creds → module raises
  - attempted real call: if account has ASA access it returns data;
    otherwise the module surfaces the API error (handled via on_failure)

tags:
  - code
  - error_handling
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: try_real
    sub_workflow:
      name: braidrun-module-asa-report-fetcher
      inputs:
        username: "{{var:test_username}}"
        password: "{{var:test_password}}"
        braidrun_platform: "braidrun"
        app_id: "1234567890"
        report_type: "campaigns"
        start_date: "2026-04-14"
        end_date: "2026-04-20"
        limit: "50"
      outputs:
        real_status: fetch_status
        real_rows: row_count
    on_failure:
      - next: assert
    priority: 20

  - step: missing_creds
    sub_workflow:
      name: braidrun-module-asa-report-fetcher
      inputs:
        username: ""
        password: ""
        app_id: "1234567890"
        report_type: "campaigns"
        start_date: "2026-04-14"
        end_date: "2026-04-20"
      outputs:
        mc_status: fetch_status
    on_failure:
      - next: assert
    priority: 15

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []

        # real_call: either ok (if account has ASA) or raised (no access) —
        # both are acceptable; we just verify one of those two, not a silent wrong value
        rs = os.environ.get("WF_VAR_REAL_STATUS", "").strip()
        if rs not in ("", "ok"):
            problems.append(f"real_status should be '' (raised) or 'ok' (success), got '{rs}'")

        # missing_creds: must raise at pre-flight → status empty
        mc = os.environ.get("WF_VAR_MC_STATUS", "").strip()
        if mc != "":
            problems.append(f"missing_creds should raise, got status='{mc}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems: print(f"  - {p}")
            sys.exit(1)
        outcome = "fetched data" if rs == "ok" else "API error surfaced (account lacks ASA or fake app_id)"
        print(f"TEST_STATUS=pass (outcome: {outcome})")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    priority: 5
