---
name: test-workflow-classifier
version: 1.0.0
tags:
- 测试
- 智能分类路由
- 智能路由
- classifier
- condition
description: |
  智能分类路由功能测试 - 测试 Classifier 步骤的分类和条件分支
  覆盖：agent、input、categories（name + description）、output_variable、
  default_category、与 condition 条件分支配合
variables:
  user_message: 我的账户无法登录，提示密码错误，但我确认密码是正确的
  output_dir: "./output"
  ticket_category: ''
  demo_mode: 'true'
agents:
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a classification expert. Classify inputs accurately into the provided categories. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  tech_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a technical support specialist. Handle technical issues. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  billing_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a billing specialist. Handle billing and payment issues. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  general_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a general support agent. Handle general inquiries. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a report summarizer. Create summaries. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: classify_ticket
  classifier:
    agent: classifier_agent
    input: |-
      请对以下用户问题进行分类：
      {{var:user_message}}

      演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/classify_ticket.md。
    categories:
    - name: technical
      description: 技术问题，包括账户登录、系统错误、功能故障、配置问题
    - name: billing
      description: 计费问题，包括账单查询、支付失败、退款请求、套餐变更
    - name: general
      description: 一般咨询，包括产品功能咨询、使用指南、反馈建议
    output_variable: ticket_category
    default_category: general
- step: handle_technical
  agent: tech_handler
  condition: ticket_category == 'technical'
  input: |-
    处理以下技术问题，生成解决方案：
    用户问题：{{var:user_message}}
    问题分类：{{var:ticket_category}}
    请输出详细的排查步骤和解决方案。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/handle_technical.md。
  depends_on:
  - classify_ticket
- step: handle_billing
  agent: billing_handler
  condition: ticket_category == 'billing'
  input: |-
    处理以下计费问题：
    用户问题：{{var:user_message}}
    问题分类：{{var:ticket_category}}
    请输出处理方案和后续操作步骤。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/handle_billing.md。
  depends_on:
  - classify_ticket
- step: handle_general
  agent: general_handler
  condition: ticket_category == 'general'
  input: |-
    处理以下一般咨询：
    用户问题：{{var:user_message}}
    问题分类：{{var:ticket_category}}
    请提供相关信息和建议。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/handle_general.md。
  depends_on:
  - classify_ticket
- step: ticket_summary
  agent: summarizer
  input: |
    生成工单处理摘要并保存到 {{var:output_dir}}/ticket_summary.txt：
    用户问题：{{var:user_message}}
    分类结果：{{var:ticket_category}}
    技术处理：{{steps.handle_technical.output}}
    计费处理：{{steps.handle_billing.output}}
    一般处理：{{steps.handle_general.output}}
  depends_on:
  - handle_technical
  - handle_billing
  - handle_general
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
