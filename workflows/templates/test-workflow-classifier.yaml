---
name: test-workflow-classifier
version: 1.0.0
tags:
- test
- smart-classification-routing
- smart-routing
- classifier
- condition
description: |
  Smart classification routing feature test - tests the Classifier step's classification and conditional branching
  Covers: agent, input, categories (name + description), output_variable,
  default_category, working together with condition branching
variables:
  user_message: I cannot log in to my account; it says the password is wrong, but I am sure the password is correct
  output_dir: "./output"
  ticket_category: ''
  demo_mode: 'true'
agents:
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a classification expert. Classify inputs accurately into the provided categories. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  tech_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a technical support specialist. Handle technical issues. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  billing_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a billing specialist. Handle billing and payment issues. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  general_handler:
    preset: universal
    overrides:
      system_prompt: |-
        You are a general support agent. Handle general inquiries. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a report summarizer. Create summaries. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: classify_ticket
  classifier:
    agent: classifier_agent
    input: |-
      Classify the following user question:
      {{var:user_message}}

      Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/classify_ticket.md。
    categories:
    - name: technical
      description: Technical issues, including account login, system errors, feature failures, and configuration problems
    - name: billing
      description: Billing issues, including bill inquiries, payment failures, refund requests, and plan changes
    - name: general
      description: General inquiries, including product feature questions, usage guides, and feedback
    output_variable: ticket_category
    default_category: general
- step: handle_technical
  agent: tech_handler
  condition: ticket_category == 'technical'
  input: |-
    Handle the following technical issue and produce a solution:
    User question: {{var:user_message}}
    Ticket category: {{var:ticket_category}}
    Output detailed troubleshooting steps and a solution.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/handle_technical.md。
  depends_on:
  - classify_ticket
- step: handle_billing
  agent: billing_handler
  condition: ticket_category == 'billing'
  input: |-
    Handle the following billing issue:
    User question: {{var:user_message}}
    Ticket category: {{var:ticket_category}}
    Output the handling plan and the follow-up steps.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/handle_billing.md。
  depends_on:
  - classify_ticket
- step: handle_general
  agent: general_handler
  condition: ticket_category == 'general'
  input: |-
    Handle the following general inquiry:
    User question: {{var:user_message}}
    Ticket category: {{var:ticket_category}}
    Please provide relevant information and suggestions.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/handle_general.md。
  depends_on:
  - classify_ticket
- step: ticket_summary
  agent: summarizer
  input: |
    Generate a ticket-handling summary and save it to {{var:output_dir}}/ticket_summary.txt:
    User question: {{var:user_message}}
    Classification result: {{var:ticket_category}}
    Technical handling: {{steps.handle_technical.output}}
    Billing handling: {{steps.handle_billing.output}}
    General handling: {{steps.handle_general.output}}
  depends_on:
  - handle_technical
  - handle_billing
  - handle_general
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
