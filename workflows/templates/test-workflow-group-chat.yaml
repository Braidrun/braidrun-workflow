variables:
  topic: Optimizing the new-user registration flow
  output_dir: "./output"
  demo_mode: 'true'
agents:
  pm:
    preset: universal
    overrides:
      system_prompt: |-
        You are a product manager. Provide product requirements and user stories. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  designer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a UI/UX designer. Propose design solutions and user experience improvements. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  engineer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a software engineer. Evaluate technical feasibility and propose implementation plans. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  qa:
    preset: universal
    overrides:
      system_prompt: |-
        You are a QA engineer. Identify potential issues and suggest test strategies. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: feature_discussion
  group_chat:
    participants:
    - pm
    - designer
    - engineer
    moderator: pm
    max_rounds: 3
    speaker_selection: round_robin
    termination_keyword: CONSENSUS_REACHED
    initial_message: |-
      Today's discussion topic is: {{var:topic}}
      Each participant, please analyze and give suggestions from your own role's perspective.
      When consensus is reached, output CONSENSUS_REACHED.

      At the end of the discussion, give a reusable summary of the conclusion so later steps can save it directly as a demo deliverable.
    summary_agent: pm
- step: technical_brainstorm
  group_chat:
    participants:
    - engineer
    - designer
    - qa
    max_rounds: 4
    speaker_selection: random
    termination_keyword: DISCUSSION_COMPLETE
    initial_message: |-
      Based on the earlier discussion: {{steps.feature_discussion.output}}
      Brainstorm from a technical perspective and explore implementation approaches.
      At the end of the discussion, output DISCUSSION_COMPLETE.

      At the end of the discussion, give a reusable summary of the conclusion so later steps can save it directly as a demo deliverable.
  depends_on:
  - feature_discussion
- step: final_review
  group_chat:
    participants:
    - pm
    - qa
    max_rounds: 2
    initial_message: |-
      Perform a final review of the following technical solution:
      {{steps.technical_brainstorm.output}}

      At the end of the discussion, give a reusable summary of the conclusion so later steps can save it directly as a demo deliverable.
  depends_on:
  - technical_brainstorm
- step: write_summary
  agent: pm
  input: |
    Based on the following discussion, generate a final summary report and save it to {{var:output_dir}}/discussion_summary.txt:
    Discussion result: {{steps.feature_discussion.output}}
    Technical solution: {{steps.technical_brainstorm.output}}
    Review comments: {{steps.final_review.output}}
  depends_on:
  - final_review
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
