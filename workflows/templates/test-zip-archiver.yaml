---
name: test-zip-archiver
version: 1.0.0
description: |
  Test harness for utility-module-zip-archiver.

  Creates 3 fixture files, packs them into a zip via mode=create,
  then extracts the zip via mode=extract and asserts round-trip fidelity.

tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: setup_fixtures
    code:
      language: python
      timeout: 10
      script: |
        import tempfile
        from pathlib import Path

        base = Path(tempfile.mkdtemp(prefix="zip_test_"))
        src_dir = base / "src"
        src_dir.mkdir()
        (src_dir / "hello.txt").write_text("hello\n", encoding="utf-8")
        (src_dir / "world.txt").write_text("world\n", encoding="utf-8")
        (src_dir / "nested.json").write_text('{"k":"v"}', encoding="utf-8")

        zip_path = base / "out.zip"
        extract_dir = base / "extracted"

        print(f"src_dir={src_dir}")
        print(f"zip_path={zip_path}")
        print(f"extract_dir={extract_dir}")
    extract:
      - pattern: 'src_dir=(.+)'
        variable: src_dir
      - pattern: 'zip_path=(.+)'
        variable: zip_path
      - pattern: 'extract_dir=(.+)'
        variable: extract_dir
    priority: 20

  - step: create_zip
    sub_workflow:
      name: utility-module-zip-archiver
      inputs:
        mode: create
        source_paths: "{{var:src_dir}}"
        zip_path: "{{var:zip_path}}"
      outputs:
        created_archive: archive_path
        created_file_count: file_count
        created_total_bytes: total_bytes
        created_status: operation_status
    depends_on:
      - setup_fixtures
    priority: 15

  - step: extract_zip
    sub_workflow:
      name: utility-module-zip-archiver
      inputs:
        mode: extract
        zip_path: "{{var:zip_path}}"
        extract_to: "{{var:extract_dir}}"
      outputs:
        extracted_dir: extract_dir
        extracted_file_count: file_count
        extracted_status: operation_status
    depends_on:
      - create_zip
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys
        from pathlib import Path

        problems = []

        c_status = os.environ.get("WF_VAR_CREATED_STATUS", "").strip()
        c_count_raw = os.environ.get("WF_VAR_CREATED_FILE_COUNT", "").strip()
        c_archive = os.environ.get("WF_VAR_CREATED_ARCHIVE", "").strip()
        if c_status != "created":
            problems.append(f"create status != 'created': '{c_status}'")
        try:
            c_count = int(c_count_raw)
        except ValueError:
            c_count = -1
            problems.append(f"create file_count not int: '{c_count_raw}'")
        if c_count != 3:
            problems.append(f"create file_count expected 3, got {c_count}")
        if c_archive and not Path(c_archive).exists():
            problems.append(f"archive_path does not exist: {c_archive}")

        e_status = os.environ.get("WF_VAR_EXTRACTED_STATUS", "").strip()
        e_dir = os.environ.get("WF_VAR_EXTRACTED_DIR", "").strip()
        e_count_raw = os.environ.get("WF_VAR_EXTRACTED_FILE_COUNT", "").strip()
        if e_status != "extracted":
            problems.append(f"extract status != 'extracted': '{e_status}'")
        try:
            e_count = int(e_count_raw)
        except ValueError:
            e_count = -1
            problems.append(f"extract file_count not int: '{e_count_raw}'")
        if e_count != 3:
            problems.append(f"extract file_count expected 3, got {e_count}")

        if e_dir:
            # Check all 3 fixture files round-tripped
            files = list(Path(e_dir).rglob("*.txt")) + list(Path(e_dir).rglob("*.json"))
            names = sorted(f.name for f in files)
            if names != ["hello.txt", "nested.json", "world.txt"]:
                problems.append(f"extracted file names wrong: {names}")
            hello = next((f for f in files if f.name == "hello.txt"), None)
            if hello and hello.read_text(encoding="utf-8") != "hello\n":
                problems.append(f"hello.txt content corrupted: {hello.read_text()!r}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - extract_zip
    priority: 5
