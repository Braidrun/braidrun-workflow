---
name: test-translator
version: 1.0.0
description: |
  Test harness for utility-module-translator (LLM-driven, needs OpenRouter key).

  Translates a short Chinese sentence to English, asserts:
  - status is ok
  - translated_text is non-empty and length-sane
  - detected_source_language is reasonable (zh / chinese / auto)
  - translated_path points to an existing file

  Requires: OPENROUTER_API_KEY env var set.

tags:
  - code
  - extract
  - sub_workflow

variables:
  source: "定月 AI Agent 平台是一个多层系统，专注于订阅管理和 Apple Search Ads 优化。"

agents: {}

workflow:
  - step: translate
    sub_workflow:
      name: utility-module-translator
      inputs:
        input_text: "{{var:source}}"
        target_language: "en"
        style: natural
        source_language: "auto"
      outputs:
        tx_text: translated_text
        tx_path: translated_path
        tx_detected: detected_source_language
        tx_status: translate_status
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys
        from pathlib import Path

        tx_status = os.environ.get("WF_VAR_TX_STATUS", "").strip()
        tx_text = os.environ.get("WF_VAR_TX_TEXT", "").strip()
        tx_path = os.environ.get("WF_VAR_TX_PATH", "").strip()
        tx_detected = os.environ.get("WF_VAR_TX_DETECTED", "").strip().lower()

        problems = []

        if tx_status != "ok":
            problems.append(f"translate_status != 'ok', got '{tx_status}'")

        # Expect some English output; at least 10 chars, not over 500.
        if len(tx_text) < 10:
            problems.append(f"translated_text too short ({len(tx_text)} chars): {tx_text!r}")
        if len(tx_text) > 500:
            problems.append(f"translated_text suspiciously long ({len(tx_text)} chars)")

        # detected source should reference Chinese in some form.
        if tx_detected and not any(t in tx_detected for t in ["zh", "chi", "chinese"]):
            # Be lenient: some models say "unknown" for short text.
            # Only complain if the value is something clearly wrong.
            if tx_detected not in {"", "unknown", "auto"}:
                problems.append(f"detected_source_language suspicious: '{tx_detected}'")

        if tx_path and not Path(tx_path).exists():
            problems.append(f"translated_path missing on disk: {tx_path}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print(f"TEST_STATUS=pass")
            print(f"translation_preview={tx_text[:120]}")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
      - pattern: 'translation_preview=(.*)'
        variable: translation_preview
    depends_on:
      - translate
    priority: 5
