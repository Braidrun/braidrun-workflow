---
name: test-dingyue-asa-campaign-fetcher
version: 1.0.0
description: Test ASA campaign fetcher — chain ASA discover → pick first app → fetch campaigns.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: discover
    sub_workflow:
      name: dingyue-module-asa-app-discover
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", limit: "5"}
      outputs: {apps: apps_json}
    priority: 20
  - step: pick
    code:
      language: python
      timeout: 5
      script: |
        import json, os
        apps = json.loads(os.environ.get("WF_VAR_APPS", "[]"))
        if not apps: raise RuntimeError("no ASA apps discovered")
        print(f"asa_app_id={apps[0]['app_id']}")
    extract: [{pattern: 'asa_app_id=(.+)', variable: asa_app_id}]
    depends_on: [discover]
    priority: 15
  - step: fetch
    sub_workflow:
      name: dingyue-module-asa-campaign-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", app_id: "{{var:asa_app_id}}"}
      outputs:
        status: fetch_status
        cnt: campaign_count
        running: running_count
        budget: total_daily_budget_usd
    depends_on: [pick]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        cnt = os.environ.get("WF_VAR_CNT", "")
        if not cnt.isdigit(): problems.append(f"cnt not numeric: {cnt}")
        try: float(os.environ.get("WF_VAR_BUDGET", "0"))
        except ValueError: problems.append("budget not float")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (campaigns={cnt}, running={os.environ.get('WF_VAR_RUNNING','?')}, budget=${os.environ.get('WF_VAR_BUDGET','0')})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch]
    priority: 5
