---
name: test-workflow-with-api-keys
version: 2.0.0
tags:
- test
- api-key
description: |
  Test workflow - uses inline agent definitions plus API-key configuration
  Demonstrates how to configure a different LLM provider and API key for each agent in a workflow
variables:
  topic: Applications and benefits of AI in software development
  output_dir: "./output"
  demo_mode: 'true'
agents:
  writer:
    preset: writer
    overrides:
      system_prompt: |-
        You are a professional content-writing agent. Generate high-quality article content for the given topic.
        Write in a clear, engaging style with a complete structure.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
  reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a content-reviewing agent. Analyze content quality, check grammar, and provide improvement suggestions.
        The review should be thorough and objective, with specific, actionable feedback.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
  editor:
    preset: writer
    overrides:
      system_prompt: |-
        You are a content-editing agent. Improve the article based on the review feedback.
        Ensure the final version is high quality, logically coherent, and precisely worded.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
workflow:
- step: generate_content
  agent: writer
  input: |
    Write an article about "{{topic}}" (200-300 words).
    Save it to {{output_dir}}/draft_article.txt

    Requirements:
    1. If the output directory does not exist, create it first
    2. Content is clear and engaging
    3. Call exit when finished
  priority: 10
- step: review_content
  agent: reviewer
  depends_on:
  - generate_content
  input: |
    Review the article in {{output_dir}}/draft_article.txt.

    Please provide feedback along the following dimensions:
    1. Content quality and clarity
    2. Grammar and style
    3. Structure and logic
    4. Improvement suggestions

    Save the review results to {{output_dir}}/review_feedback.txt
    Call exit when finished
  priority: 9
- step: revise_content
  agent: editor
  depends_on:
  - review_content
  input: |
    Read the draft in {{output_dir}}/draft_article.txt and the review feedback in {{output_dir}}/review_feedback.txt.

    Create an improved version:
    1. Address every feedback point
    2. Improve clarity and readability
    3. Save the final version to {{output_dir}}/final_article.txt
    4. Describe the changes made in {{output_dir}}/summary.txt

    Call exit when finished
  priority: 8
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1800s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
