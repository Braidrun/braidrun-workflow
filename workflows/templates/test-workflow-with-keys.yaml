---
name: test-workflow-with-api-keys
version: 2.0.0
tags:
- test
- api-key
description: |
  Test workflow - uses inline agent definitions plus API-key configuration
  Demonstrates how to configure a different LLM provider and API key for each agent in a workflow
translations:
  en:
    name: "Workflow with API Keys Test"
    description: "Test workflow - uses inline agent definitions plus API-key configuration Demonstrates how to configure a different LLM provider and API key for each agent in a workflow"
  zh:
    name: "带 API 密钥的工作流测试"
    description: "测试工作流 - 使用内联 agent 定义和 API-key 配置。演示如何为工作流中的每个 agent 配置不同的 LLM 提供方和 API key"
  zhHant:
    name: "含 API 金鑰的工作流程測試"
    description: "測試工作流程 - 使用內嵌 agent 定義與 API-key 設定。示範如何為工作流程中的每個 agent 設定不同的 LLM 提供者和 API key"
  ja:
    name: "APIキー付きワークフローテスト"
    description: "テスト用ワークフロー - インラインの agent 定義と API-key 設定を使用。ワークフロー内の各 agent ごとに異なる LLM プロバイダーと API key を設定する方法を示します"
  ko:
    name: "API 키가 있는 워크플로 테스트"
    description: "테스트 워크플로 - 인라인 agent 정의와 API-key 구성을 사용합니다. 워크플로의 각 agent에 서로 다른 LLM 제공자와 API key를 구성하는 방법을 보여줍니다"
  es:
    name: "Prueba de flujo de trabajo con API keys"
    description: "Flujo de trabajo de prueba: usa definiciones de agent en línea y configuración de API-key. Demuestra cómo configurar un proveedor de LLM y una API key distintos para cada agent en un flujo de trabajo"
  fr:
    name: "Test de flux de travail avec clés API"
    description: "Flux de travail de test - utilise des définitions d’agent intégrées et une configuration de API-key. Montre comment configurer un fournisseur de LLM et une API key différents pour chaque agent dans un flux de travail"
  de:
    name: "Workflow mit API-Keys Test"
    description: "Test-Workflow - verwendet Inline-Agent-Definitionen plus API-key-Konfiguration. Zeigt, wie für jeden Agent in einem Workflow ein anderer LLM-Anbieter und ein anderer API key konfiguriert werden kann"
  ar:
    name: "اختبار سير عمل بمفاتيح API"
    description: "سير عمل للاختبار - يستخدم تعريفات agent مضمّنة مع إعداد API-key. يوضح كيفية تهيئة مزود LLM ومفتاح API مختلفين لكل agent في سير العمل"
  pt:
    name: "Teste de fluxo de trabalho com chaves API"
    description: "Fluxo de trabalho de teste - usa definições inline de agent e configuração de API-key. Demonstra como configurar um provedor de LLM e uma API key diferentes para cada agent em um fluxo de trabalho"
  vi:
    name: "Kiểm thử quy trình làm việc với API keys"
    description: "Quy trình làm việc kiểm thử - dùng các định nghĩa agent nội tuyến cùng cấu hình API-key. Minh họa cách cấu hình nhà cung cấp LLM và API key khác nhau cho từng agent trong một quy trình làm việc"
variables:
  topic: Applications and benefits of AI in software development
  output_dir: "./output"
  demo_mode: 'true'
agents:
  writer:
    preset: writer
    overrides:
      system_prompt: |-
        You are a professional content-writing agent. Generate high-quality article content for the given topic.
        Write in a clear, engaging style with a complete structure.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
  reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a content-reviewing agent. Analyze content quality, check grammar, and provide improvement suggestions.
        The review should be thorough and objective, with specific, actionable feedback.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
  editor:
    preset: writer
    overrides:
      system_prompt: |-
        You are a content-editing agent. Improve the article based on the review feedback.
        Ensure the final version is high quality, logically coherent, and precisely worded.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      session_id_strategy: auto
workflow:
- step: generate_content
  agent: writer
  input: |
    Write an article about "{{topic}}" (200-300 words).
    Save it to {{output_dir}}/draft_article.txt

    Requirements:
    1. If the output directory does not exist, create it first
    2. Content is clear and engaging
    3. Call exit when finished
  priority: 10
- step: review_content
  agent: reviewer
  depends_on:
  - generate_content
  input: |
    Review the article in {{output_dir}}/draft_article.txt.

    Please provide feedback along the following dimensions:
    1. Content quality and clarity
    2. Grammar and style
    3. Structure and logic
    4. Improvement suggestions

    Save the review results to {{output_dir}}/review_feedback.txt
    Call exit when finished
  priority: 9
- step: revise_content
  agent: editor
  depends_on:
  - review_content
  input: |
    Read the draft in {{output_dir}}/draft_article.txt and the review feedback in {{output_dir}}/review_feedback.txt.

    Create an improved version:
    1. Address every feedback point
    2. Improve clarity and readability
    3. Save the final version to {{output_dir}}/final_article.txt
    4. Describe the changes made in {{output_dir}}/summary.txt

    Call exit when finished
  priority: 8
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1800s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
