---
name: test-dingyue-usd-exchange-rate
version: 1.0.0
description: Test dingyue-module-usd-exchange-rate for CNY.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: fetch
    sub_workflow:
      name: dingyue-module-usd-exchange-rate
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", local_currency: "CNY"}
      outputs:
        status: fetch_status
        rate: rate
        base: base_currency
        local: local_currency
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append(f"status={os.environ.get('WF_VAR_STATUS')}")
        rate = float(os.environ.get("WF_VAR_RATE", "0") or "0")
        if rate < 0.1 or rate > 100: problems.append(f"USD→CNY rate unreasonable: {rate}")
        if os.environ.get("WF_VAR_BASE") != "USD": problems.append(f"base={os.environ.get('WF_VAR_BASE')}")
        if os.environ.get("WF_VAR_LOCAL", "").upper() != "CNY": problems.append(f"local={os.environ.get('WF_VAR_LOCAL')}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (1 USD = {rate} CNY)")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch]
    priority: 5
