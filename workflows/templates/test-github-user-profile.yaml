---
name: test-github-user-profile
version: 1.0.0
description: Test github-user-profile for octocat.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-github-user-profile
      inputs: {username: "octocat", max_repos: "3"}
      outputs:
        p: profile_json
        repos: repos_json
        followers: followers
        status: profile_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        p = json.loads(os.environ.get("WF_VAR_P", "{}"))
        if p.get("login") != "octocat": problems.append(f"login={p.get('login')}")
        if int(os.environ.get("WF_VAR_FOLLOWERS", "0") or "0") < 100: problems.append("too few followers")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
