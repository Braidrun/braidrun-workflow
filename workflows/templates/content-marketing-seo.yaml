---
name: content-marketing-seo
version: 3.0.0
tags:
- SEO
- 内容营销
- 搜索优化
- 多角色协作
- 迭代优化
- group_chat
- repeat_until
- extract
- condition
category: content
description: |
  内容营销与 SEO 优化工作流。
  从关键词调研到内容分发的完整 SEO 内容生产流水线：关键词调研 → SEO 策略制定 → 内容创作 → SEO 审核迭代 → 多渠道发布与分发。
  适用场景：企业博客 SEO 优化、内容营销获客、Topic Cluster 策略落地、长尾关键词内容矩阵建设。
  特性：extract 结构化指标提取、group_chat SEO 策略讨论、repeat_until SEO 质量迭代
variables:
  website_url: https://example.com
  business_type: SaaS 产品 / AI 工具
  target_keywords: AI 写作工具, AI 内容生成, 自动化营销
  target_audience: 中小企业主、营销人员、内容创作者
  content_type: 长文博客 (2000-3000 字)
  language: 中文
  quality_threshold: '8'
  output_dir: "./output/content-marketing-seo"
  demo_mode: 'true'
variable_tags:
  business_type: '业务参数'
  content_type: '业务参数'
  demo_mode: '运行模式'
  language: '业务参数'
  output_dir: '输出'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
  target_keywords: '业务参数'
  website_url: '业务参数'
agents:
  seo_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位资深 SEO 分析师，精通搜索引擎优化策略。
        你擅长关键词研究、竞品 SEO 分析、搜索意图分析和技术 SEO 审计。
        你用数据说话，每个建议都有搜索量和竞争度数据支撑。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  content_strategist:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位内容策略师，精通内容营销和搜索引擎优化的结合。
        你擅长设计内容矩阵、主题集群 (Topic Cluster) 和内链策略。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  seo_writer:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位 SEO 内容撰写专家，擅长撰写既对搜索引擎友好又对读者有价值的内容。
        你精通标题优化、meta 描述撰写、关键词自然融入和结构化内容编排。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位 SEO 内容质量评审专家。对 SEO 内容进行综合评分。
        评分维度：关键词覆盖(25%)、内容质量(25%)、技术 SEO(25%)、用户体验(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: keyword-research
  agent: seo_analyst
  input: |
    为「{{var:website_url}}」进行 SEO 关键词调研：
    业务类型：{{var:business_type}}
    目标关键词：{{var:target_keywords}}
    目标受众：{{var:target_audience}}

    1. 核心关键词分析：搜索量、竞争度、搜索意图分类。
    2. 长尾关键词拓展（至少 20 个）。
    3. 竞品 SEO 分析：Top 5 竞品的排名关键词和内容策略。
    4. 内容缺口分析：竞品覆盖但我们未覆盖的关键词。
    5. 关键词分组：按搜索意图（信息型/导航型/交易型）分组。
    输出必须包含以下格式化指标：
    - keyword_count=N（关键词数量）
    - search_volume=N（搜索量）
    输出到：keyword-research.md
  extract:
  - pattern: keyword_count=(\d+)
    variable: keyword_count
  - pattern: search_volume=(\d+)
    variable: search_volume
  priority: 10
- step: seo-strategy-meeting
  group_chat:
    participants:
    - seo_analyst
    - content_strategist
    - seo_writer
    initial_message: |-
      SEO 内容策略会议。请审查关键词调研：
      {{steps.keyword-research.output}}

      讨论重点：
      1. 优先攻占哪些关键词？（搜索量 vs 竞争度的平衡）
      2. 内容形式选择：{{var:content_type}} 是否最合适？
      3. 主题集群设计：支柱页 (Pillar Page) 和子主题文章如何组织？
      4. 内链策略如何设计？
      5. 短期（1-3 月）和长期（6-12 月）的 SEO 目标
      讨论完毕后请说 STRATEGY_SET

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: STRATEGY_SET
  depends_on:
  - keyword-research
  priority: 9
- step: content-creation
  agent: seo_writer
  input: |
    基于 SEO 策略共识创作内容：

    关键词调研：{{steps.keyword-research.output}}
    策略共识：{{steps.seo-strategy-meeting.output}}

    创作要求：
    1. SEO 标题（含核心关键词，60 字符以内）。
    2. Meta 描述（含关键词，155 字符以内，有 CTA）。
    3. 正文（{{var:content_type}}），需包含：
       - H2/H3 标题层次（自然融入关键词）
       - 开头段落包含核心关键词
       - 每 300 字至少一个小标题
       - 内链建议位置标注
       - FAQ 结构化数据段落（至少 5 个问答）
    4. 图片 Alt 标签建议。
    5. 相关文章推荐列表。
    输出到：seo-content.md
  depends_on:
  - seo-strategy-meeting
  priority: 8
- step: seo-review
  agent: seo_analyst
  input: |
    对 SEO 内容进行技术审核和优化：

    内容：{{steps.content-creation.output}}
    关键词目标：{{steps.keyword-research.output}}
    上次评估反馈（如有）：{{steps.seo-review:evaluate.output}}

    审核清单：
    1. 关键词密度是否在 1-3% 的合理范围？
    2. 标题标签 (H1/H2/H3) 是否包含目标关键词？
    3. Meta 描述是否有吸引力？
    4. 内链和外链是否合理？
    5. 可读性评分（Flesch-Kincaid 或中文等价指标）。
    6. 结构化数据 (Schema) 建议。
    7. 修改后输出到：seo-content-optimized.md
  depends_on:
  - content-creation
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下 SEO 内容的质量。
      评分维度：关键词覆盖(25%)、内容质量(25%)、技术 SEO(25%)、用户体验(25%)。
      输出格式：quality_score=N（1-10 分）

      SEO 内容：
      {{steps.seo-review.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: distribution-plan
  agent: content_strategist
  input: |
    为 SEO 内容（质量评分 {{var:quality_score}}）制定发布和分发策略：

    终稿：{{steps.seo-review.output}}

    1. 发布前检查清单（URL 结构、面包屑导航、内链设置）。
    2. 社交媒体分发（LinkedIn、Twitter、知乎、公众号的改写版本）。
    3. 邮件营销版本（摘要 + 链接引流）。
    4. 反向链接获取策略（Guest Post、资源页外链）。
    5. 内容更新日历（定期更新计划）。
    6. 关键指标追踪：排名、流量、点击率、跳出率。
    输出到：distribution-plan.md
  depends_on:
  - seo-review
  priority: 4
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
