---
name: test-workflow-fan-out
version: 1.0.0
tags:
- test
- fan-out
description: Fan-out/fan-in test - one initial step fans out to several parallel branches that finally converge in a summary step
translations:
  en:
    name: "Fan Out Fan In Test"
    description: "Fan-out/fan-in test - one initial step fans out to several parallel branches that finally converge in a summary step"
  zh:
    name: "分支汇聚测试"
    description: "分支汇聚测试——一个初始步骤分支为多个并行分支，最后在汇总步骤中汇聚。"
  zhHant:
    name: "分支匯聚測試"
    description: "分支匯聚測試——一個初始步驟分支為多個並行分支，最後在彙總步驟中匯聚。"
  ja:
    name: "ファンアウト・ファンインテスト"
    description: "ファンアウト・ファンインテスト - 1つの初期ステップが複数の並列ブランチに分岐し、最後にサマリーステップで収束します。"
  ko:
    name: "팬아웃 팬인 테스트"
    description: "팬아웃/팬인 테스트 - 하나의 초기 단계가 여러 병렬 분기로 분기한 뒤 마지막에 요약 단계에서 수렴합니다."
  es:
    name: "Prueba de expansión y convergencia"
    description: "Prueba de expansión y convergencia: un paso inicial se expande en varias ramas paralelas que finalmente convergen en un paso de resumen."
  fr:
    name: "Test de fan-out et fan-in"
    description: "Test de fan-out/fan-in - une étape initiale se déploie en plusieurs branches parallèles qui convergent finalement vers une étape de résumé."
  de:
    name: "Fan-out Fan-in Test"
    description: "Fan-out/Fan-in-Test – ein erster Schritt verzweigt sich in mehrere parallele Branches, die am Ende in einem Zusammenfassungsschritt zusammenlaufen."
  ar:
    name: "اختبار التفرع والتجميع"
    description: "اختبار التفرع/التجميع - تتفرع خطوة أولية واحدة إلى عدة فروع متوازية تتلاقى أخيرًا في خطوة ملخص."
  pt:
    name: "Teste de fan-out e fan-in"
    description: "Teste de fan-out/fan-in - uma etapa inicial se desdobra em vários ramos paralelos que convergem ao final em uma etapa de resumo."
  vi:
    name: "Kiểm thử fan-out fan-in"
    description: "Kiểm thử fan-out/fan-in - một bước ban đầu tỏa ra nhiều nhánh song song, rồi cuối cùng hội tụ ở bước tóm tắt."
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  coordinator:
    preset: universal
    description: "Handles task coordination responsibilities in this test workflow."
    translations:
      en:
        description: "Handles task coordination responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的任务协调职责。"
      zhHant:
        description: "負責此測試工作流程中的任務協調職責。"
      ja:
        description: "このテストワークフローでタスク調整を担当します。"
      ko:
        description: "이 테스트 워크플로에서 작업 조정 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de coordinación de tareas en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de coordination des tâches dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Aufgabenkoordination."
      ar:
        description: "يتولى مسؤوليات تنسيق المهام في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de coordenação de tarefas neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò điều phối tác vụ trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a coordinator agent. Manage tasks precisely and call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: prepare
  agent: coordinator
  priority: 10
  input: |-
    Create directory {{output_dir}} if it doesn't exist.
    Create a file {{output_dir}}/task_manifest.json with this content:
    {"task": "market_analysis", "branches": ["competitor", "customer", "technology"], "status": "started"}
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/prepare.md.
- step: branch_competitor
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing competitors.
    Create {{output_dir}}/competitor_report.txt with a brief competitor analysis (50-80 words).
    Include at least 3 competitor strengths.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_competitor.md.
- step: branch_customer
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing customer needs.
    Create {{output_dir}}/customer_report.txt with a brief customer analysis (50-80 words).
    Include at least 3 customer pain points.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_customer.md.
- step: branch_technology
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing technology trends.
    Create {{output_dir}}/technology_report.txt with a brief technology analysis (50-80 words).
    Include at least 3 emerging technologies.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_technology.md.
- step: aggregate
  agent: coordinator
  depends_on:
  - branch_competitor
  - branch_customer
  - branch_technology
  priority: 5
  input: |-
    Read all reports from {{output_dir}}:
    - competitor_report.txt
    - customer_report.txt
    - technology_report.txt

    Create {{output_dir}}/combined_analysis.txt that synthesizes all three reports
    into a unified market analysis summary (100-150 words).
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/aggregate.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
