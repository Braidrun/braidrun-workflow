---
name: test-workflow-fan-out
version: 1.0.0
tags:
- test
- fan-out
description: Fan-out/fan-in test - one initial step fans out to several parallel branches that finally converge in a summary step
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  coordinator:
    preset: universal
    overrides:
      system_prompt: |-
        You are a coordinator agent. Manage tasks precisely and call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: prepare
  agent: coordinator
  priority: 10
  input: |-
    Create directory {{output_dir}} if it doesn't exist.
    Create a file {{output_dir}}/task_manifest.json with this content:
    {"task": "market_analysis", "branches": ["competitor", "customer", "technology"], "status": "started"}
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/prepare.md。
- step: branch_competitor
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing competitors.
    Create {{output_dir}}/competitor_report.txt with a brief competitor analysis (50-80 words).
    Include at least 3 competitor strengths.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_competitor.md。
- step: branch_customer
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing customer needs.
    Create {{output_dir}}/customer_report.txt with a brief customer analysis (50-80 words).
    Include at least 3 customer pain points.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_customer.md。
- step: branch_technology
  agent: coordinator
  depends_on:
  - prepare
  priority: 8
  input: |-
    You are analyzing technology trends.
    Create {{output_dir}}/technology_report.txt with a brief technology analysis (50-80 words).
    Include at least 3 emerging technologies.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/branch_technology.md。
- step: aggregate
  agent: coordinator
  depends_on:
  - branch_competitor
  - branch_customer
  - branch_technology
  priority: 5
  input: |-
    Read all reports from {{output_dir}}:
    - competitor_report.txt
    - customer_report.txt
    - technology_report.txt

    Create {{output_dir}}/combined_analysis.txt that synthesizes all three reports
    into a unified market analysis summary (100-150 words).
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/aggregate.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
