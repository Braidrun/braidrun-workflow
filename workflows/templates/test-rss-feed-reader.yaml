---
name: test-rss-feed-reader
version: 1.0.0
description: Test rss-feed-reader on NYT world RSS (stable).
translations:
  en:
    name: "RSS Feed Reader Test"
    description: "Test rss-feed-reader on NYT world RSS (stable)."
  zh:
    name: "RSS Feed Reader 测试"
    description: "在 NYT world RSS（稳定版）上测试 rss-feed-reader。"
  zhHant:
    name: "RSS Feed Reader 測試"
    description: "在 NYT world RSS（穩定版）上測試 rss-feed-reader。"
  ja:
    name: "RSS フィードリーダーテスト"
    description: "NYT world RSS（stable）で rss-feed-reader をテストします。"
  ko:
    name: "RSS 피드 리더 테스트"
    description: "NYT world RSS(stable)에서 rss-feed-reader를 테스트합니다."
  es:
    name: "Prueba de lector de RSS"
    description: "Prueba de rss-feed-reader en NYT world RSS (stable)."
  fr:
    name: "Test du lecteur RSS"
    description: "Test de rss-feed-reader sur NYT world RSS (stable)."
  de:
    name: "RSS-Feed-Reader-Test"
    description: "Test von rss-feed-reader mit NYT world RSS (stable)."
  ar:
    name: "اختبار قارئ RSS"
    description: "اختبار rss-feed-reader على NYT world RSS (stable)."
  pt:
    name: "Teste de leitor de RSS"
    description: "Teste de rss-feed-reader no NYT world RSS (stable)."
  vi:
    name: "Kiểm thử trình đọc RSS"
    description: "Kiểm thử rss-feed-reader trên NYT world RSS (stable)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-rss-feed-reader
      inputs:
        feed_url: "https://feeds.bbci.co.uk/news/world/rss.xml"
        max_items: "5"
      outputs:
        items: items_json
        cnt: item_count
        title: feed_title
        status: feed_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        cnt = int(os.environ.get("WF_VAR_CNT", "0") or "0")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if cnt < 1: print(f"TEST_STATUS=fail\n  - no items"); sys.exit(1)
        items = json.loads(os.environ.get("WF_VAR_ITEMS", "[]"))
        if not items[0].get("title"): print("TEST_STATUS=fail\n  - first item lacks title"); sys.exit(1)
        if not items[0].get("link"): print("TEST_STATUS=fail\n  - first item lacks link"); sys.exit(1)
        print(f"TEST_STATUS=pass (got {cnt} items)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
