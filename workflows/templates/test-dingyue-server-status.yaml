---
name: test-dingyue-server-status
version: 1.0.0
description: Test dingyue-module-server-status with real creds.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: check
    sub_workflow:
      name: dingyue-module-server-status
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps"}
      outputs:
        status: fetch_status
        healthy: is_healthy
        srv: server_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append(f"status={os.environ.get('WF_VAR_STATUS')}")
        healthy = os.environ.get("WF_VAR_HEALTHY", "").strip().lower()
        # Braidrun 后端是否 healthy 取决于此刻实际状态；只验证返回了 true/false
        if healthy not in ("true", "false"): problems.append(f"healthy not boolean: {healthy}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (healthy={healthy}, raw={os.environ.get('WF_VAR_SRV','?')[:60]})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [check]
    priority: 5
