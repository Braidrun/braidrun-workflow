---
name: test-image-metadata-extractor
version: 1.0.0
description: Test image-metadata-extractor — generate a small JPEG and verify width/height.
translations:
  en:
    name: "Image Metadata Extractor Test"
    description: "Test image-metadata-extractor — generate a small JPEG and verify width/height."
  zh:
    name: "图像元数据提取器测试"
    description: "测试 image-metadata-extractor — 生成一个小型 JPEG 并验证宽度/高度。"
  zhHant:
    name: "圖像元數據提取器測試"
    description: "測試 image-metadata-extractor — 生成一個小型 JPEG 並驗證寬度/高度。"
  ja:
    name: "画像メタデータ抽出テスト"
    description: "image-metadata-extractor のテスト — 小さな JPEG を生成し、幅/高さを検証します。"
  ko:
    name: "이미지 메타데이터 추출기 테스트"
    description: "image-metadata-extractor 테스트 — 작은 JPEG를 생성하고 width/height를 검증합니다."
  es:
    name: "Test de extractor de metadatos de imagen"
    description: "Prueba de image-metadata-extractor — genera un JPEG pequeño y verifica width/height."
  fr:
    name: "Test d’extracteur de métadonnées d’image"
    description: "Test de image-metadata-extractor — génère un petit JPEG et vérifie width/height."
  de:
    name: "Bildmetadaten-Extraktor-Test"
    description: "Test für image-metadata-extractor — erzeugt ein kleines JPEG und prüft width/height."
  ar:
    name: "اختبار مستخرج بيانات صورة"
    description: "اختبار image-metadata-extractor — ينشئ JPEG صغيرًا ويتحقق من width/height."
  pt:
    name: "Teste de extrator de metadados de imagem"
    description: "Teste de image-metadata-extractor — gera um JPEG pequeno e verifica width/height."
  vi:
    name: "Kiểm thử bộ trích xuất siêu dữ liệu ảnh"
    description: "Kiểm thử image-metadata-extractor — tạo một JPEG nhỏ và xác minh width/height."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: setup
    code:
      language: python
      timeout: 60
      script: |
        import subprocess, sys, tempfile
        from pathlib import Path
        try:
          from PIL import Image
        except ImportError:
          subprocess.run([sys.executable, "-m", "pip", "install", "--quiet", "Pillow"], check=True)
          from PIL import Image
        p = Path(tempfile.mkdtemp()) / "demo.jpg"
        img = Image.new("RGB", (320, 240), color="red")
        img.save(p, "JPEG")
        print(f"img_path={p}")
    extract:
      - {pattern: 'img_path=(.+)', variable: img_path}
    priority: 20
  - step: extract
    sub_workflow:
      name: utility-module-image-metadata-extractor
      inputs: {image_path: "{{var:img_path}}"}
      outputs:
        w: width
        h: height
        fmt: format
        status: exif_status
    depends_on: [setup]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        if os.environ.get("WF_VAR_W") != "320": problems.append(f"w={os.environ.get('WF_VAR_W')}")
        if os.environ.get("WF_VAR_H") != "240": problems.append(f"h={os.environ.get('WF_VAR_H')}")
        if os.environ.get("WF_VAR_FMT") != "JPEG": problems.append(f"fmt={os.environ.get('WF_VAR_FMT')}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [extract]
    priority: 5
