---
name: test-date-formatter
version: 1.0.0
description: Test date-formatter — ISO → epoch → RFC roundtrip.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: to_epoch
    sub_workflow:
      name: utility-module-date-formatter
      inputs:
        input_value: "2026-04-21T12:00:00+00:00"
        input_format: iso
        target_timezone: UTC
        output_format: epoch_s
      outputs:
        ep_text: formatted
        ep_seconds: epoch_seconds
        ep_status: format_status
    priority: 10
  - step: to_iso
    sub_workflow:
      name: utility-module-date-formatter
      inputs:
        input_value: "1776000000"
        input_format: epoch_s
        target_timezone: UTC
        output_format: iso
      outputs:
        iso_text: formatted
        iso_status: format_status
    priority: 9
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        from datetime import datetime, timezone
        problems = []
        ep_text = os.environ.get("WF_VAR_EP_TEXT", "")
        expected_ep = int(datetime(2026, 4, 21, 12, 0, 0, tzinfo=timezone.utc).timestamp())
        if ep_text != str(expected_ep): problems.append(f"epoch expected {expected_ep}, got {ep_text}")
        iso_text = os.environ.get("WF_VAR_ISO_TEXT", "")
        expected_iso = datetime.fromtimestamp(1776000000, tz=timezone.utc).isoformat()
        if iso_text != expected_iso: problems.append(f"iso expected {expected_iso}, got {iso_text}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [to_epoch, to_iso]
    priority: 5
