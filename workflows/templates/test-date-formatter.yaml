---
name: test-date-formatter
version: 1.0.0
description: Test date-formatter — ISO → epoch → RFC roundtrip.
translations:
  en:
    name: "Date Formatter Test"
    description: "Test date-formatter — ISO → epoch → RFC roundtrip."
  zh:
    name: "日期格式化测试"
    description: "测试 date-formatter：ISO → epoch → RFC 往返转换。"
  zhHant:
    name: "日期格式化測試"
    description: "測試 date-formatter：ISO → epoch → RFC 往返轉換。"
  ja:
    name: "日付フォーマッターテスト"
    description: "date-formatter の ISO → epoch → RFC の往復変換をテストします。"
  ko:
    name: "날짜 포맷터 테스트"
    description: "date-formatter의 ISO → epoch → RFC 왕복 변환을 테스트합니다."
  es:
    name: "Prueba de formateador de fechas"
    description: "Prueba de date-formatter: conversión de ida y vuelta ISO → epoch → RFC."
  fr:
    name: "Test de formateur de date"
    description: "Test de date-formatter : aller-retour ISO → epoch → RFC."
  de:
    name: "Datumsformatierungs-Test"
    description: "Test von date-formatter: ISO → epoch → RFC im Rundlauf."
  ar:
    name: "اختبار تنسيق التاريخ"
    description: "اختبار date-formatter: تحويل ذهابًا وإيابًا من ISO → epoch → RFC."
  pt:
    name: "Teste de formatador de data"
    description: "Teste de date-formatter: conversão de ida e volta ISO → epoch → RFC."
  vi:
    name: "Kiểm thử bộ định dạng ngày"
    description: "Kiểm thử date-formatter: chuyển đổi vòng lặp ISO → epoch → RFC."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: to_epoch
    sub_workflow:
      name: utility-module-date-formatter
      inputs:
        input_value: "2026-04-21T12:00:00+00:00"
        input_format: iso
        target_timezone: UTC
        output_format: epoch_s
      outputs:
        ep_text: formatted
        ep_seconds: epoch_seconds
        ep_status: format_status
    priority: 10
  - step: to_iso
    sub_workflow:
      name: utility-module-date-formatter
      inputs:
        input_value: "1776000000"
        input_format: epoch_s
        target_timezone: UTC
        output_format: iso
      outputs:
        iso_text: formatted
        iso_status: format_status
    priority: 9
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        from datetime import datetime, timezone
        problems = []
        ep_text = os.environ.get("WF_VAR_EP_TEXT", "")
        expected_ep = int(datetime(2026, 4, 21, 12, 0, 0, tzinfo=timezone.utc).timestamp())
        if ep_text != str(expected_ep): problems.append(f"epoch expected {expected_ep}, got {ep_text}")
        iso_text = os.environ.get("WF_VAR_ISO_TEXT", "")
        expected_iso = datetime.fromtimestamp(1776000000, tz=timezone.utc).isoformat()
        if iso_text != expected_iso: problems.append(f"iso expected {expected_iso}, got {iso_text}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [to_epoch, to_iso]
    priority: 5
