---
name: test-csv-processor
version: 1.0.0
description: |
  Test harness for utility-module-csv-processor.

  Writes a small CSV into a temp file, runs filter → sort → select → limit,
  then asserts the resulting row count and ordering.

translations:
  en:
    name: "CSV Processor Test"
    description: "Test harness for utility-module-csv-processor. Writes a small CSV into a temp file, runs filter → sort → select → limit, then asserts the resulting row count and ordering."
  zh:
    name: "CSV 处理器测试"
    description: "utility-module-csv-processor 的测试工具。将一个小型 CSV 写入临时文件，运行 filter → sort → select → limit，然后断言结果行数和排序。"
  zhHant:
    name: "CSV 處理器測試"
    description: "utility-module-csv-processor 的測試工具。將一個小型 CSV 寫入暫存檔，執行 filter → sort → select → limit，然後斷言結果列數和排序。"
  ja:
    name: "CSV プロセッサーテスト"
    description: "utility-module-csv-processor のテストハーネス。小さな CSV を一時ファイルに書き込み、filter → sort → select → limit を実行してから、結果の行数と並び順を検証します。"
  ko:
    name: "CSV 프로세서 테스트"
    description: "utility-module-csv-processor의 테스트 하니스입니다. 작은 CSV를 임시 파일에 쓰고 filter → sort → select → limit를 실행한 뒤, 결과 행 수와 정렬을 검증합니다."
  es:
    name: "Prueba del procesador CSV"
    description: "Banco de pruebas para utility-module-csv-processor. Escribe un CSV pequeño en un archivo temporal, ejecuta filter → sort → select → limit y luego verifica el número de filas resultante y el orden."
  fr:
    name: "Test du processeur CSV"
    description: "Banc de test pour utility-module-csv-processor. Écrit un petit CSV dans un fichier temporaire, exécute filter → sort → select → limit, puis vérifie le nombre de lignes obtenu et l’ordre."
  de:
    name: "CSV-Prozessor Test"
    description: "Test-Harness für utility-module-csv-processor. Schreibt eine kleine CSV in eine temporäre Datei, führt filter → sort → select → limit aus und prüft dann die resultierende Zeilenanzahl und Sortierung."
  ar:
    name: "اختبار معالج CSV"
    description: "إطار اختبار لـ utility-module-csv-processor. يكتب CSV صغيرًا في ملف مؤقت، ثم يشغّل filter → sort → select → limit، وبعدها يتحقق من عدد الصفوف الناتج والترتيب."
  pt:
    name: "Teste do processador CSV"
    description: "Harness de teste para utility-module-csv-processor. Escreve um pequeno CSV em um arquivo temporário, executa filter → sort → select → limit e, em seguida, verifica a quantidade de linhas resultante e a ordem."
  vi:
    name: "Kiểm thử bộ xử lý CSV"
    description: "Khung kiểm thử cho utility-module-csv-processor. Ghi một CSV nhỏ vào tệp tạm, chạy filter → sort → select → limit, rồi xác nhận số dòng kết quả và thứ tự."
tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: setup
    code:
      language: python
      timeout: 10
      script: |
        import os
        import tempfile
        from pathlib import Path

        run_dir = os.environ.get("WF_RUN_DIR") or tempfile.mkdtemp(prefix="csv_test_")
        Path(run_dir).mkdir(parents=True, exist_ok=True)
        csv_path = Path(run_dir) / "input.csv"
        csv_path.write_text(
            "id,name,status,score\n"
            "1,alice,active,40\n"
            "2,bob,inactive,85\n"
            "3,carol,active,95\n"
            "4,dave,active,70\n"
            "5,eve,active,55\n",
            encoding="utf-8"
        )
        print(f"csv_in_path={csv_path}")
    extract:
      - pattern: 'csv_in_path=(.+)'
        variable: csv_in_path
    priority: 20

  - step: run_csv
    sub_workflow:
      name: utility-module-csv-processor
      inputs:
        input_path: "{{var:csv_in_path}}"
        operations_json: |
          [
            {"op": "filter", "column": "status", "eq": "active"},
            {"op": "sort",   "column": "score",  "order": "desc"},
            {"op": "select", "columns": ["id", "name", "score"]},
            {"op": "limit",  "count": 3}
          ]
        output_format: json
      outputs:
        csv_output_file: output_file
        csv_row_count: row_count
        csv_status: process_status
    depends_on:
      - setup
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json
        import os
        import sys
        from pathlib import Path

        status = os.environ.get("WF_VAR_CSV_STATUS", "").strip()
        row_count_raw = os.environ.get("WF_VAR_CSV_ROW_COUNT", "").strip()
        out_file = os.environ.get("WF_VAR_CSV_OUTPUT_FILE", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"status != ok (got '{status}')")
        if int(row_count_raw or "0") != 3:
            problems.append(f"expected 3 rows after limit, got {row_count_raw}")

        if out_file and Path(out_file).exists():
            rows = json.loads(Path(out_file).read_text(encoding="utf-8"))
            if not isinstance(rows, list):
                problems.append(f"output should be JSON array, got {type(rows).__name__}")
            elif len(rows) != 3:
                problems.append(f"JSON rows len != 3: {len(rows)}")
            else:
                names = [r["name"] for r in rows]
                if names != ["carol", "dave", "eve"]:
                    problems.append(f"sort + limit wrong: {names}")
                first_cols = set(rows[0].keys())
                if first_cols != {"id", "name", "score"}:
                    problems.append(f"select columns wrong: {first_cols}")
        else:
            problems.append(f"output_file missing: {out_file}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - run_csv
    priority: 5
