---
name: test-workflow-session-sharing
version: 1.0.0
tags:
- test
- session-sharing
description: Session-sharing test - use the per_execution strategy so multiple steps of the same agent share context
translations:
  en:
    name: "Session Sharing Test"
    description: "Session-sharing test - use the per_execution strategy so multiple steps of the same agent share context"
  zh:
    name: "会话共享测试"
    description: "会话共享测试 - 使用 per_execution 策略，使同一代理的多个步骤共享上下文"
  zhHant:
    name: "會話共享測試"
    description: "會話共享測試 - 使用 per_execution 策略，使同一代理的多個步驟共用上下文"
  ja:
    name: "セッション共有 テスト"
    description: "セッション共有テスト - per_execution 戦略を使用して、同じエージェントの複数のステップでコンテキストを共有します"
  ko:
    name: "세션 공유 테스트"
    description: "세션 공유 테스트 - per_execution 전략을 사용하여 동일한 에이전트의 여러 단계가 컨텍스트를 공유합니다"
  es:
    name: "Prueba de compartición de sesión"
    description: "Prueba de compartición de sesión: usa la estrategia per_execution para que varios pasos del mismo agente compartan contexto"
  fr:
    name: "Test de partage de session"
    description: "Test de partage de session : utilise la stratégie per_execution pour que plusieurs étapes du même agent partagent le contexte"
  de:
    name: "Sitzungsfreigabe-Test"
    description: "Sitzungsfreigabe-Test - verwendet die per_execution-Strategie, damit mehrere Schritte desselben Agents den Kontext teilen"
  ar:
    name: "اختبار مشاركة الجلسة"
    description: "اختبار مشاركة الجلسة - يستخدم استراتيجية per_execution لكي تشارك عدة خطوات من الوكيل نفسه السياق"
  pt:
    name: "Teste de compartilhamento de sessão"
    description: "Teste de compartilhamento de sessão - usa a estratégia per_execution para que várias etapas do mesmo agente compartilhem o contexto"
  vi:
    name: "Kiểm thử chia sẻ phiên"
    description: "Kiểm thử chia sẻ phiên - dùng chiến lược per_execution để nhiều bước của cùng một tác nhân dùng chung ngữ cảnh"
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  assistant:
    preset: universal
    overrides:
      system_prompt: |-
        You are a helpful assistant with memory. You remember context from previous interactions in this session.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: per_execution
workflow:
- step: introduce_topic
  agent: assistant
  priority: 10
  input: |-
    Create directory {{output_dir}} if it doesn't exist.
    We are going to discuss "sustainable energy solutions".
    Write an introduction paragraph (50-80 words) about this topic.
    Save it to {{output_dir}}/introduction.txt.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/introduce_topic.md.
- step: expand_topic
  agent: assistant
  depends_on:
  - introduce_topic
  priority: 8
  input: |-
    Based on our previous discussion about sustainable energy,
    read {{output_dir}}/introduction.txt and expand on it.
    Add two more paragraphs covering solar and wind energy (80-120 words total).
    Save the expanded content to {{output_dir}}/expanded.txt.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/expand_topic.md.
- step: conclude_topic
  agent: assistant
  depends_on:
  - expand_topic
  priority: 5
  input: |-
    Read {{output_dir}}/expanded.txt.
    Write a conclusion paragraph (50-80 words) summarizing all the points discussed.
    Save the complete article (introduction + expansion + conclusion) to {{output_dir}}/full_article.txt.
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/conclude_topic.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 200s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
