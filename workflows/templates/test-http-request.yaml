---
name: test-http-request
version: 1.0.0
description: |
  Test harness for utility-module-http-request using httpbin.org.

  Covers:
  - GET with query params (httpbin echoes them back)
  - POST with JSON body (httpbin echoes json field back)
  - Non-2xx response (status 418) — expect request_status=http_error, no exception

translations:
  en:
    name: "HTTP Request Test"
    description: "Test harness for utility-module-http-request using httpbin.org. Covers: - GET with query params (httpbin echoes them back) - POST with JSON body (httpbin echoes json field back) - Non-2xx response (status 418) — expect request_status=http_error, no exception"
  zh:
    name: "HTTP 请求测试"
    description: "utility-module-http-request 的测试套件，使用 httpbin.org。涵盖：- 使用查询参数的 GET（httpbin 会回显它们）- 带 JSON 主体的 POST（httpbin 会回显 json 字段）- 非 2xx 响应（状态 418）— 预期 request_status=http_error，不抛出异常"
  zhHant:
    name: "HTTP 請求測試"
    description: "utility-module-http-request 的測試套件，使用 httpbin.org。涵蓋：- 使用查詢參數的 GET（httpbin 會回顯它們）- 帶 JSON 主體的 POST（httpbin 會回顯 json 欄位）- 非 2xx 回應（狀態 418）— 預期 request_status=http_error，不拋出例外"
  ja:
    name: "HTTP リクエストテスト"
    description: "utility-module-http-request 用のテストハーネス。httpbin.org を使用します。対象: - クエリパラメータ付き GET（httpbin がそれらをエコーします）- JSON 本文付き POST（httpbin が json フィールドをエコーします）- 2xx 以外のレスポンス（status 418）— request_status=http_error を期待し、例外は発生しません"
  ko:
    name: "HTTP 요청 테스트"
    description: "httpbin.org를 사용하는 utility-module-http-request용 테스트 하네스입니다. 포함: - 쿼리 매개변수가 있는 GET(httpbin이 이를 다시 반환) - JSON 본문이 있는 POST(httpbin이 json 필드를 다시 반환) - 2xx가 아닌 응답(status 418) — request_status=http_error를 예상하며 예외는 발생하지 않음"
  es:
    name: "Test de solicitud HTTP"
    description: "Banco de pruebas para utility-module-http-request usando httpbin.org. Cubre: - GET con parámetros de consulta (httpbin los devuelve) - POST con cuerpo JSON (httpbin devuelve el campo json) - Respuesta no 2xx (estado 418) — se espera request_status=http_error, sin excepción"
  fr:
    name: "Test de requête HTTP"
    description: "Banc de test pour utility-module-http-request utilisant httpbin.org. Couvre : - GET avec paramètres de requête (httpbin les renvoie) - POST avec corps JSON (httpbin renvoie le champ json) - Réponse non-2xx (statut 418) — attendre request_status=http_error, sans exception"
  de:
    name: "HTTP-Anfrage-Test"
    description: "Test-Harness für utility-module-http-request mit httpbin.org. Deckt ab: - GET mit Query-Parametern (httpbin gibt sie zurück) - POST mit JSON-Body (httpbin gibt das json-Feld zurück) - Nicht-2xx-Antwort (Status 418) — erwartet request_status=http_error, keine Ausnahme"
  ar:
    name: "اختبار طلب HTTP"
    description: "إطار اختبار لـ utility-module-http-request باستخدام httpbin.org. يغطي: - GET مع معاملات استعلام (يقوم httpbin بإرجاعها) - POST مع نص JSON (يقوم httpbin بإرجاع حقل json) - استجابة غير 2xx (الحالة 418) — المتوقَّع request_status=http_error، بدون استثناء"
  pt:
    name: "Teste de solicitação HTTP"
    description: "Harness de teste para utility-module-http-request usando httpbin.org. Abrange: - GET com parâmetros de consulta (o httpbin os retorna) - POST com corpo JSON (o httpbin retorna o campo json) - Resposta não 2xx (status 418) — esperar request_status=http_error, sem exceção"
  vi:
    name: "Kiểm thử yêu cầu HTTP"
    description: "Bộ kiểm thử cho utility-module-http-request dùng httpbin.org. Bao gồm: - GET với tham số truy vấn (httpbin trả lại chúng) - POST với phần thân JSON (httpbin trả lại trường json) - Phản hồi không thuộc 2xx (status 418) — mong đợi request_status=http_error, không có ngoại lệ"
tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: get_with_query
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/get"
        method: GET
        query_params: '{"foo":"bar","n":42}'
        timeout_seconds: "15"
      outputs:
        get_status_code: status_code
        get_body: response_body
        get_is_json: response_is_json
        get_req_status: request_status
    priority: 10

  - step: post_json
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/post"
        method: POST
        body_format: json
        body: '{"hello":"world","num":7}'
        timeout_seconds: "15"
      outputs:
        post_status_code: status_code
        post_body: response_body
        post_req_status: request_status
    priority: 9

  - step: expect_4xx
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/status/418"
        method: GET
        timeout_seconds: "15"
      outputs:
        err_status_code: status_code
        err_req_status: request_status
    priority: 8

  - step: assert
    code:
      language: python
      timeout: 20
      script: |
        import json
        import os
        import sys

        problems = []

        # --- GET with query params ---
        g_code = os.environ.get("WF_VAR_GET_STATUS_CODE", "").strip()
        g_body = os.environ.get("WF_VAR_GET_BODY", "").strip()
        g_is_json = os.environ.get("WF_VAR_GET_IS_JSON", "").strip().lower()
        g_req_status = os.environ.get("WF_VAR_GET_REQ_STATUS", "").strip()
        if g_code != "200":
            problems.append(f"GET status_code expected 200, got {g_code}")
        if g_req_status != "ok":
            problems.append(f"GET request_status expected ok, got {g_req_status}")
        if g_is_json != "true":
            problems.append(f"GET response_is_json expected true, got {g_is_json}")
        # body should be single-line JSON preview; look for echoed query args
        if '"foo"' not in g_body or '"bar"' not in g_body:
            problems.append(f"GET body missing echoed query foo=bar: {g_body[:300]}")

        # --- POST JSON ---
        p_code = os.environ.get("WF_VAR_POST_STATUS_CODE", "").strip()
        p_body = os.environ.get("WF_VAR_POST_BODY", "").strip()
        p_req_status = os.environ.get("WF_VAR_POST_REQ_STATUS", "").strip()
        if p_code != "200":
            problems.append(f"POST status_code expected 200, got {p_code}")
        if p_req_status != "ok":
            problems.append(f"POST request_status expected ok, got {p_req_status}")
        # httpbin echoes the JSON body under "json" key
        if '"hello"' not in p_body or '"world"' not in p_body:
            problems.append(f"POST body missing echoed hello=world: {p_body[:300]}")

        # --- 418 error path ---
        e_code = os.environ.get("WF_VAR_ERR_STATUS_CODE", "").strip()
        e_req_status = os.environ.get("WF_VAR_ERR_REQ_STATUS", "").strip()
        if e_code != "418":
            problems.append(f"418 path status_code != 418, got {e_code}")
        if e_req_status != "http_error":
            problems.append(f"418 path request_status expected 'http_error', got '{e_req_status}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - get_with_query
      - post_json
      - expect_4xx
    priority: 5
