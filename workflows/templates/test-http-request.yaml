---
name: test-http-request
version: 1.0.0
description: |
  Test harness for utility-module-http-request using httpbin.org.

  Covers:
  - GET with query params (httpbin echoes them back)
  - POST with JSON body (httpbin echoes json field back)
  - Non-2xx response (status 418) — expect request_status=http_error, no exception

tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: get_with_query
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/get"
        method: GET
        query_params: '{"foo":"bar","n":42}'
        timeout_seconds: "15"
      outputs:
        get_status_code: status_code
        get_body: response_body
        get_is_json: response_is_json
        get_req_status: request_status
    priority: 10

  - step: post_json
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/post"
        method: POST
        body_format: json
        body: '{"hello":"world","num":7}'
        timeout_seconds: "15"
      outputs:
        post_status_code: status_code
        post_body: response_body
        post_req_status: request_status
    priority: 9

  - step: expect_4xx
    sub_workflow:
      name: utility-module-http-request
      inputs:
        url: "https://httpbin.org/status/418"
        method: GET
        timeout_seconds: "15"
      outputs:
        err_status_code: status_code
        err_req_status: request_status
    priority: 8

  - step: assert
    code:
      language: python
      timeout: 20
      script: |
        import json
        import os
        import sys

        problems = []

        # --- GET with query params ---
        g_code = os.environ.get("WF_VAR_GET_STATUS_CODE", "").strip()
        g_body = os.environ.get("WF_VAR_GET_BODY", "").strip()
        g_is_json = os.environ.get("WF_VAR_GET_IS_JSON", "").strip().lower()
        g_req_status = os.environ.get("WF_VAR_GET_REQ_STATUS", "").strip()
        if g_code != "200":
            problems.append(f"GET status_code expected 200, got {g_code}")
        if g_req_status != "ok":
            problems.append(f"GET request_status expected ok, got {g_req_status}")
        if g_is_json != "true":
            problems.append(f"GET response_is_json expected true, got {g_is_json}")
        # body should be single-line JSON preview; look for echoed query args
        if '"foo"' not in g_body or '"bar"' not in g_body:
            problems.append(f"GET body missing echoed query foo=bar: {g_body[:300]}")

        # --- POST JSON ---
        p_code = os.environ.get("WF_VAR_POST_STATUS_CODE", "").strip()
        p_body = os.environ.get("WF_VAR_POST_BODY", "").strip()
        p_req_status = os.environ.get("WF_VAR_POST_REQ_STATUS", "").strip()
        if p_code != "200":
            problems.append(f"POST status_code expected 200, got {p_code}")
        if p_req_status != "ok":
            problems.append(f"POST request_status expected ok, got {p_req_status}")
        # httpbin echoes the JSON body under "json" key
        if '"hello"' not in p_body or '"world"' not in p_body:
            problems.append(f"POST body missing echoed hello=world: {p_body[:300]}")

        # --- 418 error path ---
        e_code = os.environ.get("WF_VAR_ERR_STATUS_CODE", "").strip()
        e_req_status = os.environ.get("WF_VAR_ERR_REQ_STATUS", "").strip()
        if e_code != "418":
            problems.append(f"418 path status_code != 418, got {e_code}")
        if e_req_status != "http_error":
            problems.append(f"418 path request_status expected 'http_error', got '{e_req_status}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - get_with_query
      - post_json
      - expect_4xx
    priority: 5
