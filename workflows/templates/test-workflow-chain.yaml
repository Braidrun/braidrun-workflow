---
name: test-workflow-chain
version: 1.0.0
tags:
- test
- basic-chaining
description: Multi-step chained workflow - steps pass data through files, testing the dependency chain and priorities
variables:
  project_name: TestProject
  output_dir: "./output/test-workflow-chain"
  demo_mode: 'true'
agents:
  worker:
    preset: universal
    overrides:
      system_prompt: |-
        You are a precise assistant. Follow instructions exactly. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      - shell
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: init
  agent: worker
  priority: 10
  input: |-
    Create the directory ./output if it doesn't exist.
    Create a file ./output/config.json with this exact JSON content:
    {"project": "{{var:project_name}}", "steps_completed": []}
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/init.md。
- step: step_a
  agent: worker
  depends_on:
  - init
  priority: 5
  input: |-
    Read ./output/config.json. Add "step_a" to the steps_completed array.
    Write the updated JSON back to ./output/config.json.
    Also create ./output/step_a.txt with content "Step A done".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/step_a.md。
- step: step_b
  agent: worker
  depends_on:
  - init
  priority: 3
  input: |-
    Read ./output/config.json. Add "step_b" to the steps_completed array.
    Write the updated JSON back to ./output/config.json.
    Also create ./output/step_b.txt with content "Step B done".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/step_b.md。
- step: finalize
  agent: worker
  depends_on:
  - step_a
  - step_b
  input: |-
    Read ./output/config.json and list all files in ./output/.
    Create ./output/report.txt with a summary that includes:
    - The project name from config.json
    - Which steps were completed (from steps_completed array)
    - List of all files in the output directory
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/finalize.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 600s
  per_step: 120s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
