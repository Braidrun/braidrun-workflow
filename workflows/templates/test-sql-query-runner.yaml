---
name: test-sql-query-runner
version: 1.0.0
description: |
  Test harness for utility-module-sql-query-runner.

  Uses SQLite to avoid external DB dependency:
  - Create a DB file, insert test rows (allow_writes=true)
  - SELECT with positional parameters, assert rows_json + row_count
  - Attempt a write with allow_writes=false → expect rejection

translations:
  en:
    name: "SQL Query Runner Test"
    description: "Test harness for utility-module-sql-query-runner. Uses SQLite to avoid external DB dependency: - Create a DB file, insert test rows (allow_writes=true) - SELECT with positional parameters, assert rows_json + row_count - Attempt a write with allow_writes=false → expect rejection"
  zh:
    name: "SQL 查询运行器测试"
