---
name: prd-review-refinement
version: 3.0.0
tags:
- PRD评审
- 产品管理
- 需求分析
- 多角色协作
- 迭代优化
- 多源聚合
- group_chat
- repeat_until
- extract
- aggregate
- condition
category: software
description: |
  互联网产品需求文档 (PRD) 评审与优化工作流

  适用场景：新功能或新产品的 PRD 初稿评审，确保需求完整性、技术可行性和可测试性，适合产品经理提交 PRD 后的正式评审流程。
  说明：产品专家、技术架构师、测试经理三方并行评估，aggregate 聚合三方评估结果，group_chat 跨职能评审会讨论争议点，
  repeat_until 迭代优化 PRD 直到质量评分达标。
  流程：产品逻辑审计 -> 技术可行性 + 测试策略(并行) -> 评估聚合 -> 跨职能评审会 -> PRD 迭代优化 -> 最终报告。
variables:
  product_name: 新版社区功能
  prd_draft: 请在这里输入 PRD 初稿内容，或者提供 PRD 的文件路径
  target_audience: 20-30岁活跃社交用户
  quality_threshold: '8'
  assessment_summary: ''
  output_dir: "./output/prd-review-refinement"
  demo_mode: 'true'
variable_tags:
  assessment_summary: '业务参数'
  demo_mode: '运行模式'
  output_dir: '输出'
  prd_draft: '业务参数'
  product_name: '业务参数'
  quality_threshold: '业务参数'
  target_audience: '业务参数'
agents:
  pm_expert:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位资深互联网产品专家，擅长 PRD 的打磨和业务逻辑闭环分析。
        你的目标是确保需求符合用户价值，且业务逻辑严密，无歧义。
        输出必须包含以下格式化指标：
        - user_stories_count=N（用户故事数量）
        - logic_gaps=N（逻辑漏洞数量）
        - priority_p0_count=N（P0 级需求数量）

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  tech_architect:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位资深全栈工程师和系统架构师。
        你负责评估需求的实现难度，识别潜在的技术风险（高并发、数据一致性、安全性等），
        并提出初步的系统架构建议。
        输出必须包含以下格式化指标：
        - tech_risks=N（技术风险数量）
        - estimated_effort=N（估算工作量人天）
        - risk_level=HIGH/MEDIUM/LOW（技术风险等级）

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  test_manager:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位经验丰富的质量保障 (QA) 经理。
        你擅长从边界条件、异常流程和用户体验角度审视需求，
        并能快速生成测试覆盖范围和核心测试用例。
        输出必须包含以下格式化指标：
        - test_cases_count=N（测试用例数量）
        - boundary_cases=N（边界条件数量）

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位 PRD 质量评审专家。对需求文档进行综合评分。
        评分维度：业务逻辑完整性(25%)、技术可行性(25%)、可测试性(25%)、用户体验(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: prd-logic-audit
  agent: pm_expert
  input: |
    评审「{{var:product_name}}」的 PRD 初稿：
    {{var:prd_draft}}

    1. 检查业务逻辑是否闭环，是否有未定义的异常流程？
    2. 用户故事是否完整（As a... I want... So that...）？
    3. 评估功能优先级是否合理（P0/P1/P2）？
    4. 针对 {{var:target_audience}} 的特征，提出 3 个体验优化建议。
    5. 竞品功能对比分析。
    6. 验收标准 (Acceptance Criteria) 是否明确可量化？
    输出必须包含以下格式化指标：
    - user_stories_count=N
    - logic_gaps=N
    - priority_p0_count=N
    输出到：prd-audit-report.md
  extract:
  - pattern: user_stories_count=(\d+)
    variable: user_stories_count
  - pattern: logic_gaps=(\d+)
    variable: logic_gaps
  - pattern: priority_p0_count=(\d+)
    variable: priority_p0_count
  priority: 10
- step: technical-feasibility-check
  agent: tech_architect
  input: |
    基于 {{steps.prd-logic-audit.output}}，进行技术评估：
    1. 分析实现这些功能所需的核心技术组件。
    2. 识别至少 3 个潜在的技术难点或性能瓶颈。
    3. 数据模型初步设计。
    4. 第三方服务依赖评估。
    5. 估算大致的开发工作量（人天）。
    6. 技术风险评级（高/中/低）和缓解方案。
    输出必须包含以下格式化指标：
    - tech_risks=N
    - estimated_effort=N
    - risk_level=HIGH/MEDIUM/LOW
    输出到：tech-feasibility-assessment.md
  extract:
  - pattern: tech_risks=(\d+)
    variable: tech_risks
  - pattern: estimated_effort=(\d+)
    variable: estimated_effort
  - pattern: risk_level=(\w+)
    variable: risk_level
  depends_on:
  - prd-logic-audit
  priority: 9
- step: test-coverage-design
  agent: test_manager
  input: |
    基于 {{steps.prd-logic-audit.output}}，设计测试方案：
    1. 列出所有核心功能点的正常测试路径。
    2. 识别至少 8 个边界值或异常情况（网络中断、非法输入、并发冲突等）。
    3. 性能测试场景设计（预期并发量、响应时间要求）。
    4. 安全测试检查清单。
    5. 生成完整的测试大纲（含优先级标注）。
    输出必须包含以下格式化指标：
    - test_cases_count=N
    - boundary_cases=N
    输出到：test-strategy-outline.md
  extract:
  - pattern: test_cases_count=(\d+)
    variable: test_cases_count
  - pattern: boundary_cases=(\d+)
    variable: boundary_cases
  depends_on:
  - prd-logic-audit
  priority: 8
- step: aggregate-assessments
  agent: pm_expert
  input: |-
    请将以下三方评估结果整理为统一的评审摘要，突出关键发现和决策点：
    {{var:assessment_summary}}

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/aggregate-assessments.md。
  aggregate:
    sources:
    - |-
      【产品审计】用户故事={{var:user_stories_count}}个，逻辑漏洞={{var:logic_gaps}}个，P0需求={{var:priority_p0_count}}个
      {{steps.prd-logic-audit.output}}
    - |-
      【技术评估】技术风险={{var:tech_risks}}个，风险等级={{var:risk_level}}，工作量={{var:estimated_effort}}人天
      {{steps.technical-feasibility-check.output}}
    - |-
      【测试策略】测试用例={{var:test_cases_count}}个，边界条件={{var:boundary_cases}}个
      {{steps.test-coverage-design.output}}
    strategy: numbered_list
    output_variable: assessment_summary
  depends_on:
  - technical-feasibility-check
  - test-coverage-design
  priority: 7
- step: cross-functional-review
  group_chat:
    participants:
    - pm_expert
    - tech_architect
    - test_manager
    initial_message: |-
      PRD 跨职能评审会议开始。评估指标概览：
      - 用户故事：{{var:user_stories_count}} 个，逻辑漏洞：{{var:logic_gaps}} 个
      - 技术风险：{{var:tech_risks}} 个（{{var:risk_level}}），工作量：{{var:estimated_effort}} 人天
      - 测试用例：{{var:test_cases_count}} 个，边界条件：{{var:boundary_cases}} 个

      评估摘要：
      {{steps.aggregate-assessments.output}}

      讨论重点：
      1. 技术难点是否影响产品功能定义？需要做哪些妥协？
      2. 测试发现的边界场景是否需要在 PRD 中补充说明？
      3. 优先级排序是否合理？MVP 范围是否清晰？
      4. 开发工作量估算是否合理？
      5. 需要补充的需求细节和验收标准
      讨论完毕后请说 REVIEW_COMPLETE

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 5
    speaker_selection: round_robin
    termination_keyword: REVIEW_COMPLETE
  depends_on:
  - aggregate-assessments
  priority: 6
- step: enhanced-prd
  agent: pm_expert
  input: |
    结合跨职能评审共识，优化 PRD：

    评估摘要：{{steps.aggregate-assessments.output}}
    评审共识：{{steps.cross-functional-review.output}}
    上次评估反馈（如有）：{{steps.enhanced-prd:evaluate.output}}

    请：
    1. 逐条回应评审中提出的每个问题。
    2. 补充遗漏的异常流程和边界条件。
    3. 更新验收标准使其可量化。
    4. 标注修改项（新增/修改/删除）。
    5. 更新优先级和 MVP 范围。
    输出到：enhanced-prd-final.md
  depends_on:
  - cross-functional-review
  priority: 4
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下 PRD 的质量。
      评分维度：业务逻辑完整性(25%)、技术可行性(25%)、可测试性(25%)、用户体验(25%)。
      输出格式：quality_score=N（1-10 分）

      PRD 内容：
      {{steps.enhanced-prd.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: final-report
  agent: pm_expert
  input: |
    生成最终 PRD 评审报告（质量评分 {{var:quality_score}}）：
    1. 评审摘要：{{var:user_stories_count}} 个用户故事，{{var:tech_risks}} 个技术风险，{{var:estimated_effort}} 人天工作量
    2. 优化后的 PRD：{{steps.enhanced-prd.output}}
    3. 技术方案摘要（风险等级 {{var:risk_level}}）：{{steps.technical-feasibility-check.output}}
    4. 测试策略摘要（{{var:test_cases_count}} 用例）：{{steps.test-coverage-design.output}}
    5. 关键决策记录（来自评审会）。
    6. 后续行动项和里程碑。
    输出到：prd-review-final-report.md
  depends_on:
  - enhanced-prd
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 400s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
