---
name: test-dingyue-orders-summary
version: 1.0.0
description: Test dingyue-module-orders-summary — chain time-window + app-list + orders.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: window
    sub_workflow:
      name: dingyue-module-time-window-resolver
      inputs: {lookback_days: "7"}
      outputs: {start_ms: start_ms, end_ms: end_ms}
    priority: 25
  - step: list_apps
    sub_workflow:
      name: dingyue-module-app-list-fetcher
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps", max_apps: "1"}
      outputs: {ids: app_ids_csv}
    priority: 24
  - step: pick
    code:
      language: python
      timeout: 5
      script: |
        import os
        ids = os.environ.get("WF_VAR_IDS", "").split(",")
        print(f"first_id={ids[0] if ids else ''}")
    extract: [{pattern: 'first_id=(.+)', variable: first_app_id}]
    depends_on: [list_apps]
    priority: 15
  - step: fetch_orders
    sub_workflow:
      name: dingyue-module-orders-summary
      inputs:
        username: "{{var:test_username}}"
        password: "{{var:test_password}}"
        dingyue_platform: "flashapps"
        app_id: "{{var:first_app_id}}"
        mobile_platform: "ios"
        start_ms: "{{var:start_ms}}"
        end_ms: "{{var:end_ms}}"
        max_items: "100"
      outputs:
        status: fetch_status
        cnt: order_count
        refund: refund_count
        rate: refund_rate_pct
    depends_on: [window, pick]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        cnt = os.environ.get("WF_VAR_CNT", "")
        if not cnt.isdigit(): problems.append(f"cnt not numeric: {cnt}")
        rate = float(os.environ.get("WF_VAR_RATE", "0") or "0")
        if rate < 0 or rate > 100: problems.append(f"rate out of range: {rate}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (orders={cnt}, refunds={os.environ.get('WF_VAR_REFUND','?')}, rate={rate}%)")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [fetch_orders]
    priority: 5
