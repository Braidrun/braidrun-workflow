---
name: test-dns-lookup
version: 1.0.0
description: Test dns-lookup A record for cloudflare.com.
translations:
  en:
    name: "DNS Lookup Test"
    description: "Test dns-lookup A record for cloudflare.com."
  zh:
    name: "DNS 查询测试"
    description: "测试 cloudflare.com 的 dns-lookup A 记录。"
  zhHant:
    name: "DNS 查詢測試"
    description: "測試 cloudflare.com 的 dns-lookup A 記錄。"
  ja:
    name: "DNS ルックアップテスト"
    description: "cloudflare.com の dns-lookup A レコードをテストします。"
  ko:
    name: "DNS 조회 테스트"
    description: "cloudflare.com의 dns-lookup A 레코드를 테스트합니다."
  es:
    name: "Prueba de búsqueda DNS"
    description: "Prueba del registro A de dns-lookup para cloudflare.com."
  fr:
    name: "Test de recherche DNS"
    description: "Test de l’enregistrement A de dns-lookup pour cloudflare.com."
  de:
    name: "DNS-Lookup-Test"
    description: "Test des A-Eintrags von dns-lookup für cloudflare.com."
  ar:
    name: "اختبار بحث DNS"
    description: "اختبار سجل A لـ dns-lookup على cloudflare.com."
  pt:
    name: "Teste de consulta DNS"
    description: "Teste do registro A de dns-lookup para cloudflare.com."
  vi:
    name: "Kiểm thử tra cứu DNS"
    description: "Kiểm thử bản ghi A của dns-lookup cho cloudflare.com."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-dns-lookup
      inputs: {domain: "cloudflare.com", record_type: "A", expect_contains: "104."}
      outputs:
        recs: records_json
        cnt: record_count
        m: match
        status: dns_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append(f"status={os.environ.get('WF_VAR_STATUS')}")
        cnt = int(os.environ.get("WF_VAR_CNT", "0") or "0")
        if cnt < 1: problems.append(f"cnt={cnt}")
        # expect_contains "104." will most likely match Cloudflare's 104.x.x.x range
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass ({cnt} records)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
