---
name: test-exchange-rate-history
version: 1.0.0
description: Test exchange-rate-history USD→EUR over a fixed historical week.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-exchange-rate-history
      inputs: {from_currency: "USD", to_currency: "EUR", start_date: "2024-01-02", end_date: "2024-01-05"}
      outputs:
        series: series_json
        days: day_count
        status: history_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        days = int(os.environ.get("WF_VAR_DAYS", "0") or "0")
        if days < 3: problems.append(f"days={days} (expected >=3 weekdays)")
        series = json.loads(os.environ.get("WF_VAR_SERIES", "[]"))
        if not series: problems.append("series empty")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass ({days} days)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
