workflow:
- step: security_review
  agent: reviewer_a
  input: |-
    Perform a security review of "{{var:target_system}}".
    Focus on: authentication, data encryption, SQL injection, and XSS protection.
    Output a review report.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/security_review.md.
- step: performance_review
  agent: reviewer_b
  input: |-
    Perform a performance review of "{{var:target_system}}".
    Focus on: response time, concurrency, caching strategy, and database query optimization.
    Output a review report.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/performance_review.md.
- step: ux_review
  agent: reviewer_c
  input: |-
    Perform a user-experience review of "{{var:target_system}}".
    Focus on: interaction flow, UI design, accessibility, and mobile responsiveness.
    Output a review report.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/ux_review.md.
- step: concat_aggregate
  agent: summarizer
  input: |-
    Below is the aggregated result of the three reviews (concatenation mode):
    {{var:concat_reviews}}
    Based on this, generate a consolidated review summary.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/concat_aggregate.md.
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: concat
    separator: |2+


      ===== separator =====

    output_variable: concat_reviews
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: numbered_aggregate
  agent: summarizer
  input: |-
    Below are the review results in numbered-list format:
    {{var:numbered_reviews}}
    Extract the key finding of each item.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/numbered_aggregate.md.
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: numbered_list
    output_variable: numbered_reviews
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: json_aggregate
  code:
    language: python
    script: |
      import os
      import json

      # read the json_array aggregated result
      json_reviews = os.environ.get('WF_VAR_JSON_REVIEWS', '[]')
      try:
          reviews = json.loads(json_reviews)
          print(f"Total reviews: {len(reviews)}")
          print(f"review_count={len(reviews)}")
      except:
          print("Failed to parse JSON array")
          print("review_count=0")
    timeout: 10
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: json_array
    output_variable: json_reviews
  extract:
  - pattern: review_count=(\d+)
    variable: review_count
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: longest_review
  agent: summarizer
  input: |-
    Below is the most detailed review report (the longest one):
    {{var:longest_review_text}}
    Write a concise summary of it.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/longest_review.md.
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: pick_longest
    output_variable: longest_review_text
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: final_report
  agent: summarizer
  input: |
    Combine all aggregation results, generate the final report, and save it to {{var:output_dir}}/aggregate_report.txt:
    Concatenated result summary: {{steps.concat_aggregate.output}}
    Numbered-list summary: {{steps.numbered_aggregate.output}}
    Total reviews: {{var:review_count}}
    Longest-report summary: {{steps.longest_review.output}}
  depends_on:
  - concat_aggregate
  - numbered_aggregate
  - json_aggregate
  - longest_review
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
