---
name: test-workflow-aggregate
version: 1.0.0
tags:
- 测试
- 变量聚合
- 确定性计算
- 多源聚合
- extract
- code
- aggregate
description: |
  多路径变量聚合功能测试 - 测试 Aggregate 步骤的各种聚合策略
  覆盖：sources（多数据源）、strategy（concat/json_array/numbered_list/
  pick_longest/pick_shortest）、separator、output_variable
variables:
  target_system: 电商平台购物车模块
  output_dir: "./output"
  demo_mode: 'true'
agents:
  reviewer_a:
    preset: universal
    overrides:
      system_prompt: |-
        You are a security reviewer. Focus on security aspects. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  reviewer_b:
    preset: universal
    overrides:
      system_prompt: |-
        You are a performance reviewer. Focus on performance aspects. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  reviewer_c:
    preset: universal
    overrides:
      system_prompt: |-
        You are a UX reviewer. Focus on user experience aspects. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  summarizer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a report summarizer. Create comprehensive summaries. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: security_review
  agent: reviewer_a
  input: |-
    对"{{var:target_system}}"进行安全审查。
    重点关注：身份认证、数据加密、SQL注入、XSS防护。
    输出审查报告。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/security_review.md。
- step: performance_review
  agent: reviewer_b
  input: |-
    对"{{var:target_system}}"进行性能审查。
    重点关注：响应时间、并发处理、缓存策略、数据库查询优化。
    输出审查报告。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/performance_review.md。
- step: ux_review
  agent: reviewer_c
  input: |-
    对"{{var:target_system}}"进行用户体验审查。
    重点关注：交互流程、界面设计、无障碍性、移动端适配。
    输出审查报告。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/ux_review.md。
- step: concat_aggregate
  agent: summarizer
  input: |-
    以下是三方审查的聚合结果（拼接模式）：
    {{var:concat_reviews}}
    请基于此生成综合评审摘要。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/concat_aggregate.md。
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: concat
    separator: |2+


      ===== 分隔线 =====

    output_variable: concat_reviews
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: numbered_aggregate
  agent: summarizer
  input: |-
    以下是编号列表格式的审查结果：
    {{var:numbered_reviews}}
    请提取每项的关键发现。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/numbered_aggregate.md。
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: numbered_list
    output_variable: numbered_reviews
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: json_aggregate
  code:
    language: python
    script: |
      import os
      import json

      # 读取 json_array 聚合的结果
      json_reviews = os.environ.get('WF_VAR_JSON_REVIEWS', '[]')
      try:
          reviews = json.loads(json_reviews)
          print(f"Total reviews: {len(reviews)}")
          print(f"review_count={len(reviews)}")
      except:
          print("Failed to parse JSON array")
          print("review_count=0")
    timeout: 10
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: json_array
    output_variable: json_reviews
  extract:
  - pattern: review_count=(\d+)
    variable: review_count
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: longest_review
  agent: summarizer
  input: |-
    以下是最详细的审查报告（最长的一份）：
    {{var:longest_review_text}}
    请对其进行精炼摘要。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/longest_review.md。
  aggregate:
    sources:
    - "{{steps.security_review.output}}"
    - "{{steps.performance_review.output}}"
    - "{{steps.ux_review.output}}"
    strategy: pick_longest
    output_variable: longest_review_text
  depends_on:
  - security_review
  - performance_review
  - ux_review
- step: final_report
  agent: summarizer
  input: |
    综合所有聚合结果，生成最终报告并保存到 {{var:output_dir}}/aggregate_report.txt：
    拼接结果摘要：{{steps.concat_aggregate.output}}
    编号列表摘要：{{steps.numbered_aggregate.output}}
    审查总数：{{var:review_count}}
    最长报告摘要：{{steps.longest_review.output}}
  depends_on:
  - concat_aggregate
  - numbered_aggregate
  - json_aggregate
  - longest_review
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
