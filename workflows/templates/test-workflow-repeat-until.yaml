---
name: test-workflow-repeat-until
version: 1.0.0
tags:
- test
- iterative-refinement
- iterative-refinement
- repeat_until
- condition
description: |
  repeat_until iterative-refinement feature test - tests conditional loop execution
  Covers: condition, max_iterations, evaluate_agent, evaluate_prompt,
  extract_pattern、extract_variable
variables:
  topic: Applications of AI in education
  quality_threshold: '7'
  output_dir: "./output"
  quality_score: '0'
  summary_done: 'no'
  demo_mode: 'true'
agents:
  writer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a content writer. Write and improve content based on feedback. Always output quality_score=N where N is your self-assessment (1-10). Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a quality reviewer. Evaluate content quality and output a score. Always output quality_score=N where N is your assessment (1-10). Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  editor:
    preset: universal
    overrides:
      system_prompt: |-
        You are an editor. Polish and finalize content. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: draft_article
  agent: writer
  input: |-
    Write an article about "{{var:topic}}".
    The previous score was {{var:quality_score}}; please improve on it.
    Output format: after the article content, append quality_score=N (N is a self-assessed score from 1-10).

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/draft_article.md。
  repeat_until:
    condition: quality_score >= 7
    max_iterations: 3
    evaluate_agent: reviewer
    evaluate_prompt: |
      Assess the quality of the following article, scoring it on depth of content, logic, and readability.
      Output format: quality_score=N (N is 1-10).
      Article content: {{steps.draft_article.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: refine_summary
  agent: writer
  input: |-
    Based on the following article, write a concise summary (no more than 200 words).
    Output summary_done=yes at the end of the summary when you consider it concise enough.
    Article: {{steps.draft_article.output}}

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/refine_summary.md。
  repeat_until:
    condition: summary_done == 'yes'
    max_iterations: 2
    extract_pattern: summary_done=(\w+)
    extract_variable: summary_done
  depends_on:
  - draft_article
- step: final_edit
  agent: editor
  input: |
    Perform final editing and polishing of the following article and summary, and save it to {{var:output_dir}}/final_article.txt:
    Article quality score: {{var:quality_score}}
    Article: {{steps.draft_article.output}}
    Summary: {{steps.refine_summary.output}}
  depends_on:
  - refine_summary
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
