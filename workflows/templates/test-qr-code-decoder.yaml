---
name: test-qr-code-decoder
version: 1.0.0
description: Test qr-code-decoder by first generating a QR and then decoding it.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: generate
    sub_workflow:
      name: utility-module-qr-code-generator
      inputs: {text: "BRAIDRUN_TEST_QR_CONTENT_12345", scale: "8"}
      outputs:
        qr_path: qr_path
    priority: 20
  - step: decode
    sub_workflow:
      name: utility-module-qr-code-decoder
      inputs: {image_path: "{{var:qr_path}}"}
      outputs:
        text: first_text
        cnt: code_count
        status: decode_status
    depends_on: [generate]
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        t = os.environ.get("WF_VAR_TEXT", "")
        cnt = os.environ.get("WF_VAR_CNT", "0")
        status = os.environ.get("WF_VAR_STATUS", "")
        problems = []
        if status != "ok": problems.append(f"status={status}")
        if cnt != "1": problems.append(f"cnt={cnt}")
        if t != "BRAIDRUN_TEST_QR_CONTENT_12345": problems.append(f"decoded text wrong: {t}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [decode]
    priority: 5
