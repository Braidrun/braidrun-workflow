name: test-email-classifier
version: 1.0.0
description: Test utility-module-email-classifier (LLM, needs OPENROUTER_API_KEY).
translations:
  en:
    name: "Email Classifier Test"
    description: "Test utility-module-email-classifier (LLM, needs OPENROUTER_API_KEY)."
  zh:
    name: "电子邮件分类器测试"
    description: "测试 utility-module-email-classifier（LLM，需要 OPENROUTER_API_KEY）。"
  zhHant:
