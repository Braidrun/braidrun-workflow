---
name: test-hackernews-fetcher
version: 1.0.0
description: Test hackernews-fetcher top stories.
translations:
  en:
    name: "Hacker News Fetcher Test"
    description: "Test hackernews-fetcher top stories."
  zh:
    name: "Hacker News 获取器测试"
    description: "测试 hackernews-fetcher 热门故事。"
  zhHant:
    name: "Hacker News 擷取器測試"
    description: "測試 hackernews-fetcher 熱門故事。"
  ja:
    name: "Hacker News フェッチャーテスト"
    description: "hackernews-fetcher のトップストーリーをテストします。"
  ko:
    name: "Hacker News 가져오기 테스트"
    description: "hackernews-fetcher 상위 스토리를 테스트합니다."
  es:
    name: "Prueba de capturador de Hacker News"
    description: "Prueba de las historias principales de hackernews-fetcher."
  fr:
    name: "Test du récupérateur Hacker News"
    description: "Test des meilleures histoires de hackernews-fetcher."
  de:
    name: "Hacker-News-Fetcher-Test"
    description: "Test von hackernews-fetcher für Top-Storys."
  ar:
    name: "اختبار جالب Hacker News"
    description: "اختبار القصص الأعلى في hackernews-fetcher."
  pt:
    name: "Teste de coletor do Hacker News"
    description: "Teste das histórias principais de hackernews-fetcher."
  vi:
    name: "Kiểm thử bộ tìm nạp Hacker News"
    description: "Kiểm thử các tin hàng đầu của hackernews-fetcher."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-hackernews-fetcher
      inputs: {list_type: top, max_items: "5"}
      outputs:
        items: items_json
        cnt: item_count
        status: hn_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        cnt = int(os.environ.get("WF_VAR_CNT", "0") or "0")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if cnt < 1: print(f"TEST_STATUS=fail\n  - cnt={cnt}"); sys.exit(1)
        items = json.loads(os.environ.get("WF_VAR_ITEMS", "[]"))
        if not items[0].get("title"): print("TEST_STATUS=fail\n  - first item no title"); sys.exit(1)
        print(f"TEST_STATUS=pass ({cnt} items)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
