---
name: test-ip-geolocation
version: 1.0.0
description: Test ip-geolocation on Cloudflare 1.1.1.1.
translations:
  en:
    name: "IP Geolocation Test"
    description: "Test ip-geolocation on Cloudflare 1.1.1.1."
  zh:
    name: "IP 地理定位测试"
    description: "测试 ip-geolocation，针对 Cloudflare 1.1.1.1。"
  zhHant:
    name: "IP 地理定位測試"
    description: "測試 ip-geolocation，針對 Cloudflare 1.1.1.1。"
  ja:
    name: "IP ジオロケーションテスト"
    description: "Cloudflare 1.1.1.1 に対する ip-geolocation のテスト。"
  ko:
    name: "IP 지리 위치 테스트"
    description: "Cloudflare 1.1.1.1에서 ip-geolocation 테스트를 수행합니다."
  es:
    name: "Test de geolocalización IP"
    description: "Prueba de ip-geolocation en Cloudflare 1.1.1.1."
  fr:
    name: "Test de géolocalisation IP"
    description: "Test de ip-geolocation sur Cloudflare 1.1.1.1."
  de:
    name: "IP-Geolokalisierungs-Test"
    description: "Test für ip-geolocation auf Cloudflare 1.1.1.1."
  ar:
    name: "اختبار تحديد الموقع الجغرافي عبر IP"
    description: "اختبار ip-geolocation على Cloudflare 1.1.1.1."
  pt:
    name: "Teste de geolocalização IP"
    description: "Teste de ip-geolocation na Cloudflare 1.1.1.1."
  vi:
    name: "Kiểm thử định vị địa lý IP"
    description: "Kiểm thử ip-geolocation trên Cloudflare 1.1.1.1."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-ip-geolocation
      inputs: {ip_address: "1.1.1.1"}
      outputs:
        cc: country_code
        isp: isp
        status: geo_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        if not os.environ.get("WF_VAR_CC"): problems.append("country_code empty")
        isp = os.environ.get("WF_VAR_ISP", "").lower()
        if "cloudflare" not in isp and "apnic" not in isp:
          problems.append(f"1.1.1.1 isp should mention cloudflare or apnic: {isp}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
