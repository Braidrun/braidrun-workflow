---
name: test-meeting-action-items
version: 1.0.0
description: Test utility-module-meeting-action-items (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-meeting-action-items
      inputs:
        "transcript": "Alice: I will handle the API redesign by next Friday. Bob: I will update the docs after Alice finishes. Carol: I will coordinate with the QA team before the launch."
      outputs:
        cnt: action_count
        status: actions_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
