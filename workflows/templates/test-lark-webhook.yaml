---
name: test-lark-webhook
version: 1.0.0
description: |
  Negative-path test for utility-module-lark-webhook.

  Verifies the module's URL validation guard rejects a URL that doesn't
  match the open.feishu.cn / open.larksuite.com pattern.

tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: bad_url
    sub_workflow:
      name: utility-module-lark-webhook
      inputs:
        webhook_url: "https://not-feishu.example.com/hook/abc"
        msg_type: text
        text: "this should never be sent"
      outputs:
        bad_send_status: send_status
        bad_response_msg: response_msg
    on_failure:
      - next: assert
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        send_status = os.environ.get("WF_VAR_BAD_SEND_STATUS", "").strip()

        problems = []
        if send_status != "":
            problems.append(f"send_status should be empty (module rejected URL), got '{send_status}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass (module correctly rejected non-Lark URL)")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    priority: 5
