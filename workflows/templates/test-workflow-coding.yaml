---
name: test-workflow-coding
version: 1.0.0
tags:
- test
- coding-task
description: Coding workflow test - uses the coder preset to generate code and run a code review
translations:
  en:
    name: "Workflow Coding Test"
    description: "Coding workflow test - uses the coder preset to generate code and run a code review"
  zh:
    name: "工作流编码测试"
    description: "编码工作流测试 - 使用 coder 预设生成代码并执行代码审查。"
  zhHant:
    name: "工作流編碼測試"
    description: "編碼工作流測試 - 使用 coder 預設生成代碼並執行代碼審查。"
  ja:
    name: "ワークフローコーディングテスト"
    description: "コーディングワークフローテスト - coder プリセットを使用してコードを生成し、コードレビューを実行します。"
  ko:
    name: "워크플로 코딩 테스트"
    description: "코딩 워크플로 테스트 - coder 프리셋을 사용하여 코드를 생성하고 코드 리뷰를 실행합니다."
  es:
    name: "Prueba de codificación de flujo de trabajo"
    description: "Prueba del flujo de trabajo de codificación: usa el ajuste preestablecido coder para generar código y ejecutar una revisión de código."
  fr:
    name: "Test de codage de workflow"
    description: "Test du workflow de codage - utilise le préréglage coder pour générer du code et exécuter une revue de code."
  de:
    name: "Workflow-Coding-Test"
    description: "Test des Coding-Workflows - verwendet die Voreinstellung coder, um Code zu generieren und eine Codeüberprüfung auszuführen."
  ar:
    name: "اختبار ترميز سير العمل"
    description: "اختبار سير عمل البرمجة - يستخدم الإعداد المسبق coder لتوليد الشيفرة وتشغيل مراجعة للشيفرة."
  pt:
    name: "Teste de programação de fluxo de trabalho"
    description: "Teste do fluxo de trabalho de programação - usa a predefinição coder para gerar código e executar uma revisão de código."
  vi:
    name: "Kiểm thử lập trình quy trình làm việc"
    description: "Kiểm thử quy trình làm việc lập trình - dùng thiết lập sẵn coder để tạo mã và chạy rà soát mã."
variables:
  output_dir: "./output"
  language: Python
  demo_mode: 'true'
agents:
  developer:
    preset: coder
    description: "Handles software development responsibilities in this test workflow."
    translations:
      en:
        description: "Handles software development responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的软件开发职责。"
      zhHant:
        description: "負責此測試工作流程中的軟體開發職責。"
      ja:
        description: "このテストワークフローでソフトウェア開発を担当します。"
      ko:
        description: "이 테스트 워크플로에서 소프트웨어 개발 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de desarrollo de software en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de développement logiciel dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Softwareentwicklung."
      ar:
        description: "يتولى مسؤوليات تطوير البرمجيات في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de desenvolvimento de software neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò phát triển phần mềm trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a software developer. Write clean, well-documented code. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - shell
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  code_reviewer:
    preset: coder
    description: "Handles code review responsibilities in this test workflow."
    translations:
      en:
        description: "Handles code review responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的代码审查职责。"
      zhHant:
        description: "負責此測試工作流程中的程式碼審查職責。"
      ja:
        description: "このテストワークフローでコードレビューを担当します。"
      ko:
        description: "이 테스트 워크플로에서 코드 검토 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de revisión de código en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de revue de code dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Codeprüfung."
      ar:
        description: "يتولى مسؤوليات مراجعة الشفرة في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de revisão de código neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò đánh giá mã nguồn trong workflow kiểm thử này."
    overrides:
      system_prompt: |-
        You are a code reviewer. Review code for quality, bugs, and best practices. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - file_system
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: write_code
  agent: developer
  priority: 10
  input: |-
    Create directory {{output_dir}} if it doesn't exist.
    Write a {{language}} script {{output_dir}}/calculator.py that implements a simple calculator class with:
    1. add(a, b) - addition
    2. subtract(a, b) - subtraction
    3. multiply(a, b) - multiplication
    4. divide(a, b) - division (handle division by zero)
    5. A main block that demonstrates each operation
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/write_code.md.
- step: write_tests
  agent: developer
  depends_on:
  - write_code
  priority: 8
  input: |-
    Read the calculator code from {{output_dir}}/calculator.py.
    Write unit tests in {{output_dir}}/test_calculator.py using pytest.
    Cover all methods including edge cases (e.g., division by zero).
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/write_tests.md.
- step: review_code
  agent: code_reviewer
  depends_on:
  - write_code
  - write_tests
  priority: 5
  input: |-
    Review the following files:
    - {{output_dir}}/calculator.py
    - {{output_dir}}/test_calculator.py

    Write a code review report to {{output_dir}}/code_review.txt covering:
    1. Code quality and readability
    2. Test coverage assessment
    3. Potential bugs or issues
    4. Suggestions for improvement
    Call exit when done.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/review_code.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 300s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
