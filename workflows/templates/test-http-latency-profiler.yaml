---
name: test-http-latency-profiler
version: 1.0.0
description: Test http-latency-profiler — small samples against example.com.
translations:
  en:
    name: "HTTP Latency Profiler Test"
    description: "Test http-latency-profiler — small samples against example.com."
  zh:
    name: "HTTP 延迟分析器测试"
    description: "测试 http-latency-profiler — 对 example.com 进行小样本采样。"
  zhHant:
    name: "HTTP 延遲分析器測試"
    description: "測試 http-latency-profiler — 對 example.com 進行小樣本採樣。"
  ja:
    name: "HTTP レイテンシープロファイラーテスト"
    description: "http-latency-profiler のテスト — example.com に対して小規模サンプルを実行します。"
  ko:
    name: "HTTP 지연 프로파일러 테스트"
    description: "http-latency-profiler 테스트 — example.com에 대해 소규모 샘플을 측정합니다."
  es:
    name: "Test de perfilador de latencia HTTP"
    description: "Prueba de http-latency-profiler — realiza muestras pequeñas contra example.com."
  fr:
    name: "Test du profileur de latence HTTP"
    description: "Test de http-latency-profiler — effectue de petits échantillons sur example.com."
  de:
    name: "HTTP-Latenzprofil-Test"
    description: "Test für http-latency-profiler — kleine Stichproben gegen example.com."
  ar:
    name: "اختبار محلل كمون HTTP"
    description: "اختبار http-latency-profiler — عينات صغيرة مقابل example.com."
  pt:
    name: "Teste de perfilador de latência HTTP"
    description: "Teste de http-latency-profiler — amostras pequenas contra example.com."
  vi:
    name: "Kiểm thử bộ phân tích độ trễ HTTP"
    description: "Kiểm thử http-latency-profiler — lấy mẫu nhỏ trên example.com."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-http-latency-profiler
      inputs: {url: "https://example.com", samples: "3", method: HEAD, timeout_seconds: "10", inter_request_ms: "50"}
      outputs:
        p50: p50_ms
        mean: mean_ms
        err: error_count
        status: latency_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        p50 = int(os.environ.get("WF_VAR_P50", "0") or "0")
        mean = int(os.environ.get("WF_VAR_MEAN", "0") or "0")
        err = int(os.environ.get("WF_VAR_ERR", "99") or "99")
        if p50 < 1 or p50 > 10000: problems.append(f"p50 unreasonable: {p50}ms")
        if mean < 1 or mean > 10000: problems.append(f"mean unreasonable: {mean}ms")
        # allow 1 error out of 3 (flaky network)
        if err > 1: problems.append(f"too many errors: {err}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (p50={p50}ms)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
