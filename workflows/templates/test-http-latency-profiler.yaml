---
name: test-http-latency-profiler
version: 1.0.0
description: Test http-latency-profiler — small samples against example.com.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-http-latency-profiler
      inputs: {url: "https://example.com", samples: "3", method: HEAD, timeout_seconds: "10", inter_request_ms: "50"}
      outputs:
        p50: p50_ms
        mean: mean_ms
        err: error_count
        status: latency_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        p50 = int(os.environ.get("WF_VAR_P50", "0") or "0")
        mean = int(os.environ.get("WF_VAR_MEAN", "0") or "0")
        err = int(os.environ.get("WF_VAR_ERR", "99") or "99")
        if p50 < 1 or p50 > 10000: problems.append(f"p50 unreasonable: {p50}ms")
        if mean < 1 or mean > 10000: problems.append(f"mean unreasonable: {mean}ms")
        # allow 1 error out of 3 (flaky network)
        if err > 1: problems.append(f"too many errors: {err}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (p50={p50}ms)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
