---
name: test-dingyue-ad-account-list
version: 1.0.0
description: Test ad-account list — ASA + GoogleAds combined.
tags:
  - code
  - extract
  - sub_workflow

variables:
  test_username: ""
  test_password: ""

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: dingyue-module-ad-account-list
      inputs: {username: "{{var:test_username}}", password: "{{var:test_password}}", dingyue_platform: "flashapps"}
      outputs:
        status: fetch_status
        asa: asa_count
        gads: googleads_count
        total: total_count
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        try:
          total = int(os.environ.get("WF_VAR_TOTAL", "0") or "0")
        except ValueError:
          total = -1; problems.append("total not int")
        if total < 1: problems.append(f"total should be >= 1, got {total}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (asa={os.environ.get('WF_VAR_ASA','?')}, gads={os.environ.get('WF_VAR_GADS','?')}, total={total})")
    extract: [{pattern: 'TEST_STATUS=(\w+)', variable: test_status}]
    depends_on: [run]
    priority: 5
