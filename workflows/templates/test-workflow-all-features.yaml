---
name: test-workflow-all-features
version: 1.0.0
tags:
- test
- comprehensive-features
- multi-role-collaboration
- iterative-refinement
- deterministic-compute
- smart-routing
- batch-processing
- multi-source-aggregation
- knowledge-retrieval
- parallel-processing
- group_chat
- repeat_until
- extract
- code
- classifier
- iterate_over
- aggregate
- knowledge_base
- parallel
- condition
description: |
  Comprehensive new-feature test - combines all new features in a single workflow
  Covers: group_chat, repeat_until, agent_based, code, extract,
  classifier、iterate_over、aggregate、knowledge_base
variables:
  project_name: AllFeaturesTest
  requirement_text: We need a multi-language user authentication system supporting OAuth2 and traditional password login
  output_dir: "./output"
  quality_score: '0'
  quality_threshold: '7'
  project_type: ''
  demo_mode: 'true'
agents:
  pm:
    preset: universal
    overrides:
      system_prompt: |-
        You are a product manager. Define requirements and manage product direction. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  developer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a software developer. Write code and technical specs. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  tester:
    preset: universal
    overrides:
      system_prompt: |-
        You are a QA tester. Create test plans and verify quality. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a classification expert. Classify inputs accurately. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a quality reviewer. Evaluate quality and output quality_score=N (1-10). Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: classify_project
  classifier:
    agent: classifier_agent
    input: |-
      Classify the following requirement by project type:
      {{var:requirement_text}}

      Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/classify_project.md。
    categories:
    - name: backend
      description: Backend service project, covering APIs, databases, and server-side logic
    - name: frontend
      description: Frontend project, covering UI, user interaction, and page design
    - name: fullstack
      description: Full-stack project, covering both frontend and backend
    output_variable: project_type
    default_category: fullstack
- step: setup_project
  code:
    language: bash
    script: |
      mkdir -p ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}
      echo "project=${WF_VAR_PROJECT_NAME}" > ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/config.txt
      echo "type=${WF_VAR_PROJECT_TYPE}" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/config.txt
      echo "status=initialized"
      echo "setup_complete=true"
    timeout: 10
  extract:
  - pattern: setup_complete=(\w+)
    variable: setup_status
  depends_on:
  - classify_project
- step: requirement_review
  group_chat:
    participants:
    - pm
    - developer
    - tester
    moderator: pm
    max_rounds: 3
    speaker_selection: round_robin
    termination_keyword: CONSENSUS_REACHED
    initial_message: |-
      Project type: {{var:project_type}}
      Requirement description: {{var:requirement_text}}
      Everyone, please review this requirement and discuss technical feasibility and the testing strategy.
      Output CONSENSUS_REACHED once consensus is reached.

      At the end of the discussion, give a reusable summary of the conclusion so later steps can save it directly as a demo deliverable.
  depends_on:
  - setup_project
- step: design_iteration
  agent: developer
  input: |-
    Based on the requirements review, design the technical solution for "{{var:project_name}}".
    Project type: {{var:project_type}}
    Review comments: {{steps.requirement_review.output}}
    Previous quality score: {{var:quality_score}}
    Improve the design and output quality_score=N (N is 1-10).

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/design_iteration.md。
  repeat_until:
    condition: quality_score >= 7
    max_iterations: 3
    evaluate_agent: reviewer
    evaluate_prompt: |
      Assess the quality of the following technical design:
      {{steps.design_iteration.output}}
      Output quality_score=N (N is 1-10).
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
  depends_on:
  - requirement_review
- step: generate_tasks
  code:
    language: python
    script: |
      import os
      project_type = os.environ.get('WF_VAR_PROJECT_TYPE', 'fullstack')
      tasks = []
      if project_type in ('backend', 'fullstack'):
          tasks.extend(['Design the database schema', 'Implement the auth API', 'Write backend unit tests'])
      if project_type in ('frontend', 'fullstack'):
          tasks.extend(['Design the login page', 'Implement the OAuth2 frontend flow', 'Write frontend E2E tests'])
      print('\n'.join(tasks))
    timeout: 10
  depends_on:
  - design_iteration
- step: execute_tasks
  agent: developer
  input: |-
    Execute development task #{{var:dev_task_index}}: {{var:dev_task_item}}
    Project: {{var:project_name}}
    Output a task-completion report.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/execute_tasks.md。
  iterate_over:
    source: "{{steps.generate_tasks.output}}"
    delimiter: "\n"
    item_variable: dev_task_item
    index_variable: dev_task_index
    max_items: 10
    parallel: false
    results_variable: task_results
  depends_on:
  - generate_tasks
- step: verify_security
  agent: tester
  input: |-
    Perform security verification of "{{var:project_name}}".
    Design proposal: {{steps.design_iteration.output}}
    Development results: {{var:task_results}}

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/verify_security.md。
  depends_on:
  - execute_tasks
- step: verify_functionality
  agent: tester
  input: |-
    Perform functional verification of "{{var:project_name}}".
    Design proposal: {{steps.design_iteration.output}}
    Development results: {{var:task_results}}

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/verify_functionality.md。
  depends_on:
  - execute_tasks
- step: aggregate_results
  agent: pm
  input: |
    Summarize the following verification results, generate the final project report, and save it to {{var:output_dir}}/{{var:project_name}}/final_report.txt:
    Project type: {{var:project_type}}
    Quality score: {{var:quality_score}}
    Aggregated validation result: {{var:aggregated_verification}}
  aggregate:
    sources:
    - "{{steps.verify_security.output}}"
    - "{{steps.verify_functionality.output}}"
    strategy: numbered_list
    output_variable: aggregated_verification
  depends_on:
  - verify_security
  - verify_functionality
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1200s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
knowledge_base:
  enabled: true
  storage_dir: "./kb-all-features"
  auto_index_outputs: true
  auto_inject_rag_tools: true
  chunk_size: 500
  source_files:
  - path: "./WORKFLOW_GUIDE.md"
    tags: workflow,syntax
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
