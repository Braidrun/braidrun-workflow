---
name: test-workflow-all-features
version: 1.0.0
tags:
- 测试
- 综合功能
- 多角色协作
- 迭代优化
- 确定性计算
- 智能路由
- 批量处理
- 多源聚合
- 知识检索
- 并行处理
- group_chat
- repeat_until
- extract
- code
- classifier
- iterate_over
- aggregate
- knowledge_base
- parallel
- condition
description: |
  综合新功能测试 - 在单个工作流中组合使用所有新增功能
  覆盖：group_chat、repeat_until、agent_based、code、extract、
  classifier、iterate_over、aggregate、knowledge_base
variables:
  project_name: AllFeaturesTest
  requirement_text: 需要一个支持多语言的用户认证系统，支持 OAuth2 和传统密码登录
  output_dir: "./output"
  quality_score: '0'
  quality_threshold: '7'
  project_type: ''
  demo_mode: 'true'
agents:
  pm:
    preset: universal
    overrides:
      system_prompt: |-
        You are a product manager. Define requirements and manage product direction. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  developer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a software developer. Write code and technical specs. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  tester:
    preset: universal
    overrides:
      system_prompt: |-
        You are a QA tester. Create test plans and verify quality. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a classification expert. Classify inputs accurately. Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      max_iterations: 8196
      session_id_strategy: auto
  reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a quality reviewer. Evaluate quality and output quality_score=N (1-10). Call exit when done.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: classify_project
  classifier:
    agent: classifier_agent
    input: |-
      请对以下需求进行项目类型分类：
      {{var:requirement_text}}

      演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/classify_project.md。
    categories:
    - name: backend
      description: 后端服务项目，涉及 API、数据库、服务器端逻辑
    - name: frontend
      description: 前端项目，涉及 UI、用户交互、页面设计
    - name: fullstack
      description: 全栈项目，同时涉及前端和后端
    output_variable: project_type
    default_category: fullstack
- step: setup_project
  code:
    language: bash
    script: |
      mkdir -p ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}
      echo "project=${WF_VAR_PROJECT_NAME}" > ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/config.txt
      echo "type=${WF_VAR_PROJECT_TYPE}" >> ${WF_VAR_OUTPUT_DIR}/${WF_VAR_PROJECT_NAME}/config.txt
      echo "status=initialized"
      echo "setup_complete=true"
    timeout: 10
  extract:
  - pattern: setup_complete=(\w+)
    variable: setup_status
  depends_on:
  - classify_project
- step: requirement_review
  group_chat:
    participants:
    - pm
    - developer
    - tester
    moderator: pm
    max_rounds: 3
    speaker_selection: round_robin
    termination_keyword: CONSENSUS_REACHED
    initial_message: |-
      项目类型：{{var:project_type}}
      需求描述：{{var:requirement_text}}
      请各位评审此需求，讨论技术可行性和测试策略。
      达成共识后输出 CONSENSUS_REACHED。

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
  depends_on:
  - setup_project
- step: design_iteration
  agent: developer
  input: |-
    基于需求评审结果，设计"{{var:project_name}}"的技术方案。
    项目类型：{{var:project_type}}
    评审意见：{{steps.requirement_review.output}}
    上次质量评分：{{var:quality_score}}
    请改进设计，输出 quality_score=N（N 为 1-10）。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/design_iteration.md。
  repeat_until:
    condition: quality_score >= 7
    max_iterations: 3
    evaluate_agent: reviewer
    evaluate_prompt: |
      评估以下技术设计方案的质量：
      {{steps.design_iteration.output}}
      输出 quality_score=N（N 为 1-10）。
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
  depends_on:
  - requirement_review
- step: generate_tasks
  code:
    language: python
    script: |
      import os
      project_type = os.environ.get('WF_VAR_PROJECT_TYPE', 'fullstack')
      tasks = []
      if project_type in ('backend', 'fullstack'):
          tasks.extend(['设计数据库schema', '实现认证API', '编写后端单元测试'])
      if project_type in ('frontend', 'fullstack'):
          tasks.extend(['设计登录页面', '实现OAuth2前端流程', '编写前端E2E测试'])
      print('\n'.join(tasks))
    timeout: 10
  depends_on:
  - design_iteration
- step: execute_tasks
  agent: developer
  input: |-
    执行开发任务 #{{var:dev_task_index}}: {{var:dev_task_item}}
    项目：{{var:project_name}}
    请输出任务完成报告。

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/execute_tasks.md。
  iterate_over:
    source: "{{steps.generate_tasks.output}}"
    delimiter: "\n"
    item_variable: dev_task_item
    index_variable: dev_task_index
    max_items: 10
    parallel: false
    results_variable: task_results
  depends_on:
  - generate_tasks
- step: verify_security
  agent: tester
  input: |-
    对"{{var:project_name}}"进行安全性验证。
    设计方案：{{steps.design_iteration.output}}
    开发结果：{{var:task_results}}

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/verify_security.md。
  depends_on:
  - execute_tasks
- step: verify_functionality
  agent: tester
  input: |-
    对"{{var:project_name}}"进行功能性验证。
    设计方案：{{steps.design_iteration.output}}
    开发结果：{{var:task_results}}

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/verify_functionality.md。
  depends_on:
  - execute_tasks
- step: aggregate_results
  agent: pm
  input: |
    汇总以下验证结果，生成最终项目报告并保存到 {{var:output_dir}}/{{var:project_name}}/final_report.txt：
    项目类型：{{var:project_type}}
    质量评分：{{var:quality_score}}
    聚合验证结果：{{var:aggregated_verification}}
  aggregate:
    sources:
    - "{{steps.verify_security.output}}"
    - "{{steps.verify_functionality.output}}"
    strategy: numbered_list
    output_variable: aggregated_verification
  depends_on:
  - verify_security
  - verify_functionality
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1200s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
knowledge_base:
  enabled: true
  storage_dir: "./kb-all-features"
  auto_index_outputs: true
  auto_inject_rag_tools: true
  chunk_size: 500
  source_files:
  - path: "./WORKFLOW_GUIDE.md"
    tags: workflow,syntax
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
