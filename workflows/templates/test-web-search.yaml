---
name: test-web-search
version: 1.0.0
description: Test web-search via DuckDuckGo (no API key).
translations:
  en:
    name: "Web Search Test"
    description: "Test web-search via DuckDuckGo (no API key)."
  zh:
    name: "网页搜索测试"
    description: "通过 DuckDuckGo 测试 web-search（无 API key）。"
  zhHant:
    name: "網頁搜尋測試"
    description: "透過 DuckDuckGo 測試 web-search（無 API key）。"
  ja:
    name: "Web 検索テスト"
    description: "DuckDuckGo 経由で web-search をテストします（API key なし）。"
  ko:
    name: "Web 검색 테스트"
    description: "DuckDuckGo를 통해 web-search를 테스트합니다(API key 없음)."
  es:
    name: "Prueba de búsqueda web"
    description: "Probar web-search mediante DuckDuckGo (sin API key)."
  fr:
    name: "Test de recherche web"
    description: "Tester web-search via DuckDuckGo (sans API key)."
  de:
    name: "Websuche-Test"
    description: "web-search über DuckDuckGo testen (ohne API key)."
  ar:
    name: "اختبار البحث على الويب"
    description: "اختبار web-search عبر DuckDuckGo (بدون API key)."
  pt:
    name: "Teste de busca na web"
    description: "Testar web-search via DuckDuckGo (sem API key)."
  vi:
    name: "Kiểm thử tìm kiếm web"
    description: "Kiểm thử web-search qua DuckDuckGo (không có API key)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: search
    sub_workflow:
      name: utility-module-web-search
      inputs:
        query: "python programming language"
        provider: duckduckgo
        max_results: "5"
      outputs:
        results: results_json
        count: result_count
        status: search_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        raw = os.environ.get("WF_VAR_RESULTS", "[]")
        cnt = int(os.environ.get("WF_VAR_COUNT", "0") or "0")
        status = os.environ.get("WF_VAR_STATUS", "")
        problems = []
        if status != "ok": problems.append(f"status={status}")
        # allow 0-5 results (DDG occasionally rate-limits and returns few), but they must parse
        try:
            data = json.loads(raw)
        except json.JSONDecodeError as e:
            problems.append(f"json decode: {e}")
            data = []
        if cnt > 0 and not data: problems.append(f"count={cnt} but results empty")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (got {cnt} results)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [search]
    priority: 5
