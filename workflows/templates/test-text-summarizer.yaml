---
name: test-text-summarizer
version: 1.0.0
description: |
  Test harness for utility-module-text-summarizer (LLM-driven, needs OpenRouter key).

  Feeds a ~500 char passage to the summarizer in tldr style, verifies:
  - status is ok
  - summary length is bounded (>10 and <= max_length+margin)
  - compression_ratio is a sensible number
  - summary_path points to an existing file

  Requires: OPENROUTER_API_KEY env var set.

tags:
  - code
  - extract
  - sub_workflow

variables:
  source_text: |
    Braidrun Workflow is a multi-layered AI agent workflow runtime focused on defining
    reproducible agent flows, deterministic code steps, and tool calls in YAML. It is built
    on Kotlin/JVM and can be used as a CLI or embedded as a library in other applications.
    Core capabilities include agent presets, parallel execution, conditions and state machines,
    sub-workflows, MCP integration, and delegating external coding agents through Claude Code
    and Codex subprocesses. The runtime supports both a local native subprocess mode and a
    Docker-based isolation mode. It integrates multiple LLM providers via the Koog AI Agents
    framework, including Anthropic, OpenAI, DeepSeek, and OpenRouter, and offers features such
    as tokenizer, tracing, long-term memory, and cascading fallback.

agents: {}

workflow:
  - step: summarize
    sub_workflow:
      name: utility-module-text-summarizer
      inputs:
        input_text: "{{var:source_text}}"
        style: tldr
        max_length: "80"
        target_language: "zh"
      outputs:
        summary_text_out: summary_text
        summary_path_out: summary_path
        summary_length_out: summary_length
        compression_ratio_out: compression_ratio
        original_length_out: original_length
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys
        from pathlib import Path

        summary = os.environ.get("WF_VAR_SUMMARY_TEXT_OUT", "").strip()
        summary_path = os.environ.get("WF_VAR_SUMMARY_PATH_OUT", "").strip()
        summary_length_raw = os.environ.get("WF_VAR_SUMMARY_LENGTH_OUT", "").strip()
        compression_raw = os.environ.get("WF_VAR_COMPRESSION_RATIO_OUT", "").strip()
        original_length_raw = os.environ.get("WF_VAR_ORIGINAL_LENGTH_OUT", "").strip()

        problems = []

        if not summary:
            problems.append("summary_text is empty — LLM did not produce output")
        elif len(summary) < 10:
            problems.append(f"summary_text too short ({len(summary)} chars): {summary!r}")
        # TLDR should roughly respect max_length=80, but LLMs miss it sometimes.
        # Give a generous 3x margin to avoid flaky tests while still catching
        # runaway outputs (e.g., model dumping full essay).
        elif len(summary) > 240:
            problems.append(f"summary_text too long ({len(summary)} chars): bit runaway")

        try:
            summary_length = int(summary_length_raw)
            if summary_length < 10:
                problems.append(f"summary_length too small: {summary_length}")
        except ValueError:
            problems.append(f"summary_length not int: '{summary_length_raw}'")

        try:
            original_length = int(original_length_raw)
            if original_length < 100:
                problems.append(f"original_length suspiciously small: {original_length}")
        except ValueError:
            problems.append(f"original_length not int: '{original_length_raw}'")

        try:
            compression = float(compression_raw)
            # compression is summary/original × 100 (percent). TLDR should be < 60%.
            if not (0 < compression < 60):
                problems.append(f"compression_ratio should be in (0, 60) %, got {compression}")
        except ValueError:
            problems.append(f"compression_ratio not float: '{compression_raw}'")

        if summary_path and not Path(summary_path).exists():
            problems.append(f"summary_path does not exist on disk: {summary_path}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print(f"TEST_STATUS=pass")
            print(f"summary_preview={summary[:120]}")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
      - pattern: 'summary_preview=(.*)'
        variable: summary_preview
    depends_on:
      - summarize
    priority: 5
