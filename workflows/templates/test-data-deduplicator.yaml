---
name: test-data-deduplicator
version: 1.0.0
description: |
  Test harness for utility-module-data-deduplicator.

  Feeds a small JSON array with duplicate emails and verifies the first-wins
  strategy keeps 3 unique records.

translations:
  en:
    name: "Data Deduplicator Test"
    description: "Test harness for utility-module-data-deduplicator. Feeds a small JSON array with duplicate emails and verifies the first-wins strategy keeps 3 unique records."
  zh:
    name: "数据去重测试"
    description: "utility-module-data-deduplicator 的测试工具。输入一个包含重复电子邮件的小型 JSON 数组，并验证首个保留策略会保留 3 条唯一记录。"
  zhHant:
    name: "資料去重測試"
    description: "utility-module-data-deduplicator 的測試工具。輸入一個包含重複電子郵件的小型 JSON 陣列，並驗證首個保留策略會保留 3 筆唯一記錄。"
  ja:
    name: "データ重複排除テスト"
    description: "utility-module-data-deduplicator のテストハーネス。重複するメールアドレスを含む小さな JSON 配列を渡し、先勝ちの戦略で 3 件の一意なレコードが保持されることを検証します。"
  ko:
    name: "데이터 중복 제거 테스트"
    description: "utility-module-data-deduplicator의 테스트 하니스입니다. 중복 이메일이 있는 작은 JSON 배열을 입력하고, 첫 항목 우선 전략으로 3개의 고유 레코드가 유지되는지 검증합니다."
  es:
    name: "Prueba de deduplicación de datos"
    description: "Banco de pruebas para utility-module-data-deduplicator. Introduce una pequeña matriz JSON con correos duplicados y verifica que la estrategia de primer valor conserva 3 registros únicos."
  fr:
    name: "Test de déduplication des données"
    description: "Banc de test pour utility-module-data-deduplicator. Fournit un petit tableau JSON avec des e-mails en double et vérifie que la stratégie du premier conservé garde 3 enregistrements uniques."
  de:
    name: "Daten-Deduplizierung Test"
    description: "Test-Harness für utility-module-data-deduplicator. Übergibt ein kleines JSON-Array mit doppelten E-Mails und prüft, dass die First-Wins-Strategie 3 eindeutige Datensätze beibehält."
  ar:
    name: "اختبار إزالة تكرار البيانات"
    description: "إطار اختبار لـ utility-module-data-deduplicator. يمرر مصفوفة JSON صغيرة تحتوي على رسائل بريد إلكتروني مكررة ويتحقق من أن استراتيجية الاحتفاظ بالأول تُبقي 3 سجلات فريدة."
  pt:
    name: "Teste de deduplicação de dados"
    description: "Harness de teste para utility-module-data-deduplicator. Envia um pequeno array JSON com e-mails duplicados e verifica se a estratégia first-wins mantém 3 registros exclusivos."
  vi:
    name: "Kiểm thử khử trùng lặp dữ liệu"
    description: "Khung kiểm thử cho utility-module-data-deduplicator. Đưa vào một mảng JSON nhỏ có email trùng lặp và xác minh chiến lược giữ bản ghi đầu tiên bảo toàn 3 bản ghi duy nhất."
tags:
  - code
  - extract
  - sub_workflow

variables:
  fixture: |
    [
      {"id": 1, "email": "alice@example.com", "name": "Alice"},
      {"id": 2, "email": "bob@example.com",   "name": "Bob"},
      {"id": 3, "email": "alice@example.com", "name": "Alice (duplicate)"},
      {"id": 4, "email": "carol@example.com", "name": "Carol"},
      {"id": 5, "email": "bob@example.com",   "name": "Bob (second)"}
    ]

agents: {}

workflow:
  - step: dedupe
    sub_workflow:
      name: utility-module-data-deduplicator
      inputs:
        input_json: "{{var:fixture}}"
        dedupe_keys: "email"
        strategy: first
        output_format: json
      outputs:
        dedupe_output_file: output_file
        dedupe_input_count: input_count
        dedupe_output_count: output_count
        dedupe_duplicate_count: duplicate_count
        dedupe_status: dedupe_status
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json
        import os
        import sys
        from pathlib import Path

        status = os.environ.get("WF_VAR_DEDUPE_STATUS", "").strip()
        in_count_raw = os.environ.get("WF_VAR_DEDUPE_INPUT_COUNT", "").strip()
        out_count_raw = os.environ.get("WF_VAR_DEDUPE_OUTPUT_COUNT", "").strip()
        dup_count_raw = os.environ.get("WF_VAR_DEDUPE_DUPLICATE_COUNT", "").strip()
        out_file = os.environ.get("WF_VAR_DEDUPE_OUTPUT_FILE", "").strip()

        problems = []
        if status != "ok":
            problems.append(f"status != ok (got '{status}')")
        if int(in_count_raw or "0") != 5:
            problems.append(f"input_count expected 5, got {in_count_raw}")
        if int(out_count_raw or "0") != 3:
            problems.append(f"output_count expected 3 (after dedupe), got {out_count_raw}")
        if int(dup_count_raw or "0") != 2:
            problems.append(f"duplicate_count expected 2, got {dup_count_raw}")

        if out_file and Path(out_file).exists():
            deduped = json.loads(Path(out_file).read_text(encoding="utf-8"))
            if not isinstance(deduped, list):
                problems.append(f"output file should contain a JSON array, got {type(deduped).__name__}")
            else:
                emails = sorted(x["email"] for x in deduped)
                if emails != ["alice@example.com", "bob@example.com", "carol@example.com"]:
                    problems.append(f"emails after dedupe wrong: {emails}")
                # First-wins: alice => id=1 (not id=3), bob => id=2 (not id=5)
                by_email = {x["email"]: x["id"] for x in deduped}
                if by_email.get("alice@example.com") != 1:
                    problems.append(f"first-wins broken for alice: id={by_email.get('alice@example.com')}")
                if by_email.get("bob@example.com") != 2:
                    problems.append(f"first-wins broken for bob: id={by_email.get('bob@example.com')}")
        else:
            problems.append(f"output_file missing or unreadable: {out_file}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - dedupe
    priority: 5
