---
name: test-data-pivot
version: 1.0.0
description: Test data-pivot groupby region + sum sales + count rows.
translations:
  en:
    name: "Data Pivot Test"
    description: "Test data-pivot groupby region + sum sales + count rows."
  zh:
    name: "数据透视测试"
    description: "测试 data-pivot：按 region 执行 groupby，汇总 sales 并统计行数。"
  zhHant:
    name: "資料樞紐測試"
    description: "測試 data-pivot：依 region 執行 groupby，彙總 sales 並計算列數。"
  ja:
    name: "データピボットテスト"
    description: "data-pivot で region ごとに groupby し、sales を合計して行数をカウントするテスト。"
  ko:
    name: "데이터 피벗 테스트"
    description: "data-pivot에서 region별로 groupby하고 sales를 합계한 뒤 행 수를 카운트하는 테스트입니다."
  es:
    name: "Prueba de tabla dinámica de datos"
    description: "Prueba de data-pivot: groupby por region, suma de sales y conteo de filas."
  fr:
    name: "Test de pivot de données"
    description: "Test de data-pivot : groupby par region, somme de sales et comptage des lignes."
  de:
    name: "Datenpivot-Test"
    description: "Test von data-pivot: groupby nach region, sales summieren und Zeilen zählen."
  ar:
    name: "اختبار محورية البيانات"
    description: "اختبار data-pivot: groupby حسب region، ثم جمع sales وعدّ الصفوف."
  pt:
    name: "Teste de pivot de dados"
    description: "Teste de data-pivot: groupby por region, soma de sales e contagem de linhas."
  vi:
    name: "Kiểm thử pivot dữ liệu"
    description: "Kiểm thử data-pivot: groupby theo region, tính tổng sales và đếm số dòng."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-data-pivot
      inputs:
        input_json: '[{"region":"US","sales":100},{"region":"US","sales":50},{"region":"CN","sales":80},{"region":"CN","sales":20},{"region":"EU","sales":60}]'
        group_by: region
        aggregations_json: '[{"field":"sales","op":"sum","as":"total"},{"op":"count","as":"n"}]'
        sort_by: -total
      outputs:
        result: result_json
        cnt: group_count
        status: pivot_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json, os, sys
        data = json.loads(os.environ.get("WF_VAR_RESULT", "[]"))
        problems = []
        if len(data) != 3: problems.append(f"groups expected 3, got {len(data)}")
        by_region = {d["region"]: d for d in data}
        if by_region["US"]["total"] != 150: problems.append(f"US total={by_region['US']['total']}")
        if by_region["CN"]["total"] != 100: problems.append(f"CN total={by_region['CN']['total']}")
        if by_region["EU"]["n"] != 1: problems.append(f"EU n={by_region['EU']['n']}")
        # sort_by -total: US (150) should come first
        if data[0]["region"] != "US": problems.append(f"first sorted should be US, got {data[0]['region']}")
        if problems:
          print("TEST_STATUS=fail")
          [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
