---
name: user-feedback-bug-triaging
version: 3.0.0
tags:
- Bug分类
- 用户反馈
- 质量管理
- 多角色协作
- 迭代优化
- 智能路由
- 多源聚合
- group_chat
- repeat_until
- extract
- classifier
- aggregate
- condition
category: automation
description: |
  用户反馈与 Bug 分类处理工作流，自动化处理 App Store 评论、客服工单和社交媒体反馈。涵盖情感分析和严重等级标注（P0-P3）、智能分类路由（Bug/体验/功能需求/混合），到分类专项分析（根因分析/UX 优化/Backlog 规划）、跨职能评审会和按优先级排序的执行方案。
  真实流程：反馈收集 → 智能分类路由 → 分类处理（Bug/体验/功能需求）→ 评审会 → 迭代优化方案 → 执行报告
  特性：classifier 智能分类路由、agent_based 动态分类分配、extract 结构化提取、
        aggregate 多路径聚合、group_chat 评审会、repeat_until 方案质量迭代
variables:
  product_name: 智慧学堂 App
  feedback_source: App Store 评论、客服工单、社交媒体
  time_range: 最近 7 天
  quality_threshold: '8'
  feedback_type: mixed
  merged_analysis: ''
  output_dir: "./output/user-feedback-bug-triaging"
  demo_mode: 'true'
variable_tags:
  demo_mode: '运行模式'
  feedback_source: '业务参数'
  feedback_type: '业务参数'
  merged_analysis: '业务参数'
  output_dir: '输出'
  product_name: '业务参数'
  quality_threshold: '业务参数'
  time_range: '时间窗口'
agents:
  feedback_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位用户反馈分析专家，擅长从大量用户反馈中提取关键信息。
        你能识别情感倾向、归类问题类型、判断严重等级和影响范围。
        输出必须包含以下格式化指标：
        - feedback_total=N（反馈总量）
        - negative_ratio=N%（负面反馈比例）
        - p0_count=N（P0 级问题数量）

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  bug_engineer:
    preset: coder
    overrides:
      system_prompt: |-
        你是一位技术工程师，擅长分析 Bug 的根因、复现路径和修复方案。
        你能评估 Bug 的技术复杂度和修复优先级。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  ux_specialist:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位用户体验专家，擅长从用户视角分析产品体验问题。
        你能将用户抱怨转化为可执行的体验优化方案。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  feature_analyst:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位产品功能分析专家，擅长评估用户功能需求的价值和可行性。
        你能将用户需求转化为产品 Backlog 项，并评估优先级和 ROI。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  pm_coordinator:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位产品经理，负责协调技术和体验团队处理用户反馈。
        你擅长优先级排序和资源调配。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位反馈分类专家。请仔细阅读反馈内容，判断其主要类型。
        只需要输出分类结果，不需要详细分析。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位质量评审专家。对反馈处理方案进行综合评分。
        评分维度：分类准确性(25%)、方案可行性(25%)、优先级合理性(25%)、覆盖完整性(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: feedback-collection
  agent: feedback_analyst
  input: |
    收集并分析「{{var:product_name}}」的用户反馈：
    来源：{{var:feedback_source}}
    时间范围：{{var:time_range}}

    1. 反馈总量统计和趋势变化。
    2. 情感分析：正面/中性/负面比例。
    3. 问题分类：Bug（崩溃/功能异常/UI问题）、体验建议、功能需求。
    4. Top 10 高频问题及其出现次数。
    5. 严重等级标注：P0(阻断)/P1(严重)/P2(一般)/P3(建议)。
    6. 受影响用户群体估算。
    输出必须包含以下格式化指标：
    - feedback_total=N
    - negative_ratio=N%
    - p0_count=N
    输出到：feedback-analysis.md
  extract:
  - pattern: feedback_total=(\d+)
    variable: feedback_total
  - pattern: negative_ratio=(\d+)%
    variable: negative_ratio
  - pattern: p0_count=(\d+)
    variable: p0_count
  priority: 10
- step: feedback-classify
  classifier:
    agent: classifier_agent
    input: |-
      根据以下反馈分析报告，判断当前最主要的反馈类型：
      P0 问题数量：{{var:p0_count}}
      负面反馈比例：{{var:negative_ratio}}%
      详细分析：{{steps.feedback-collection.output}}

      演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/feedback-classify.md。
    categories:
    - name: bug_dominated
      description: 以技术 Bug 为主（崩溃、功能异常、数据错误），P0/P1 问题占多数，需要紧急技术修复
    - name: ux_dominated
      description: 以用户体验问题为主（操作不便、界面混乱、流程复杂），需要体验优化
    - name: feature_dominated
      description: 以功能需求为主（缺少功能、功能不完善），需要产品规划
    - name: mixed
      description: 混合类型，Bug、体验和功能需求各占一定比例，需要综合处理
    output_variable: feedback_type
    default_category: mixed
  depends_on:
  - feedback-collection
  priority: 9
- step: bug-analysis
  agent: bug_engineer
  input: |
    分析「{{var:product_name}}」的技术 Bug 问题：
    反馈分析：{{steps.feedback-collection.output}}
    反馈类型分类：{{var:feedback_type}}

    请针对所有 Bug 类反馈：
    1. 根因分析和复现路径。
    2. 影响范围和用户量估算。
    3. 修复方案和工作量估算（人天）。
    4. 修复优先级排序。
    输出到：bug-analysis.md
  condition: feedback_type != feature_dominated && feedback_type != ux_dominated
  depends_on:
  - feedback-classify
  priority: 8
- step: ux-analysis
  agent: ux_specialist
  input: |
    分析「{{var:product_name}}」的用户体验问题：
    反馈分析：{{steps.feedback-collection.output}}
    反馈类型分类：{{var:feedback_type}}

    请针对所有体验类反馈：
    1. 用户痛点分析和场景还原。
    2. 竞品对比和最佳实践。
    3. 优化方案设计（含交互原型描述）。
    4. 预期效果和用户满意度提升估算。
    输出到：ux-analysis.md
  condition: feedback_type != feature_dominated && feedback_type != bug_dominated
  depends_on:
  - feedback-classify
  priority: 8
- step: feature-analysis
  agent: feature_analyst
  input: |
    分析「{{var:product_name}}」的用户功能需求：
    反馈分析：{{steps.feedback-collection.output}}
    反馈类型分类：{{var:feedback_type}}

    请针对所有功能需求类反馈：
    1. 需求归类和优先级评估。
    2. 用户价值和商业 ROI 分析。
    3. 技术可行性初步评估。
    4. 建议的产品 Backlog 项。
    输出到：feature-analysis.md
  condition: feedback_type != bug_dominated && feedback_type != ux_dominated
  depends_on:
  - feedback-classify
  priority: 8
- step: aggregate-analysis
  agent: pm_coordinator
  input: |-
    请将以下各维度分析结果整合为一份统一的处理摘要：
    {{var:merged_analysis}}

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/aggregate-analysis.md。
  aggregate:
    sources:
    - |-
      【反馈概况】反馈总量={{var:feedback_total}}，负面比例={{var:negative_ratio}}%，P0问题={{var:p0_count}}个
      反馈类型分类：{{var:feedback_type}}
      {{steps.feedback-collection.output}}
    - "【Bug 分析】{{steps.bug-analysis.output}}"
    - "【体验分析】{{steps.ux-analysis.output}}"
    - "【功能需求分析】{{steps.feature-analysis.output}}"
    strategy: concat
    separator: |2+


      ===

    output_variable: merged_analysis
  depends_on:
  - bug-analysis
  - ux-analysis
  - feature-analysis
  priority: 7
- step: triaging-review
  group_chat:
    participants:
    - feedback_analyst
    - bug_engineer
    - ux_specialist
    - pm_coordinator
    initial_message: |-
      反馈处理评审会。当前反馈类型分类：{{var:feedback_type}}
      关键指标：反馈总量={{var:feedback_total}}，负面比例={{var:negative_ratio}}%，P0问题={{var:p0_count}}

      各维度分析汇总：
      {{steps.aggregate-analysis.output}}

      讨论重点：
      1. Bug 的优先级排序是否合理？是否有漏网之鱼？
      2. 体验优化方案是否切实可行？
      3. 功能需求的优先级和 ROI 评估是否准确？
      4. 资源分配是否合理？当前迭代能处理多少？
      5. 是否有需要升级处理的紧急问题？
      6. 确定最终的处理计划和排期
      讨论完毕后请说 PLAN_CONFIRMED

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: PLAN_CONFIRMED
  depends_on:
  - aggregate-analysis
  priority: 6
- step: action-plan
  agent: pm_coordinator
  input: |
    基于评审共识生成最终处理方案：

    各维度分析汇总：{{steps.aggregate-analysis.output}}
    评审共识：{{steps.triaging-review.output}}
    上次评估反馈（如有）：{{steps.action-plan:evaluate.output}}

    1. 按优先级排序的完整处理清单。
    2. 每个问题的负责人、预计解决时间和验收标准。
    3. 当前迭代（Sprint）的处理范围。
    4. 需要跨团队协调的事项。
    5. 用户沟通方案（对已反馈用户的回复模板）。
    输出到：action-plan.md
  depends_on:
  - triaging-review
  priority: 4
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下反馈处理方案的质量。
      评分维度：分类准确性(25%)、方案可行性(25%)、优先级合理性(25%)、覆盖完整性(25%)。
      输出格式：quality_score=N（1-10 分）

      处理方案：
      {{steps.action-plan.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: execution-report
  agent: feedback_analyst
  input: |
    生成反馈处理执行报告（质量评分 {{var:quality_score}}）：
    反馈类型分类：{{var:feedback_type}}
    1. 反馈概况：反馈总量={{var:feedback_total}}，负面比例={{var:negative_ratio}}%
    2. 分类处理结果：{{steps.aggregate-analysis.output}}
    3. 最终方案：{{steps.action-plan.output}}
    4. 关键指标：处理覆盖率、平均响应时间、用户满意度预期。
    5. 风险项和需要关注的问题。
    6. 下周反馈趋势预测和预防建议。
    输出到：feedback-report.md
  depends_on:
  - action-plan
  priority: 2
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 3600s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
