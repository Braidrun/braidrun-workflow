---
name: test-workflow-agent-based
version: 1.0.0
tags:
- test
- agent-based-orchestration
- dynamic-orchestration
- agent_based
description: |
  Agent-based orchestration feature test - tests the Orchestrator Agent dynamically delegating tasks
  Covers: orchestrator (preset + overrides), participants, goal,
  max_steps、budget_tokens、timeout_seconds
variables:
  project_name: User Authentication Module
  output_dir: "./output"
  demo_mode: 'true'
agents:
  analyst:
    preset: universal
    overrides:
      system_prompt: |-
        You are a business analyst. Analyze requirements and identify key features. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  developer:
    preset: universal
    overrides:
      system_prompt: |-
        You are a software developer. Write code and technical documentation. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
  tester:
    preset: universal
    overrides:
      system_prompt: |-
        You are a QA tester. Create test plans and identify edge cases. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 8196
      session_id_strategy: auto
workflow:
- step: gather_requirements
  agent: analyst
  input: |
    Gather and organize the requirements for "{{var:project_name}}" and list the core features.
    Save the requirements document to {{var:output_dir}}/requirements.txt.
- step: dynamic_implementation
  agent_based:
    orchestrator:
      preset: universal
      overrides:
        system_prompt: |
          You are a project orchestrator. Based on the requirements analysis, dynamically assign development and testing tasks to team members.
          You need to: 1) assign development tasks 2) assign testing tasks 3) assess overall progress
          Use the delegateTask and delegateParallel tools to assign tasks.
          When finished, use the complete tool to report the final result.
        tool_set:
        - exit
        - skill_tools
        - file_system
        max_iterations: 8196
        session_id_strategy: per_execution
    participants:
    - developer
    - tester
    goal: |-
      Based on the requirements analysis: {{steps.gather_requirements.output}}
      Complete the assignment and execution of development and testing tasks for "{{var:project_name}}", and produce a directly presentable demo conclusion.
    max_steps: 10
    budget_tokens: 100000
    timeout_seconds: 300
  depends_on:
  - gather_requirements
- step: quick_review
  agent_based:
    orchestrator:
      preset: universal
      overrides:
        system_prompt: You are the code-review orchestrator. Dynamically assign review tasks. Use the complete tool when finished.
        session_id_strategy: per_execution
    participants:
    - analyst
    - developer
    goal: Quickly review the implementation quality of {{steps.dynamic_implementation.output}}, and produce a directly presentable demo conclusion.
    max_steps: 5
  depends_on:
  - dynamic_implementation
- step: project_summary
  agent: analyst
  input: |
    Based on the following results, generate a project summary report and save it to {{var:output_dir}}/project_summary.txt:
    Requirements: {{steps.gather_requirements.output}}
    Implementation: {{steps.dynamic_implementation.output}}
    Review: {{steps.quick_review.output}}
  depends_on:
  - quick_review
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 900s
  per_step: 300s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
