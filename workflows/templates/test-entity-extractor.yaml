---
name: test-entity-extractor
version: 1.0.0
description: Test utility-module-entity-extractor (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-entity-extractor
      inputs:
        "text": "Apple Inc. was founded by Steve Jobs in Cupertino, California on April 1, 1976."
      outputs:
        ents: entities_json
        cnt: entity_count
        status: ner_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
