---
name: test-page-change-detector
version: 1.0.0
description: Test page-change-detector — first run reports changed, second with same hash reports no change.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: first
    sub_workflow:
      name: utility-module-page-change-detector
      inputs: {url: "https://example.com", previous_hash: ""}
      outputs:
        first_changed: changed
        first_hash: new_hash
        first_status: change_status
    priority: 10
  - step: second
    sub_workflow:
      name: utility-module-page-change-detector
      inputs:
        url: "https://example.com"
        previous_hash: "{{var:first_hash}}"
      outputs:
        second_changed: changed
        second_hash: new_hash
    depends_on: [first]
    priority: 9
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_FIRST_CHANGED") != "true": problems.append("first should be changed (no prev hash)")
        if os.environ.get("WF_VAR_SECOND_CHANGED") != "false": problems.append(f"second should be unchanged, got {os.environ.get('WF_VAR_SECOND_CHANGED')}")
        if os.environ.get("WF_VAR_FIRST_HASH") != os.environ.get("WF_VAR_SECOND_HASH"):
          problems.append("hashes differ between runs")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [second]
    priority: 5
