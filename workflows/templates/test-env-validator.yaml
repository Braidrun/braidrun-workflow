---
name: test-env-validator
version: 1.0.0
description: |
  Test harness for utility-module-env-validator.

  First asserts that missing required variables produce failed status, then
  asserts that valid vars + regex pass cleanly.

translations:
  en:
    name: "Environment Validator Test"
    description: "Test harness for utility-module-env-validator. First asserts that missing required variables produce failed status, then asserts that valid vars + regex pass cleanly."
  zh:
    name: "环境验证器测试"
    description: "utility-module-env-validator 的测试夹具。先断言缺少必需变量会生成失败状态，然后断言有效变量 + 正则能顺利通过。"
  zhHant:
    name: "環境驗證器測試"
    description: "utility-module-env-validator 的測試夾具。先斷言缺少必要變數會產生失敗狀態，然後斷言有效變數 + 正則可順利通過。"
  ja:
    name: "環境バリデーターテスト"
    description: "utility-module-env-validator のテストハーネスです。まず、必須変数がないと failed ステータスになることを確認し、次に有効な変数 + 正規表現が問題なく通ることを確認します。"
  ko:
    name: "환경 검증기 테스트"
    description: "utility-module-env-validator의 테스트 하네스입니다. 먼저 필수 변수가 없으면 failed 상태가 되는지 확인한 뒤, 유효한 변수 + 정규식이 문제없이 통과하는지 확인합니다."
  es:
    name: "Prueba de validador de entorno"
    description: "Banco de pruebas para utility-module-env-validator. Primero comprueba que las variables obligatorias faltantes produzcan estado failed; luego comprueba que las variables válidas + la expresión regular pasen correctamente."
  fr:
    name: "Test du validateur d’environnement"
    description: "Banc de test pour utility-module-env-validator. Vérifie d’abord que l’absence des variables requises produit un état failed, puis que les variables valides + l’expression régulière passent sans erreur."
  de:
    name: "Umgebungsvalidator-Test"
    description: "Test-Harness für utility-module-env-validator. Zuerst wird geprüft, dass fehlende erforderliche Variablen den Status failed erzeugen, danach, dass gültige Variablen + Regex sauber bestehen."
  ar:
    name: "اختبار مدقق البيئة"
    description: "هيكل اختبار لـ utility-module-env-validator. يتحقق أولًا من أن المتغيرات المطلوبة المفقودة تُنتج الحالة failed، ثم يتحقق من أن المتغيرات الصالحة + التعبير النمطي تمرّ بنجاح."
  pt:
    name: "Teste de validador de ambiente"
    description: "Estrutura de teste para utility-module-env-validator. Primeiro verifica se variáveis obrigatórias ausentes produzem status failed; depois verifica se variáveis válidas + regex passam corretamente."
  vi:
    name: "Kiểm thử trình xác thực môi trường"
    description: "Bộ khung kiểm thử cho utility-module-env-validator. Trước hết xác nhận các biến bắt buộc bị thiếu tạo ra trạng thái failed, sau đó xác nhận các biến hợp lệ + regex vượt qua suôn sẻ."
tags:
  - code
  - extract
  - sub_workflow

agents: {}

workflow:
  - step: expect_failure
    sub_workflow:
      name: utility-module-env-validator
      inputs:
        required_vars: "__PROBABLY_UNSET_TEST_VAR_12345__"
        validation_rules_json: "{}"
        raise_on_failure: "false"
      outputs:
        fail_status: validation_status
        fail_failures_json: failures_json
    priority: 10

  - step: expect_success
    sub_workflow:
      name: utility-module-env-validator
      inputs:
        required_vars: ""
        extra_values_json: '{"API_KEY":"abcdefghijklmnopqrstuvwxyz012345","EMAIL":"alice@example.com"}'
        validation_rules_json: |
          {
            "API_KEY": {"min_length": 32},
            "EMAIL": {"regex": "^[\\w.-]+@[\\w.-]+$"}
          }
      outputs:
        ok_status: validation_status
        ok_failures_json: failures_json
    priority: 9

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import json
        import os
        import sys

        fail_status = os.environ.get("WF_VAR_FAIL_STATUS", "").strip()
        fail_failures_json = os.environ.get("WF_VAR_FAIL_FAILURES_JSON", "").strip()
        ok_status = os.environ.get("WF_VAR_OK_STATUS", "").strip()
        ok_failures_json = os.environ.get("WF_VAR_OK_FAILURES_JSON", "").strip()

        problems = []

        # 1. Missing-required case should report "failed" with >= 1 failures
        if fail_status != "failed":
            problems.append(f"expect_failure status should be 'failed', got '{fail_status}'")
        try:
            fails = json.loads(fail_failures_json or "[]")
            if not isinstance(fails, list) or len(fails) == 0:
                problems.append(f"expect_failure failures_json should be non-empty list, got: {fails}")
        except json.JSONDecodeError as e:
            problems.append(f"expect_failure failures_json invalid: {e}")

        # 2. Valid extras case should be "ok" with empty failures list
        if ok_status != "ok":
            problems.append(f"expect_success status should be 'ok', got '{ok_status}'")
        try:
            oks = json.loads(ok_failures_json or "[]")
            if oks:
                problems.append(f"expect_success failures_json should be [], got: {oks}")
        except json.JSONDecodeError as e:
            problems.append(f"expect_success failures_json invalid: {e}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - expect_failure
      - expect_success
    priority: 5
