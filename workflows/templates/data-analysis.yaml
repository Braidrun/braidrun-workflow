name: data-analysis
version: 1.0.0
description: Generic data analysis workflow for a local CSV file.
tags:
  - data
  - analysis
variables:
  input_file: data/input.csv
agents:
  analyst:
    preset: data_analyst
    overrides:
      max_iterations: 24
workflow:
  - step: inspect_dataset
    agent: analyst
    input: |
      Inspect {{var:input_file}}.
      Identify columns, row count, missing values, and useful analysis angles.
  - step: write_summary
    agent: analyst
    depends_on: [inspect_dataset]
    input: |
      Produce a concise analysis summary with assumptions, caveats, and next steps.
      Dataset inspection:
      {{steps.inspect_dataset.output}}
