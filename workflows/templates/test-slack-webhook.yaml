---
name: test-slack-webhook
version: 1.0.0
description: |
  Negative-path test for utility-module-slack-webhook.

  Verifies the module's URL validation guard rejects a URL that doesn't
  match the hooks.slack.com pattern. Uses on_failure routing so the
  sub_workflow failure is properly recovered.

