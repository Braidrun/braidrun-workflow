    description: "اختبار مسار سلبي لـ utility-module-slack-webhook. يتحقق من أن حماية التحقق من صحة URL في الوحدة ترفض عنوان URL لا يطابق نمط hooks.slack.com. يستخدم توجيه on_failure بحيث تتم معالجة فشل sub_workflow بشكل صحيح."
  pt:
    name: "Teste de webhook do Slack"
    description: "Teste de caminho negativo para utility-module-slack-webhook. Verifica se a proteção de validação de URL do módulo rejeita uma URL que não corresponde ao padrão hooks.slack.com. Usa roteamento on_failure para que a falha de sub_workflow seja recuperada corretamente."
  vi:
    name: "Kiểm thử webhook Slack"
    description: "Kiểm thử đường dẫn lỗi cho utility-module-slack-webhook. Xác minh cơ chế kiểm tra URL của mô-đun từ chối một URL không khớp mẫu hooks.slack.com. Sử dụng định tuyến on_failure để lỗi sub_workflow được khôi phục đúng cách."
tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true

agents: {}

workflow:
  - step: bad_url
    sub_workflow:
      name: utility-module-slack-webhook
      inputs:
        webhook_url: "https://not-slack.example.com/hooks/abc"
        text: "this should never be sent"
      outputs:
        bad_send_status: send_status
        bad_status_code: status_code
    on_failure:
      - next: assert
    priority: 10

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        send_status = os.environ.get("WF_VAR_BAD_SEND_STATUS", "").strip()
        status_code = os.environ.get("WF_VAR_BAD_STATUS_CODE", "").strip()

        problems = []
        if send_status != "":
            problems.append(f"send_status should be empty (module rejected URL), got '{send_status}'")
        if status_code not in ("", "0"):
            problems.append(f"status_code should be empty/0, got '{status_code}'")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass (module correctly rejected non-Slack URL)")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    priority: 5
