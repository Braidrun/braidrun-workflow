---
name: test-dingtalk-webhook
version: 1.0.0
description: Negative-path test for utility-module-dingtalk-webhook — invalid webhook URL rejected.
tags:
  - code
  - error_handling
  - extract
  - sub_workflow

error_handling:
  continue_on_error: true
agents: {}
workflow:
  - step: bad_call
    sub_workflow:
      name: utility-module-dingtalk-webhook
      inputs:
        webhook_url: "https://not-dingtalk.example.com/robot/send"
        msg_type: text
        text: "x"
      outputs:
        bad_value: send_status
    on_failure:
      - next: assert
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        v = os.environ.get("WF_VAR_BAD_VALUE", "").strip()
        if v != "":
          print("TEST_STATUS=fail"); print(f"  - got {v}"); sys.exit(1)
        print("TEST_STATUS=pass (module rejected invalid URL)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    priority: 5
