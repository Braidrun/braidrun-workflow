---
name: water-quality-monitoring-emergency
version: 3.0.0
tags:
- 水务行业
- 水质监测
- 应急响应
- 管网管理
- 多角色协作
- group_chat
- extract
- aggregate
- classifier
- condition
category: industry
description: |
  水厂水质监测与应急响应工作流，实现从在线水质异常检测、事件智能分级分类（紧急/预警/日常），到分级处置（应急预案启动、工艺参数调整、仪表维护）、多方会商和事件处置报告的完整闭环。
  真实流程：水质异常检测 → 事件分类 → 应急响应/日常处理 → 原因分析 → 措施执行 → 恢复验证 → 总结报告
  特性：classifier 事件分类、condition 条件分支、group_chat 应急会商、extract 指标提取、aggregate 报告聚合
variables:
  plant_name: 清源自来水厂
  monitoring_scope: 原水、出厂水、管网末梢
  alert_source: 在线浊度仪异常报警
  turbidity_limit: '1'
  chlorine_limit_low: '0.05'
  chlorine_limit_high: '4.0'
  output_dir: "./output/water-quality-monitoring-emergency"
  demo_mode: 'true'
variable_tags:
  alert_source: '通知'
  chlorine_limit_high: '业务参数'
  chlorine_limit_low: '业务参数'
  demo_mode: '运行模式'
  monitoring_scope: '业务参数'
  output_dir: '输出'
  plant_name: '业务参数'
  turbidity_limit: '业务参数'
agents:
  monitoring_analyst:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位水质在线监测分析师，负责 24 小时监控水厂和管网水质数据。
        你精通各类在线水质分析仪（浊度仪、余氯仪、pH 计、COD 分析仪等）的数据解读。
        你能快速识别水质异常趋势并判断是仪表故障还是真实水质问题。

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  emergency_commander:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位水务应急指挥专家，负责水质突发事件的应急响应和指挥调度。
        你精通《城市供水水质应急预案》和应急响应等级划分标准。
        你能快速组织应急团队、制定处置方案和协调各方资源。

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  process_operator:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位水厂工艺运行操作员，负责根据水质异常情况调整水处理工艺参数。
        你熟悉混凝剂投加量调整、消毒剂量变更、滤池强制反冲洗等应急操作。
        你了解各工艺单元的应急操作规程和安全注意事项。

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  network_engineer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位管网运维工程师，负责供水管网的监测、维护和应急抢修。
        你熟悉管网水力模型、管网末梢水质变化规律和二次供水设施管理。
        你了解管网冲洗、排气、调压等日常维护操作。

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  classifier_agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位水质事件分类专家，负责对水质异常事件进行分级分类。
        你根据水质偏离程度、影响范围和持续时间判断事件等级。
        分类规则：
        - emergency：水质严重超标（浊度>5NTU 或余氯<0.05mg/L）或大面积影响
        - warning：水质轻度超标或局部异常
        - routine：仪表偏差、轻微波动或定期维护需求

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
  report_writer:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位水务报告撰写专家，负责编写水质监测报告和应急事件报告。
        你精通水务行业报告格式和规范，能将技术数据转化为清晰的管理报告。

        共同要求：
        - 该模板以"可直接运行演示"为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
workflow:
- step: anomaly-detection
  agent: monitoring_analyst
  input: |
    对「{{var:plant_name}}」的水质监测数据进行异常分析：
    监测范围：{{var:monitoring_scope}}
    报警来源：{{var:alert_source}}
    浊度限值：{{var:turbidity_limit}} NTU
    余氯限值：{{var:chlorine_limit_low}}-{{var:chlorine_limit_high}} mg/L
    1. 核实报警数据的准确性（排除仪表故障）。
    2. 查看近 24 小时水质趋势数据。
    3. 对比原水、出厂水、管网各监测点数据。
    4. 评估异常的严重程度和影响范围。
    5. 初步判断异常原因（水源污染/工艺故障/管网问题/仪表故障）。
    输出必须包含：
    - anomaly_type=水源污染/工艺故障/管网问题/仪表故障（异常类型）
    - severity_level=high/medium/low（严重程度）
    - affected_area=N（影响区域数量）
    - current_turbidity=N（当前浊度 NTU）
    - current_chlorine=N（当前余氯 mg/L）
    输出到：anomaly-detection-report.md
  extract:
  - pattern: anomaly_type=(\S+)
    variable: anomaly_type
  - pattern: severity_level=(\w+)
    variable: severity_level
  - pattern: affected_area=(\d+)
    variable: affected_area
  - pattern: current_turbidity=([\d.]+)
    variable: current_turbidity
  - pattern: current_chlorine=([\d.]+)
    variable: current_chlorine
  priority: 10
- step: event-classification
  classifier:
    agent: classifier_agent
    input: |-
      请对以下水质异常事件进行分类：
      异常检测报告：{{steps.anomaly-detection.output}}
      异常类型：{{var:anomaly_type}}
      严重程度：{{var:severity_level}}
      影响区域：{{var:affected_area}} 个
      当前浊度：{{var:current_turbidity}} NTU（限值 {{var:turbidity_limit}} NTU）
      当前余氯：{{var:current_chlorine}} mg/L（限值 {{var:chlorine_limit_low}}-{{var:chlorine_limit_high}} mg/L）
    categories:
    - name: emergency
      description: 水质严重超标或大面积影响，需立即启动应急预案
    - name: warning
      description: 水质轻度超标或局部异常，需加强监测和调整工艺
    - name: routine
      description: 仪表偏差或轻微波动，按日常维护流程处理
    output_variable: event_category
    default_category: warning
  depends_on:
  - anomaly-detection
  priority: 9
- step: emergency-response
  agent: emergency_commander
  condition: event_category == 'emergency'
  input: |
    启动水质应急响应预案：
    事件分类：紧急（emergency）
    异常详情：{{steps.anomaly-detection.output}}
    1. 启动应急响应等级（Ⅰ/Ⅱ/Ⅲ级）。
    2. 通知应急响应团队和上级主管部门。
    3. 评估是否需要停水或切换备用水源。
    4. 制定应急供水保障方案（送水车调度）。
    5. 发布用户通知和舆情应对方案。
    6. 制定水质恢复时间表。
    输出必须包含：
    - response_level=N（应急响应等级 1-3）
    - estimated_recovery_hours=N（预计恢复时间 小时）
    输出到：emergency-response.md

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/emergency-response.md。
  extract:
  - pattern: response_level=(\d+)
    variable: response_level
  - pattern: estimated_recovery_hours=(\d+)
    variable: estimated_recovery_hours
  depends_on:
  - event-classification
  priority: 8
- step: warning-handling
  agent: process_operator
  condition: event_category == 'warning'
  input: |
    处理水质预警事件：
    事件分类：预警（warning）
    异常详情：{{steps.anomaly-detection.output}}
    1. 加强水质监测频率（每 15 分钟采样一次）。
    2. 根据异常类型调整工艺参数：
       - 浊度偏高：增加混凝剂投加量、缩短滤池反冲洗周期
       - 余氯偏低：增加加氯量、检查加氯设备
       - pH 异常：调整石灰/CO2 投加量
    3. 通知值班负责人和相关技术人员。
    4. 持续跟踪水质变化趋势。
    输出必须包含：
    - adjustment_count=N（参数调整次数）
    - monitoring_interval=N（监测间隔 分钟）
    输出到：warning-handling.md

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/warning-handling.md。
  extract:
  - pattern: adjustment_count=(\d+)
    variable: adjustment_count
  - pattern: monitoring_interval=(\d+)
    variable: monitoring_interval
  depends_on:
  - event-classification
  priority: 8
- step: routine-maintenance
  agent: process_operator
  condition: event_category == 'routine'
  input: |
    执行日常维护处理：
    事件分类：日常（routine）
    异常详情：{{steps.anomaly-detection.output}}
    1. 检查相关仪表是否需要校准或维护。
    2. 清洗取样管路和传感器探头。
    3. 对比在线数据与实验室化验数据。
    4. 更新仪表维护记录。
    5. 如确认为仪表故障，安排维修或更换。
    输出必须包含：
    - maintenance_items=N（维护项目数）
    - instrument_calibrated=true/false（是否校准仪表）
    输出到：routine-maintenance.md

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/routine-maintenance.md。
  extract:
  - pattern: maintenance_items=(\d+)
    variable: maintenance_items
  - pattern: instrument_calibrated=(\w+)
    variable: instrument_calibrated
  depends_on:
  - event-classification
  priority: 8
- step: emergency-consultation
  group_chat:
    participants:
    - emergency_commander
    - monitoring_analyst
    - process_operator
    - network_engineer
    initial_message: |-
      水质事件会商会议。请根据事件处置情况进行讨论：
      事件分类：{{var:event_category}}
      异常检测：{{steps.anomaly-detection.output}}
      处置情况：
      {{steps.emergency-response.output}}
      {{steps.warning-handling.output}}
      {{steps.routine-maintenance.output}}
      讨论重点：
      1. 事件根本原因分析
      2. 当前处置措施是否有效
      3. 是否需要升级或降级响应等级
      4. 管网侧是否需要配合冲洗或调度
      5. 后续监测和预防措施
      讨论完毕请说 CONSULTATION_DONE

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: CONSULTATION_DONE
  depends_on:
  - emergency-response
  - warning-handling
  - routine-maintenance
  priority: 6
- step: aggregate-event-info
  agent: report_writer
  input: |-
    请整理水质事件各环节的信息：
    {{var:event_summary}}

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/aggregate-event-info.md。
  aggregate:
    sources:
    - |-
      异常检测：类型={{var:anomaly_type}}, 严重度={{var:severity_level}}, 浊度={{var:current_turbidity}} NTU
      详情：{{steps.anomaly-detection.output}}
    - |-
      事件分类：{{var:event_category}}
      详情：{{steps.event-classification.output}}
    - |-
      会商结论：
      详情：{{steps.emergency-consultation.output}}
    strategy: numbered_list
    output_variable: event_summary
  depends_on:
  - emergency-consultation
  priority: 4
- step: final-event-report
  agent: report_writer
  input: |
    生成「{{var:plant_name}}」水质事件处置报告：
    1. 事件概况：{{var:alert_source}}
    2. 全过程汇总：{{steps.aggregate-event-info.output}}
    3. 会商结论：{{steps.emergency-consultation.output}}
    4. 事件时间线（发现→研判→处置→恢复）
    5. 经验教训和改进建议
    6. 预防措施和监测方案优化
    保存到 event-report.md
  depends_on:
  - aggregate-event-info
  priority: 1
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 3600s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
