---
name: test-sleep
version: 1.0.0
description: Test sleep — fixed 1 second.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: start
    code:
      language: python
      timeout: 5
      script: |
        import time
        print(f"t0={time.monotonic()}")
    extract:
      - {pattern: 't0=([\d.]+)', variable: t0}
    priority: 20
  - step: wait
    sub_workflow:
      name: utility-module-sleep
      inputs: {mode: fixed, seconds: "1"}
      outputs:
        waited: waited_seconds
        status: sleep_status
    depends_on: [start]
    priority: 15
  - step: assert
    code:
      language: python
      timeout: 5
      script: |
        import os, sys, time
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        w = float(os.environ.get("WF_VAR_WAITED", "0") or "0")
        if w < 0.8 or w > 1.3: problems.append(f"waited={w} (expected ~1)")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [wait]
    priority: 5
