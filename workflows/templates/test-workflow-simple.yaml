  fr:
    name: "Test de flux de travail simple"
    description: "Modèle de flux de travail de test - utilise un modèle prédéfini et une configuration LLM personnalisée"
  de:
    name: "Einfacher Workflow-Test"
    description: "Test-Workflow-Vorlage - verwendet eine voreingestellte Vorlage plus eine benutzerdefinierte LLM-Konfiguration"
  ar:
    name: "اختبار سير عمل بسيط"
    description: "قالب سير عمل للاختبار - يستخدم قالبًا مُسبق الإعداد مع إعداد LLM مخصص"
  pt:
    name: "Teste de fluxo de trabalho simples"
    description: "Modelo de fluxo de trabalho de teste - usa um modelo predefinido mais uma configuração personalizada de LLM"
  vi:
    name: "Kiểm thử quy trình làm việc đơn giản"
    description: "Mẫu quy trình làm việc kiểm thử - dùng mẫu có sẵn cùng cấu hình LLM tùy chỉnh"
variables:
  output_dir: "./output/test-workflow-simple"
  demo_mode: 'true'
agents:
  writer:
    preset: writer
    description: "Handles content and report writing responsibilities in this test workflow."
    translations:
      en:
        description: "Handles content and report writing responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的内容和报告写作职责。"
      zhHant:
        description: "負責此測試工作流程中的內容與報告撰寫職責。"
      ja:
        description: "このテストワークフローでコンテンツとレポートの作成を担当します。"
      ko:
        description: "이 테스트 워크플로에서 콘텐츠 및 보고서 작성 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de redacción de contenidos e informes en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de rédaction de contenus et de rapports dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Erstellung von Inhalten und Berichten."
      ar:
        description: "يتولى مسؤوليات كتابة المحتوى والتقارير في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de redação de conteúdo e relatórios neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò viết nội dung và báo cáo trong workflow kiểm thử này."
    overrides:
      name: Content Writer Agent
      system_prompt: |-
        You are a creative writer. Generate content based on the given topic.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.7
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
  reviewer:
    preset: researcher
    description: "Handles quality review responsibilities in this test workflow."
    translations:
      en:
        description: "Handles quality review responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的质量审查职责。"
      zhHant:
        description: "負責此測試工作流程中的品質審查職責。"
      ja:
        description: "このテストワークフローで品質レビューを担当します。"
      ko:
        description: "이 테스트 워크플로에서 품질 검토 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de revisión de calidad en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de revue qualité dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Qualitätsprüfung."
      ar:
        description: "يتولى مسؤوليات مراجعة الجودة في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de revisão de qualidade neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò đánh giá chất lượng trong workflow kiểm thử này."
    overrides:
      name: Content Reviewer Agent
      system_prompt: |-
        You are a content reviewer. Analyze content quality, check grammar, and provide feedback.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.5
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
  editor:
    preset: writer
    description: "Handles content editing responsibilities in this test workflow."
    translations:
      en:
        description: "Handles content editing responsibilities in this test workflow."
      zh:
        description: "负责此测试工作流中的内容编辑职责。"
      zhHant:
        description: "負責此測試工作流程中的內容編輯職責。"
      ja:
        description: "このテストワークフローでコンテンツ編集を担当します。"
      ko:
        description: "이 테스트 워크플로에서 콘텐츠 편집 역할을 담당합니다."
      es:
        description: "Se encarga de las responsabilidades de edición de contenidos en este flujo de trabajo de prueba."
      fr:
        description: "Prend en charge les responsabilités de révision de contenu dans ce workflow de test."
      de:
        description: "Übernimmt in diesem Test-Workflow die Verantwortung für Inhaltsbearbeitung."
      ar:
        description: "يتولى مسؤوليات تحرير المحتوى في سير عمل الاختبار هذا."
      pt:
        description: "Cuida das responsabilidades de edição de conteúdo neste workflow de teste."
      vi:
        description: "Đảm nhiệm vai trò biên tập nội dung trong workflow kiểm thử này."
    overrides:
      name: Content Editor Agent
      system_prompt: |-
        You are an editor. Improve content based on review feedback.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.6
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
workflow:
- step: generate_content
  agent: writer
  input: |-
    Write a short article (200-300 words) about the benefits of artificial intelligence in software development.
    Save the article to ./output/draft_article.txt

    Make sure to:
    1. Create the output directory if it doesn't exist
    2. Write clear, engaging content
    3. Call exit when done

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/generate_content.md.
- step: review_content
  agent: reviewer
  depends_on:
  - generate_content
  input: |-
    Review the article in ./output/draft_article.txt

    Provide feedback on:
    1. Content quality and clarity
    2. Grammar and style
    3. Structure and flow
    4. Suggestions for improvement

    Save your review to ./output/review_feedback.txt
    Call exit when done

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/review_content.md.
- step: revise_content
  agent: editor
  depends_on:
  - review_content
  input: |-
    Read the original article from ./output/draft_article.txt and the review feedback from ./output/review_feedback.txt

    Create an improved version:
    1. Address all feedback points
    2. Enhance clarity and readability
    3. Save the final version to ./output/final_article.txt
    4. Create a summary report in ./output/summary.txt explaining what changes were made

    Call exit when complete

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/revise_content.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1800s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
