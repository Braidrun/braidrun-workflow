---
name: test-workflow-simple
version: 1.0.0
tags:
- 测试
- 简单工作流
description: 测试工作流模板 - 使用预设模板 + 自定义 LLM 配置
variables:
  output_dir: "./output/test-workflow-simple"
  demo_mode: 'true'
agents:
  writer:
    preset: writer
    overrides:
      name: 内容写作 Agent
      system_prompt: |-
        You are a creative writer. Generate content based on the given topic.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.7
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
  reviewer:
    preset: researcher
    overrides:
      name: 内容审阅 Agent
      system_prompt: |-
        You are a content reviewer. Analyze content quality, check grammar, and provide feedback.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.5
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
  editor:
    preset: writer
    overrides:
      name: 内容编辑 Agent
      system_prompt: |-
        You are an editor. Improve content based on review feedback.

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      tool_set:
      - file_system
      - exit
      - skill_tools
      llm_config:
        models:
        - model: minimax-m2.7
          provider: xai
        temperature: 0.6
      max_iterations: 8196
      show_reasoning: true
      cache_policy: file
      file_cache_storage: ".prompt_cache"
      history_enabled: true
      history_max_messages: 50
      session_id_strategy: auto
workflow:
- step: generate_content
  agent: writer
  input: |-
    Write a short article (200-300 words) about the benefits of artificial intelligence in software development.
    Save the article to ./output/draft_article.txt

    Make sure to:
    1. Create the output directory if it doesn't exist
    2. Write clear, engaging content
    3. Call exit when done

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/generate_content.md。
- step: review_content
  agent: reviewer
  depends_on:
  - generate_content
  input: |-
    Review the article in ./output/draft_article.txt

    Provide feedback on:
    1. Content quality and clarity
    2. Grammar and style
    3. Structure and flow
    4. Suggestions for improvement

    Save your review to ./output/review_feedback.txt
    Call exit when done

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/review_content.md。
- step: revise_content
  agent: editor
  depends_on:
  - review_content
  input: |-
    Read the original article from ./output/draft_article.txt and the review feedback from ./output/review_feedback.txt

    Create an improved version:
    1. Address all feedback points
    2. Enhance clarity and readability
    3. Save the final version to ./output/final_article.txt
    4. Create a summary report in ./output/summary.txt explaining what changes were made

    Call exit when complete

    演示约束：如果缺少外部依赖，请直接产出可展示的 demo 版本结果；如适合，请同时保存到 {{var:output_dir}}/revise_content.md。
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 1800s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
