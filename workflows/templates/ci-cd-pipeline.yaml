name: ci-cd-pipeline
version: 1.0.0
description: Generic CI workflow that validates a repository build and test command.
tags:
  - devops
  - ci
variables:
  build_command: ./gradlew classes
  test_command: ./gradlew test
agents:
  devops:
    preset: devops
workflow:
  - step: build
    code:
      language: bash
      script: |
        set -euo pipefail
        {{var:build_command}}
  - step: test
    depends_on: [build]
    code:
      language: bash
      script: |
        set -euo pipefail
        {{var:test_command}}
  - step: summarize
    agent: devops
    depends_on: [test]
    input: |
      Summarize the CI result and list any follow-up actions.
