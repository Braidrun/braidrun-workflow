---
name: test-yaml-transform
version: 1.0.0
description: Test yaml-transform — modify k8s-like YAML via set/merge/delete ops.
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-yaml-transform
      inputs:
        input_yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: demo\nspec:\n  replicas: 1\n"
        operations_json: '[{"op":"set","path":"spec.replicas","value":5},{"op":"merge","value":{"metadata":{"labels":{"env":"prod"}}}}]'
        output_format: yaml
      outputs:
        out_text: output_text
        out_status: yaml_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        text = os.environ.get("WF_VAR_OUT_TEXT", "")
        status = os.environ.get("WF_VAR_OUT_STATUS", "").strip()
        problems = []
        if status != "ok": problems.append(f"status={status}")
        if "replicas: 5" not in text: problems.append(f"replicas=5 not in output: {text[:500]}")
        if "env: prod" not in text: problems.append(f"env: prod not in output")
        if problems:
          print("TEST_STATUS=fail")
          for p in problems: print(f"  - {p}")
          sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
