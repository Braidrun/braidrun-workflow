---
name: test-yaml-transform
version: 1.0.0
description: Test yaml-transform — modify k8s-like YAML via set/merge/delete ops.
translations:
  en:
    name: "YAML Transform Test"
    description: "Test yaml-transform — modify k8s-like YAML via set/merge/delete ops."
  zh:
    name: "YAML 转换测试"
    description: "测试 yaml-transform — 通过 set/merge/delete 操作修改类似 k8s 的 YAML。"
  zhHant:
    name: "YAML 轉換測試"
    description: "測試 yaml-transform — 透過 set/merge/delete 操作修改類似 k8s 的 YAML。"
  ja:
    name: "YAML 変換テスト"
    description: "テスト yaml-transform — set/merge/delete 操作で k8s-like YAML を変更します。"
  ko:
    name: "YAML 변환 테스트"
    description: "테스트 yaml-transform — set/merge/delete 작업으로 k8s-like YAML을 수정합니다."
  es:
    name: "Prueba de transformación YAML"
    description: "Prueba yaml-transform — modifica YAML similar a k8s mediante operaciones set/merge/delete."
  fr:
    name: "Test de transformation YAML"
    description: "Test yaml-transform — modifie un YAML de type k8s via les opérations set/merge/delete."
  de:
    name: "YAML-Transform-Test"
    description: "Test yaml-transform — verändert k8s-like YAML per set/merge/delete-Operationen."
  ar:
    name: "اختبار تحويل YAML"
    description: "اختبار yaml-transform — يعدّل YAML شبيهًا بـ k8s عبر عمليات set/merge/delete."
  pt:
    name: "Teste de transformação YAML"
    description: "Teste yaml-transform — modifica YAML semelhante a k8s por meio de operações set/merge/delete."
  vi:
    name: "Kiểm thử chuyển đổi YAML"
    description: "Kiểm thử yaml-transform — sửa đổi YAML kiểu k8s bằng các thao tác set/merge/delete."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-yaml-transform
      inputs:
        input_yaml: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: demo\nspec:\n  replicas: 1\n"
        operations_json: '[{"op":"set","path":"spec.replicas","value":5},{"op":"merge","value":{"metadata":{"labels":{"env":"prod"}}}}]'
        output_format: yaml
      outputs:
        out_text: output_text
        out_status: yaml_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        text = os.environ.get("WF_VAR_OUT_TEXT", "")
        status = os.environ.get("WF_VAR_OUT_STATUS", "").strip()
        problems = []
        if status != "ok": problems.append(f"status={status}")
        if "replicas: 5" not in text: problems.append(f"replicas=5 not in output: {text[:500]}")
        if "env: prod" not in text: problems.append(f"env: prod not in output")
        if problems:
          print("TEST_STATUS=fail")
          for p in problems: print(f"  - {p}")
          sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
