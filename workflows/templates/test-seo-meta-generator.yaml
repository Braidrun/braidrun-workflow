  ja:
    name: "SEOメタ生成器テスト"
    description: "utility-module-seo-meta-generator のテスト（LLM、OPENROUTER_API_KEY が必要）。"
  ko:
    name: "SEO 메타 생성기 테스트"
    description: "utility-module-seo-meta-generator 테스트(LLM, OPENROUTER_API_KEY 필요)."
  es:
    name: "Prueba de generador de metadatos SEO"
    description: "Prueba de utility-module-seo-meta-generator (LLM, requiere OPENROUTER_API_KEY)."
  fr:
    name: "Test du générateur de métadonnées SEO"
    description: "Test de utility-module-seo-meta-generator (LLM, nécessite OPENROUTER_API_KEY)."
  de:
    name: "SEO-Metadaten-Generator-Test"
    description: "Test von utility-module-seo-meta-generator (LLM, benötigt OPENROUTER_API_KEY)."
  ar:
    name: "اختبار مولّد بيانات SEO الوصفية"
    description: "اختبار utility-module-seo-meta-generator (LLM، يتطلب OPENROUTER_API_KEY)."
  pt:
    name: "Teste do gerador de metadados de SEO"
    description: "Teste de utility-module-seo-meta-generator (LLM, requer OPENROUTER_API_KEY)."
  vi:
    name: "Kiểm thử trình tạo siêu dữ liệu SEO"
    description: "Kiểm thử utility-module-seo-meta-generator (LLM, cần OPENROUTER_API_KEY)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-seo-meta-generator
      inputs:
        "content": "Braidrun is an AI agent platform for subscription management and Apple Search Ads optimization, built on Kotlin and Vue."
        target_keyword: "AI agent platform"
      outputs:
        t: title
        desc: description
        status: seo_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
