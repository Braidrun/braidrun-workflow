version: 1.0.0
description: Test utility-module-seo-meta-generator (LLM, needs OPENROUTER_API_KEY).
translations:
  en:
    name: "SEO Meta Generator Test"
    description: "Test utility-module-seo-meta-generator (LLM, needs OPENROUTER_API_KEY)."
  zh:
