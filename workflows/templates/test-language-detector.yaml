---
name: test-language-detector
version: 1.0.0
description: Test utility-module-language-detector (LLM, needs OPENROUTER_API_KEY).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-language-detector
      inputs:
        "text": "这是一段完全由简体中文组成的测试文本,用于检测语言识别能力。"
      outputs:
        lang: language
        lname: language_name
        scr: script
        status: lang_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        status = os.environ.get("WF_VAR_STATUS", "")
        if status != "ok": problems.append(f"status={status}")
        val = os.environ.get("WF_VAR_LANG", "").strip().lower()
        if "zh" not in val:
            problems.append(f"WF_VAR_LANG does not contain 'zh', got " + val)
        if problems:
            print("TEST_STATUS=fail")
            [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
