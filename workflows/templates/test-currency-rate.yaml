---
name: test-currency-rate
version: 1.0.0
description: Test currency-rate USD→EUR conversion via open-er-api.
translations:
  en:
    name: "Currency Rate Test"
    description: "Test currency-rate USD→EUR conversion via open-er-api."
  zh:
    name: "汇率测试"
    description: "通过 open-er-api 测试 USD→EUR 转换。"
  zhHant:
    name: "匯率測試"
    description: "透過 open-er-api 測試 USD→EUR 轉換。"
  ja:
    name: "為替レートテスト"
    description: "open-er-api を介した USD→EUR 変換をテストします。"
  ko:
    name: "환율 테스트"
    description: "open-er-api를 통해 USD→EUR 변환을 테스트합니다."
  es:
    name: "Prueba de tipo de cambio"
    description: "Prueba la conversión USD→EUR mediante open-er-api."
  fr:
    name: "Test de taux de change"
    description: "Teste la conversion USD→EUR via open-er-api."
  de:
    name: "Wechselkurs Test"
    description: "Testet die USD→EUR-Konvertierung über open-er-api."
  ar:
    name: "اختبار سعر الصرف"
    description: "اختبار تحويل USD→EUR عبر open-er-api."
  pt:
    name: "Teste de taxa de câmbio"
    description: "Testa a conversão USD→EUR via open-er-api."
  vi:
    name: "Kiểm thử tỷ giá"
    description: "Kiểm thử chuyển đổi USD→EUR qua open-er-api."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-currency-rate
      inputs: {from_currency: "USD", to_currency: "EUR", amount: "100"}
      outputs:
        conv: converted_amount
        rate: rate
        base: base
        status: currency_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status")
        if os.environ.get("WF_VAR_BASE") != "USD": problems.append(f"base={os.environ.get('WF_VAR_BASE')}")
        rate = float(os.environ.get("WF_VAR_RATE", "0") or "0")
        if rate < 0.5 or rate > 1.5: problems.append(f"USD/EUR rate unreasonable: {rate}")
        conv = float(os.environ.get("WF_VAR_CONV", "0") or "0")
        if abs(conv - rate * 100) > 0.5: problems.append(f"100 USD conv {conv} != 100*rate")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print(f"TEST_STATUS=pass (1 USD = {rate} EUR)")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
