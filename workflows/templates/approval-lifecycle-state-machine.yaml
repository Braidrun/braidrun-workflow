name: approval-lifecycle-state-machine
version: 1.0.0
description: Generic approval workflow with a human review gate.
tags:
  - approval
  - governance
agents:
  operator:
    preset: universal
workflow:
  - step: prepare_change
    agent: operator
    input: "Prepare a concise change proposal with risks and rollback notes."
  - step: approval_gate
    agent: operator
    depends_on: [prepare_change]
    input: "Wait for approval before continuing. Proposal: {{steps.prepare_change.output}}"
    manual_approval:
      enabled: true
      approvers: [admin]
      timeout: 3600
      approval_message: "Approve this workflow change before execution continues."
  - step: execution_plan
    agent: operator
    depends_on: [approval_gate]
    input: "Create the execution plan after approval."
