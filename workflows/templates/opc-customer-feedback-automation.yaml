---
name: opc-customer-feedback-automation
version: 3.0.0
tags:
- 客户反馈
- 一人公司
- 客户服务
- 多角色协作
- 迭代优化
- 智能路由
- group_chat
- repeat_until
- extract
- classifier
- condition
category: marketing
description: |
  "一人公司" (OPC) 自动化客户支持与反馈闭环工作流。
  从反馈收集到产品路线图对齐的客户声音闭环管理：反馈情感分析与分类 → 团队讨论与优先级排序 → 客服回复起草 → 迭代优化 → 产品路线图对齐与更新。
  适用场景：独立产品的客户反馈处理自动化，包括多渠道反馈分类、标准化客服回复、Bug 跟进和需求优先级管理。
  特性：extract 结构化指标提取、group_chat 反馈讨论、repeat_until 回复质量迭代
variables:
  customer_feedback_source: 请粘贴来自工单系统、邮件、或社群讨论的原始客户反馈内容
  product_version: v1.2.0
  current_roadmap: 1. 增加 AI 总结功能；2. 优化加载速度；3. 适配手机端
  quality_threshold: '8'
  output_dir: "./output/opc-customer-feedback-automation"
  demo_mode: 'true'
variable_tags:
  current_roadmap: '业务参数'
  customer_feedback_source: '业务参数'
  demo_mode: '运行模式'
  output_dir: '输出'
  product_version: '业务参数'
  quality_threshold: '业务参数'
agents:
  feedback_classifier:
    preset: researcher
    overrides:
      system_prompt: |-
        你是一位客户反馈分析专家，擅长情感分析、问题分类和优先级判断。
        你能从用户反馈中提取可操作的产品洞察。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  support_writer:
    preset: writer
    overrides:
      system_prompt: |-
        你是一位客户支持文案专家，擅长撰写专业、有温度的客服回复。
        你的回复既能解决用户问题，又能提升品牌好感度。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  product_advisor:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位产品顾问，擅长将用户反馈转化为产品路线图建议。
        你能判断反馈的优先级，对齐现有路线图。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: per_execution
  quality_reviewer:
    preset: universal
    overrides:
      system_prompt: |-
        你是一位客户支持质量评审专家。评分维度：分类准确性(25%)、回复质量(25%)、用户体验(25%)、产品洞察(25%)。
        输出格式必须包含：quality_score=N（1-10 分）。

        共同要求：
        - 该模板以“可直接运行演示”为第一目标。
        - 如果缺少实时数据、外部账号、API 凭证或目标系统访问权，必须基于当前输入、工作流上下文和合理假设继续完成，不得停在索取外部依赖。
        - 优先产出自包含、可展示、可复用的 demo 版本结果，并在适合时落盘到工作区文件。
      session_id_strategy: auto
workflow:
- step: sentiment-and-classification
  agent: feedback_classifier
  input: |
    对以下客户反馈进行分类分析：
    {{var:customer_feedback_source}}
    产品版本：{{var:product_version}}

    1. 情感分析（正面/中性/负面/紧急），为每条反馈标注情感标签和置信度。
    2. 问题分类（Bug/功能需求/使用疑问/投诉/建议），为每条反馈标注分类标签。
    3. 优先级排序（P0 紧急/P1 高/P2 中/P3 低），基于影响面和严重程度。
    4. 关键洞察提炼：
       - 高频问题 Top 5（出现次数和影响用户数估算）
       - 情感趋势（与上版本对比的满意度变化方向）
       - 潜在流失风险用户识别
    5. 反馈汇总表格（渠道/分类/情感/优先级/状态）。

    输出必须包含以下格式化指标：
    - feedback_channels=N（反馈渠道数）
    - monthly_feedback=N（月反馈量）
    输出到：feedback-classification.md
  extract:
  - pattern: feedback_channels=(\d+)
    variable: feedback_channels
  - pattern: monthly_feedback=(\d+)
    variable: monthly_feedback
  priority: 10
- step: feedback-discussion
  group_chat:
    participants:
    - feedback_classifier
    - support_writer
    - product_advisor
    initial_message: |-
      反馈讨论会。请审查：{{steps.sentiment-and-classification.output}}
      当前路线图：{{var:current_roadmap}}
      讨论重点：
      1. 哪些是紧急需回复的？优先级是否正确？
      2. Bug 类反馈需要什么临时方案？
      3. 哪些反馈可以影响路线图？
      4. 回复策略和统一口径？
      讨论完毕后请说 PLAN_SET

      讨论结束时请给出一段可复用的结论摘要，便于后续步骤直接保存为 demo 交付物。
    max_rounds: 4
    speaker_selection: round_robin
    termination_keyword: PLAN_SET
  depends_on:
  - sentiment-and-classification
  priority: 8
- step: drafting-support-responses
  agent: support_writer
  input: |
    基于讨论共识起草客服回复：{{steps.feedback-discussion.output}}
    上次评估反馈（如有）：{{steps.drafting-support-responses:evaluate.output}}

    为每条需回复的反馈撰写：
    1. 个性化回复（引用用户具体描述，避免模板感，体现品牌温度）。
    2. 解决方案或临时方案（针对 Bug 提供 Workaround，针对需求说明规划）。
    3. 后续跟进承诺（明确时间节点，如"我们将在下个版本修复"）。
    4. FAQ 更新建议（哪些高频问题应加入 FAQ 文档，附建议的问答内容）。
    5. 回复语气标准：专业但不冷漠，承认问题但不过度道歉，给出方案但不过度承诺。

    输出到：support-responses.md
  depends_on:
  - feedback-discussion
  priority: 6
  repeat_until:
    condition: quality_score >= 8
    max_iterations: 3
    evaluate_agent: quality_reviewer
    evaluate_prompt: |
      评估以下客服回复。评分维度：分类准确性(25%)、回复质量(25%)、用户体验(25%)、产品洞察(25%)。
      输出格式：quality_score=N（1-10 分）
      回复：{{steps.drafting-support-responses.output}}
    extract_pattern: quality_score=(\d+)
    extract_variable: quality_score
- step: roadmap-alignment
  agent: product_advisor
  input: |
    反馈路线图对齐（质量评分 {{var:quality_score}}）：
    反馈：{{steps.sentiment-and-classification.output}}
    当前路线图：{{var:current_roadmap}}

    1. 需要新增/调整的路线图项（每项标注来源反馈数量和影响面评估）。
    2. 反馈驱动的优先级变化（哪些现有路线图项应提前/推迟/取消，附理由）。
    3. 下个版本的改进建议（按 P0/P1/P2 排列，含预估工作量）。
    4. 反馈自动化流程优化建议（哪些回复可以模板化、哪些分类可以自动化）。
    5. 用户沟通计划（如何向用户同步产品改进进展，提升用户信任感）。

    输出到：roadmap-alignment.md
  depends_on:
  - drafting-support-responses
  priority: 4
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: false
timeout:
  total: 2400s
  per_step: 600s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        你是工作流模板助手，负责帮助用户理解、调试和演示当前工作流。
        生成或修改 YAML 时必须使用 braidrun-agent 的 snake_case 语法，并优先保持模板可直接运行。
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
