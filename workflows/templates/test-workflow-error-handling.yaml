---
name: test-workflow-error-handling
version: 1.0.0
tags:
- test
- error-handling
- error_handling
- retry
description: Error handling and retry test - tests failure recovery, retry mechanisms, and error propagation
translations:
  en:
    name: "Workflow Error Handling Test"
    description: "Error handling and retry test - tests failure recovery, retry mechanisms, and error propagation"
  zh:
    name: "工作流错误处理测试"
    description: "错误处理与重试测试 - 测试失败恢复、重试机制和错误传播。"
  zhHant:
    name: "工作流錯誤處理測試"
    description: "錯誤處理與重試測試 - 測試失敗恢復、重試機制和錯誤傳播。"
  ja:
    name: "ワークフローエラーハンドリングテスト"
    description: "エラー処理と再試行のテスト - 失敗の復旧、再試行メカニズム、エラー伝播をテストします。"
  ko:
    name: "워크플로 오류 처리 테스트"
    description: "오류 처리 및 재시도 테스트 - 실패 복구, 재시도 메커니즘, 오류 전파를 테스트합니다."
  es:
    name: "Prueba de manejo de errores de flujo de trabajo"
    description: "Prueba de manejo de errores y reintentos: prueba la recuperación ante fallos, los mecanismos de reintento y la propagación de errores."
  fr:
    name: "Test de gestion des erreurs de workflow"
    description: "Test de gestion des erreurs et de reprise - teste la récupération après échec, les mécanismes de relance et la propagation des erreurs."
  de:
    name: "Workflow-Fehlerbehandlungstest"
    description: "Test der Fehlerbehandlung und Wiederholungsversuche - testet die Wiederherstellung nach Fehlern, Wiederholungsmechanismen und die Fehlerweitergabe."
  ar:
    name: "اختبار معالجة أخطاء سير العمل"
    description: "اختبار معالجة الأخطاء وإعادة المحاولة - يختبر استعادة الفشل وآليات إعادة المحاولة ونشر الأخطاء."
  pt:
    name: "Teste de tratamento de erros de fluxo de trabalho"
    description: "Teste de tratamento de erros e repetição - testa a recuperação de falhas, os mecanismos de repetição e a propagação de erros."
  vi:
    name: "Kiểm thử xử lý lỗi quy trình làm việc"
    description: "Kiểm thử xử lý lỗi và thử lại - kiểm thử khôi phục khi thất bại, cơ chế thử lại và lan truyền lỗi."
variables:
  output_dir: "./output"
  demo_mode: 'true'
agents:
  worker:
    preset: universal
    overrides:
      system_prompt: |-
        You are a precise assistant. Follow instructions exactly. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      - shell
      max_iterations: 100
      session_id_strategy: auto
  fallback_worker:
    preset: universal
    overrides:
      system_prompt: |-
        You are a fallback assistant. Handle errors gracefully. Call exit when done.

        Common requirements:
        - The template's first goal is to run and demo directly.
        - If real-time data, external accounts, API credentials, or target-system access are missing, continue using the current input, workflow context, and reasonable assumptions; do not stop to ask for external dependencies.
        - Prefer self-contained, presentable, reusable demo output, and write it to workspace files when appropriate.
      tool_set:
      - exit
      - skill_tools
      - file_system
      max_iterations: 100
      session_id_strategy: auto
workflow:
- step: setup
  agent: worker
  priority: 10
  input: |-
    Create the directory {{var:output_dir}}/error_test if it doesn't exist.
    Create a file {{var:output_dir}}/error_test/setup.txt with content "Setup completed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/setup.md.
- step: risky_operation
  agent: worker
  depends_on:
  - setup
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: 1000
    max_delay: 5000
  input: |-
    Try to read the file {{var:output_dir}}/error_test/setup.txt.
    If successful, create {{var:output_dir}}/error_test/risky_result.txt with content "Risky operation succeeded".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/risky_operation.md.
  on_success:
  - next: success_handler
  on_failure:
  - next: error_handler
    message: Risky operation failed after retries
- step: success_handler
  agent: worker
  depends_on:
  - risky_operation
  input: |-
    Create a file {{var:output_dir}}/error_test/success.txt with content "Success path executed".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/success_handler.md.
- step: error_handler
  agent: fallback_worker
  depends_on:
  - risky_operation
  input: |-
    Create a file {{var:output_dir}}/error_test/error_handled.txt with content "Error was handled gracefully".
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/error_handler.md.
- step: cleanup
  agent: worker
  depends_on:
  - success_handler
  - error_handler
  input: |-
    List all files in {{var:output_dir}}/error_test/ directory.
    Create a file {{var:output_dir}}/error_test/report.txt with a summary of which files exist.
    Then call exit.

    Demo constraint: if external dependencies are missing, produce a presentable demo result directly; when appropriate, also save it to {{var:output_dir}}/cleanup.md.
error_handling:
  max_retries: 2
  retry_delay: 3s
  continue_on_error: true
timeout:
  total: 600s
  per_step: 180s
directory_isolation:
  enabled: true
  base_dir: ".workflow-runs"
  working_dir_pattern: "{base_dir}/{execution_id}/{step_name}/workspace"
  output_dir_pattern: "{base_dir}/{execution_id}/output"
  persistence_dir_pattern: "{base_dir}/{execution_id}/.snapshots"
  shared_cache_dir: ".prompt_cache"
  shared_history_dir: ".agent_history"
  shared_skills_dir: "./skills"
  cleanup_on_completion: false
  cleanup_after_hours: 72
concurrency:
  enabled: true
  max_concurrency: 4
global_agent:
  enabled: true
  agent:
    preset: universal
    overrides:
      system_prompt: |-
        You are a workflow template assistant that helps users understand, debug, and demo the current workflow.
        When generating or modifying YAML, use braidrun-workflow's snake_case syntax and keep the template runnable.
      tool_set:
      - workflow
      - file_system
      - exit
      max_iterations: 2048
      session_id_strategy: per_execution
