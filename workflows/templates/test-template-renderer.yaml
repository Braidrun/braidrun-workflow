---
name: test-template-renderer
version: 1.0.0
description: |
  Test harness for utility-module-template-renderer.

  Exercises both mustache and python_format syntaxes, including nested key
  resolution and missing-variable handling.

translations:
  en:
    name: "Template Renderer Test"
    description: "Test harness for utility-module-template-renderer. Exercises both mustache and python_format syntaxes, including nested key resolution and missing-variable handling."
  zh:
    name: "模板渲染器测试"
    description: "utility-module-template-renderer 的测试框架。覆盖 mustache 和 python_format 语法，包括嵌套键解析和缺失变量处理。"
  zhHant:
    name: "模板轉譯器測試"
    description: "utility-module-template-renderer 的測試框架。涵蓋 mustache 和 python_format 語法，包括巢狀鍵解析和缺失變數處理。"
  ja:
    name: "テンプレートレンダラーテスト"
    description: "utility-module-template-renderer のテストハーネスです。mustache と python_format の両方の構文を検証し、ネストしたキー解決と未定義変数の処理も含みます。"
  ko:
    name: "템플릿 렌더러 테스트"
    description: "utility-module-template-renderer용 테스트 하니스입니다. mustache와 python_format 구문을 모두 검증하며, 중첩 키 해석과 누락 변수 처리도 포함합니다."
  es:
    name: "Prueba de renderizador de plantillas"
    description: "Banco de pruebas para utility-module-template-renderer. Exercita las sintaxis mustache y python_format, incluida la resolución de claves anidadas y el manejo de variables faltantes."
  fr:
    name: "Test du rendu de modèles"
    description: "Banc d’essai pour utility-module-template-renderer. Il couvre les syntaxes mustache et python_format, y compris la résolution des clés imbriquées et la gestion des variables manquantes."
  de:
    name: "Template-Renderer-Test"
    description: "Test-Harness für utility-module-template-renderer. Prüft sowohl mustache- als auch python_format-Syntax, einschließlich der Auflösung verschachtelter Schlüssel und des Umgangs mit fehlenden Variablen."
  ar:
    name: "اختبار عرض القالب"
    description: "بيئة اختبار لـ utility-module-template-renderer. تغطي صياغتي mustache وpython_format، بما في ذلك حل المفاتيح المتداخلة والتعامل مع المتغيرات المفقودة."
  pt:
    name: "Teste de renderizador de template"
    description: "Banco de testes para utility-module-template-renderer. Exercita as sintaxes mustache e python_format, incluindo resolução de chaves aninhadas e tratamento de variáveis ausentes."
  vi:
    name: "Kiểm thử bộ hiển thị mẫu"
    description: "Bộ kiểm thử cho utility-module-template-renderer. Kiểm tra cả cú pháp mustache và python_format, bao gồm phân giải khóa lồng nhau và xử lý biến thiếu."
tags:
  - code
  - extract
  - sub_workflow

variables:
  tmpl_mustache: "Hello {{name}}, you have {{count}} new items (priority: {{meta.level}})."
  tmpl_python: "User: {user.name} / level: {user.level}"
  vars_json: |
    {"name": "alice", "count": 42, "meta": {"level": "high"}, "user": {"name": "bob", "level": "admin"}}

agents: {}

workflow:
  - step: render_mustache
    sub_workflow:
      name: utility-module-template-renderer
      inputs:
        template_text: "{{var:tmpl_mustache}}"
        variables_json: "{{var:vars_json}}"
        syntax: mustache
        strict: "true"
      outputs:
        mustache_rendered: rendered_text
        mustache_status: render_status
    priority: 10

  - step: render_python
    sub_workflow:
      name: utility-module-template-renderer
      inputs:
        template_text: "{{var:tmpl_python}}"
        variables_json: "{{var:vars_json}}"
        syntax: python_format
        strict: "false"
      outputs:
        python_rendered: rendered_text
        python_status: render_status
    priority: 9

  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os
        import sys

        mustache_rendered = os.environ.get("WF_VAR_MUSTACHE_RENDERED", "").strip()
        mustache_status = os.environ.get("WF_VAR_MUSTACHE_STATUS", "").strip()
        python_rendered = os.environ.get("WF_VAR_PYTHON_RENDERED", "").strip()
        python_status = os.environ.get("WF_VAR_PYTHON_STATUS", "").strip()

        problems = []
        if mustache_status != "ok":
            problems.append(f"mustache status != ok (got '{mustache_status}')")
        if python_status != "ok":
            problems.append(f"python status != ok (got '{python_status}')")

        expected_mustache = "Hello alice, you have 42 new items (priority: high)."
        if mustache_rendered != expected_mustache:
            problems.append(f"mustache output wrong: {mustache_rendered!r}")

        expected_python = "User: bob / level: admin"
        if python_rendered != expected_python:
            problems.append(f"python_format output wrong: {python_rendered!r}")

        if problems:
            print("TEST_STATUS=fail")
            for p in problems:
                print(f"  - {p}")
            sys.exit(1)
        else:
            print("TEST_STATUS=pass")
    extract:
      - pattern: 'TEST_STATUS=(\w+)'
        variable: test_status
    depends_on:
      - render_mustache
      - render_python
    priority: 5
