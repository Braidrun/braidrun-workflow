---
name: test-ssl-cert-expiry
version: 1.0.0
description: Test ssl-cert-expiry on google.com (always valid).
translations:
  en:
    name: "SSL Cert Expiry Test"
    description: "Test ssl-cert-expiry on google.com (always valid)."
  zh:
    name: "SSL 证书到期测试"
    description: "测试 google.com 上的 ssl-cert-expiry（始终有效）。"
  zhHant:
    name: "SSL 憑證到期測試"
    description: "測試 google.com 上的 ssl-cert-expiry（始終有效）。"
  ja:
    name: "SSL証明書有効期限テスト"
    description: "google.com 上の ssl-cert-expiry をテストします（常に有効）。"
  ko:
    name: "SSL 인증서 만료 테스트"
    description: "google.com의 ssl-cert-expiry를 테스트합니다(항상 유효함)."
  es:
    name: "Prueba de expiración de certificado SSL"
    description: "Prueba ssl-cert-expiry en google.com (siempre válido)."
  fr:
    name: "Test d’expiration du certificat SSL"
    description: "Teste ssl-cert-expiry sur google.com (toujours valide)."
  de:
    name: "SSL-Zertifikat-Ablauf-Test"
    description: "Testet ssl-cert-expiry auf google.com (immer gültig)."
  ar:
    name: "اختبار انتهاء صلاحية شهادة SSL"
    description: "اختبار ssl-cert-expiry على google.com (صالحة دائمًا)."
  pt:
    name: "Teste de expiração de certificado SSL"
    description: "Testa ssl-cert-expiry em google.com (sempre válido)."
  vi:
    name: "Kiểm thử hết hạn chứng chỉ SSL"
    description: "Kiểm thử ssl-cert-expiry trên google.com (luôn hợp lệ)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-ssl-cert-expiry
      inputs: {host: "google.com", port: "443"}
      outputs:
        cn: subject_cn
        issuer: issuer
        days: days_to_expiry
        expired: is_expired
        status: ssl_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        status = os.environ.get("WF_VAR_STATUS", "")
        expired = os.environ.get("WF_VAR_EXPIRED", "").strip().lower()
        days = int(os.environ.get("WF_VAR_DAYS", "0") or "0")
        issuer = os.environ.get("WF_VAR_ISSUER", "")
        if status != "ok": print(f"TEST_STATUS=fail\n  - status={status}"); sys.exit(1)
        if expired != "false": print(f"TEST_STATUS=fail\n  - google cert reported expired"); sys.exit(1)
        if days < 1 or days > 1000: print(f"TEST_STATUS=fail\n  - days out of range: {days}"); sys.exit(1)
        if not issuer: print("TEST_STATUS=fail\n  - issuer empty"); sys.exit(1)
        print(f"TEST_STATUS=pass (days_left={days})")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
