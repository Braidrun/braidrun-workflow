---
name: test-website-uptime
version: 1.0.0
description: Test website-uptime — mix of up (httpbin/200) and down (httpbin/500).
translations:
  en:
    name: "Website Uptime Test"
    description: "Test website-uptime — mix of up (httpbin/200) and down (httpbin/500)."
  zh:
    name: "网站正常运行时间测试"
    description: "测试 website-uptime——混合 up（httpbin/200）和 down（httpbin/500）。"
  zhHant:
    name: "網站正常運行時間測試"
    description: "測試 website-uptime——混合 up（httpbin/200）和 down（httpbin/500）。"
  ja:
    name: "Website 稼働率テスト"
    description: "website-uptime をテストします。up（httpbin/200）と down（httpbin/500）の混在です。"
  ko:
    name: "웹사이트 가동 시간 테스트"
    description: "website-uptime를 테스트합니다. up(httpbin/200)과 down(httpbin/500)이 혼합됩니다."
  es:
    name: "Prueba de disponibilidad del sitio web"
    description: "Probar website-uptime: mezcla de up (httpbin/200) y down (httpbin/500)."
  fr:
    name: "Test de disponibilité du site web"
    description: "Tester website-uptime : mélange de up (httpbin/200) et de down (httpbin/500)."
  de:
    name: "Website-Verfügbarkeits-Test"
    description: "website-uptime testen — Mischung aus up (httpbin/200) und down (httpbin/500)."
  ar:
    name: "اختبار مدة تشغيل الموقع"
    description: "اختبار website-uptime — مزيج من up (httpbin/200) و down (httpbin/500)."
  pt:
    name: "Teste de uptime do site"
    description: "Testar website-uptime — mistura de up (httpbin/200) e down (httpbin/500)."
  vi:
    name: "Kiểm thử thời gian hoạt động website"
    description: "Kiểm thử website-uptime — kết hợp up (httpbin/200) và down (httpbin/500)."
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-website-uptime
      inputs: {urls_csv: "https://httpbin.org/status/200,https://httpbin.org/status/500,https://httpbin.org/status/200"}
      outputs:
        up: up_count
        down: down_count
        total: total_count
        status: uptime_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status not ok")
        if os.environ.get("WF_VAR_UP") != "2": problems.append(f"up expected 2, got {os.environ.get('WF_VAR_UP')}")
        if os.environ.get("WF_VAR_DOWN") != "1": problems.append(f"down expected 1, got {os.environ.get('WF_VAR_DOWN')}")
        if os.environ.get("WF_VAR_TOTAL") != "3": problems.append(f"total expected 3, got {os.environ.get('WF_VAR_TOTAL')}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
