---
name: test-website-uptime
version: 1.0.0
description: Test website-uptime — mix of up (httpbin/200) and down (httpbin/500).
tags:
  - code
  - extract
  - sub_workflow

agents: {}
workflow:
  - step: run
    sub_workflow:
      name: utility-module-website-uptime
      inputs: {urls_csv: "https://httpbin.org/status/200,https://httpbin.org/status/500,https://httpbin.org/status/200"}
      outputs:
        up: up_count
        down: down_count
        total: total_count
        status: uptime_status
    priority: 10
  - step: assert
    code:
      language: python
      timeout: 15
      script: |
        import os, sys
        problems = []
        if os.environ.get("WF_VAR_STATUS") != "ok": problems.append("status not ok")
        if os.environ.get("WF_VAR_UP") != "2": problems.append(f"up expected 2, got {os.environ.get('WF_VAR_UP')}")
        if os.environ.get("WF_VAR_DOWN") != "1": problems.append(f"down expected 1, got {os.environ.get('WF_VAR_DOWN')}")
        if os.environ.get("WF_VAR_TOTAL") != "3": problems.append(f"total expected 3, got {os.environ.get('WF_VAR_TOTAL')}")
        if problems:
          print("TEST_STATUS=fail"); [print(f"  - {p}") for p in problems]; sys.exit(1)
        print("TEST_STATUS=pass")
    extract:
      - {pattern: 'TEST_STATUS=(\w+)', variable: test_status}
    depends_on: [run]
    priority: 5
